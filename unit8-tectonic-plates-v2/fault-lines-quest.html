<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fault Lines — Unit 8 Quest</title>
<style>
/* House style (navy + gold) from the Unit 5–7 decks. Accessible version: bigger type, Atkinson Hyperlegible, short lines. */
:root{
  --navy:#0A0B1C; --navy2:#121430; --panel:#18193a; --panel2:#22244d;
  --gold:#F6B44C; --gold-bright:#FFD37E; --coral:#F0674F; --cyan:#63E0D4; --violet:#A98BF0;
  --ink:#F4F2FA; --muted:#B4B1D3; --line:#3a3c6c; --good:#8FE07A;
  --magma:#FF7A3D; --plate:#3FB8A8;
  --display:Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',Verdana,Tahoma,'Segoe UI',sans-serif;
  --mono:'SF Mono',Consolas,Monaco,monospace;
  --fs:18px;
  --r-common:#9fb3c8; --r-rare:#63E0D4; --r-epic:#A98BF0; --r-legendary:#FFD37E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.live{--fs:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#bg{position:fixed;inset:0;z-index:0;display:block}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 55% at 50% 118%,rgba(255,110,40,.24),transparent 70%),radial-gradient(ellipse 70% 50% at 50% -5%,rgba(63,184,168,.16),transparent 70%)}
#boom{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* header */
header.bar{display:flex;align-items:center;gap:10px;padding:10px 18px 8px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;overflow:hidden;text-align:left}
.brand svg{width:40px;height:40px;flex:none}
.brand .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t{font-family:var(--display);font-size:21px;font-weight:700;color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player{display:flex;align-items:center;gap:10px;background:rgba(24,25,58,.88);border:1.5px solid var(--line);border-radius:100px;padding:4px 14px 4px 5px;flex:none}
.player .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 35%,#ffe7ad,#F6B44C 60%,#9a6512)}
.player .lv{font-size:12px;color:var(--muted);line-height:1.1}
.player .lv b{color:var(--gold-bright);font-size:14px}
.xpbar{width:110px;height:8px;border-radius:100px;background:var(--panel2);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--plate),var(--gold),var(--magma));transition:width .5s}
.streak{font-weight:700;color:var(--coral);font-size:15px;min-width:0;display:none}
.streak.on{display:block}
.icon{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:rgba(24,25,58,.88);font-size:17px;flex:none;position:relative}
.icon.on{border-color:var(--cyan);background:rgba(99,224,212,.18)}
.icon .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill{height:40px;padding:0 12px;border-radius:100px;border:1.5px solid var(--line);background:rgba(24,25,58,.88);font-weight:700;font-size:12px;font-family:var(--mono);letter-spacing:.08em;white-space:nowrap;flex:none}
.pill.on{border-color:var(--coral);color:#fff;background:rgba(240,103,79,.22)}
.livescore{display:none;align-items:center;gap:8px;background:rgba(24,25,58,.88);border:1.5px solid var(--line);border-radius:100px;padding:5px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.livescore b{font-family:var(--display);font-size:20px}
body.live .livescore{display:flex}

/* main */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:4px 18px 14px;max-width:1280px;width:100%;margin:0 auto}
.chatcol{display:flex;flex-direction:column;min-height:0;background:rgba(18,20,48,.6);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.feed{flex:1 1 auto;overflow-y:auto;padding:18px 20px 10px;overscroll-behavior:contain}
.dock{flex:0 0 auto;border-top:1.5px solid var(--line);background:rgba(10,11,28,.9);padding:12px 14px 14px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}

/* chat */
.msg{display:flex;gap:10px;margin:0 0 12px;align-items:flex-end;animation:pop .28s ease}
.msg .av{width:40px;height:46px;flex:none;display:grid;place-items:center}.msg .av svg{width:40px;height:46px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}.msg .av .eye{transform-origin:center;transform-box:fill-box;animation:tblink 4s infinite}@keyframes tblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.qbanner{width:100%;max-width:760px;height:auto;display:block;margin:0 auto 10px;border-radius:18px;border:2px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.chatcol.shake{animation:qsh .45s}@keyframes qsh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
#fxc{position:fixed;inset:0;z-index:75;pointer-events:none}
.bub{max-width:min(620px,86%);padding:12px 16px;border-radius:20px 20px 20px 6px;background:rgba(34,36,77,.96);border:1.5px solid var(--line);position:relative}
.bub b{color:var(--gold-bright)}
.bub .say{margin-left:8px;font-size:14px;opacity:.6;vertical-align:middle}
.bub .say:hover{opacity:1}
.vocab{color:var(--gold-bright);font-weight:700;border-bottom:2px dotted var(--gold);padding:0;line-height:1.2}
.msg.me{justify-content:flex-end}
.msg.me .bub{border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,rgba(246,180,76,.26),rgba(240,103,79,.18));border-color:var(--gold)}
.typing .bub{display:flex;gap:5px;padding:15px 16px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.figure{margin:0 0 12px 46px;max-width:620px;border-radius:16px;border:1.5px solid var(--line);background:#07081a;overflow:hidden;animation:pop .3s ease}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:15px;color:var(--muted);padding:6px 12px 8px;border-top:1px solid var(--line)}
.chipline{margin:-4px 0 12px 46px;display:flex;gap:8px;flex-wrap:wrap;animation:pop .3s ease}
.chip{font-weight:700;font-size:14px;padding:4px 12px;border-radius:100px}
.chip.good{color:#0b2a06;background:var(--good)} .chip.gold{color:#2a1a00;background:var(--gold-bright)} .chip.fire{color:#2a0700;background:linear-gradient(135deg,#ffb27a,var(--magma))}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.casehead{text-align:center;margin:2px 0 16px;animation:pop .35s ease}
.casehead .n{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.casehead h2{font-family:var(--display);font-size:32px;color:#fff;margin-top:2px;line-height:1.15}
.casehead p{color:var(--muted);font-size:17px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:100px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold));width:max-content}
.tag.vi{background:linear-gradient(135deg,#cbb8ff,var(--violet));color:#160b33}
.tag.co{background:linear-gradient(135deg,#ffb09f,var(--coral));color:#2a0700}
.tag.cy{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f}

/* math */
.mathcard{margin:0 0 12px 46px;max-width:620px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(24,25,58,.94);border:2px solid var(--violet);animation:pop .3s ease}
.mathcard .tag{grid-column:1/-1}
.given .row{display:flex;justify-content:space-between;gap:10px;font-size:17px;padding:6px 0;border-bottom:1px dashed var(--line)}
.given .row b{color:var(--gold-bright);text-align:right;font-size:18px}
.formula{font-size:18px;font-weight:700;color:var(--cyan);background:rgba(99,224,212,.1);border:2px solid rgba(99,224,212,.45);border-radius:14px;padding:12px;align-self:start;text-align:center}
.steps{list-style:none;display:grid;gap:6px;margin:0 0 12px 46px;max-width:620px}
.steps li{display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-radius:14px;background:rgba(24,25,58,.95);border:1.5px solid var(--good);font-size:18px;opacity:0;animation:pop .4s ease forwards}
.steps li b{font-family:var(--mono);font-size:12px;color:var(--good);letter-spacing:.1em;flex:none}

/* dead end */
.deadend{margin:4px 0 14px 46px;max-width:620px;border-radius:20px;padding:16px 18px;background:linear-gradient(135deg,rgba(240,103,79,.18),rgba(24,25,58,.96));border:2px solid var(--coral);animation:shakeIn .45s ease}
@keyframes shakeIn{0%{transform:translateX(0);opacity:0}20%{transform:translateX(-8px);opacity:1}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}100%{transform:none}}
.deadend h3{font-family:var(--display);font-size:25px;color:#fff;margin:6px 0 8px;line-height:1.2}
.deadend .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.deadend .row span{flex:none;font-size:22px;line-height:1.2}
.deadend .row b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.deadend .why b{color:var(--gold)} .deadend .fix b{color:var(--good)}
.deadend .new{font-size:14px;color:var(--gold-bright);margin-top:6px}

/* closed */
.closed{margin:8px 0 14px;border-radius:22px;padding:20px;background:linear-gradient(135deg,rgba(63,184,168,.2),rgba(24,25,58,.96));border:2px solid var(--plate);animation:pop .4s ease}
.closed h3{font-family:var(--display);font-size:30px;color:#fff;margin:6px 0 4px}
.closed ul{list-style:none;margin:10px 0 0;display:grid;gap:8px}
.closed li{padding-left:30px;position:relative}
.closed li::before{content:"✅";position:absolute;left:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1;min-width:110px;background:rgba(10,11,28,.6);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;color:#fff}

/* dock */
.banner{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;border-radius:14px;padding:8px 14px;font-weight:700}
.banner.gold{display:flex;background:linear-gradient(135deg,rgba(255,211,126,.22),rgba(246,180,76,.1));border:2px solid var(--gold-bright);color:var(--gold-bright);animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 0 22px rgba(255,211,126,.45)}}
.vote{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;border-radius:14px;padding:8px 14px;background:linear-gradient(135deg,rgba(246,180,76,.16),rgba(240,103,79,.1));border:2px solid var(--gold)}
body.live .vote.show{display:flex}
.vote .timer{font-family:var(--display);font-size:26px;font-weight:700;color:var(--gold-bright)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:rgba(24,25,58,.94);border:2.5px solid var(--line);border-radius:18px;padding:12px 16px;line-height:1.3;font-size:calc(var(--fs) + 1px);transition:border-color .2s,transform .12s;min-height:60px}
.choice:hover{border-color:var(--gold);transform:translateY(-2px)}
.choice .L{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold))}
.choice.tried{border-style:dashed;opacity:.65}
.choice.tried .L{background:var(--coral)}
.choice .tr{margin-left:auto;flex:none;font-size:13px;color:var(--coral);font-weight:700;white-space:nowrap}
.choice.solo{justify-content:center;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tbtn{font-size:15px;font-weight:700;padding:7px 12px;border-radius:100px;border:1.5px solid var(--line);background:rgba(24,25,58,.9)}
.tbtn:hover{border-color:var(--cyan)}
.tbtn.hint{border-color:var(--gold);color:var(--gold-bright)}
.kb{font-size:13px;color:var(--muted)}
.dockrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-weight:700;font-size:17px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1200;box-shadow:0 4px 18px rgba(246,180,76,.3);transition:transform .12s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:rgba(24,25,58,.85);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.co{background:linear-gradient(135deg,#ffb09f,var(--coral));color:#2a0700}
.btn.pl{background:linear-gradient(135deg,#8ff0e2,var(--plate));color:#04231f}
.btn.big{font-size:20px;padding:14px 26px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* side */
.panel{background:rgba(24,25,58,.85);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.panel h4{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;display:flex;justify-content:space-between}
.panel h4 span{color:var(--muted)}
.pcard{text-align:center}
.pcard .bigav{font-size:46px;line-height:1}
.pcard .rk{font-family:var(--display);font-size:22px;font-weight:700;color:var(--gold-bright);margin-top:4px}
.pcard .lvl{color:var(--muted);font-size:15px}
.pcard .xpbar{width:100%;height:12px;margin-top:8px}
.pcard .nx{font-size:13px;color:var(--muted);margin-top:4px}
.pathdots{display:flex;gap:8px;flex-wrap:wrap}
.pathdots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--navy2);display:grid;place-items:center;font-size:11px;font-style:normal}
.pathdots i.ok{background:var(--good);border-color:var(--good)}
.pathdots i.now{border-color:var(--gold-bright);box-shadow:0 0 0 4px rgba(246,180,76,.25)}
.minicards{display:flex;gap:8px;flex-wrap:wrap}
.minicards span{width:44px;height:56px;border-radius:8px;display:grid;place-items:center;font-size:22px;border:2px solid var(--line);background:var(--navy2)}
.minicards span.got{border-color:var(--gold);background:rgba(246,180,76,.12)}
.meter{height:10px;border-radius:100px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--magma));transition:width .4s}

/* hub */
.hub{max-width:980px;margin:0 auto}
.hero{display:flex;gap:18px;align-items:center;margin:4px 0 16px}
.hero h1{font-family:var(--display);font-size:40px;line-height:1.08;color:#fff}
.hero p{color:var(--muted);font-size:18px;margin-top:6px;max-width:56ch}
.how{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.how span{flex:1;min-width:180px;background:rgba(24,25,58,.8);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
.secth{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;margin:16px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.hubmore{display:flex;gap:8px;justify-content:center;margin-top:12px}
.tile{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:rgba(24,25,58,.9);border:2px solid var(--line);transition:border-color .2s,transform .15s;min-height:150px;position:relative}
.tile:hover{border-color:var(--gold);transform:translateY(-3px)}
.tile .ic{font-size:30px}
.tile .num{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
.tile .ti{font-family:var(--display);font-size:20px;font-weight:700;color:#fff;line-height:1.15}
.tile .st{margin-top:auto;font-size:13px;color:var(--muted)}
.tile.done{border-color:var(--plate);background:linear-gradient(160deg,rgba(63,184,168,.2),rgba(24,25,58,.9))}
.tile.done .st{color:var(--plate);font-weight:700}
.tile.special{border-color:var(--violet);background:linear-gradient(160deg,rgba(169,139,240,.2),rgba(24,25,58,.9))}
.tile.boss{border-color:var(--magma);background:linear-gradient(160deg,rgba(255,122,61,.25),rgba(24,25,58,.9))}
.tile.locked{opacity:.6}
.tile .lock{position:absolute;top:10px;right:12px;font-size:20px}

/* lab */
.lab h2,.arena h2{font-family:var(--display);font-size:30px;color:#fff;text-align:center}
.lab .sub,.arena .sub{text-align:center;color:var(--muted);margin-bottom:12px}
.lab canvas{width:100%;display:block;border-radius:18px;border:1.5px solid var(--line);background:#07081a}
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mission{font-size:15px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:rgba(24,25,58,.9);display:flex;gap:8px;align-items:center}
.mission.got{border-color:var(--good);background:rgba(143,224,122,.12)}
.result{margin-top:12px;padding:14px 16px;border-radius:16px;border:2px solid var(--plate);background:rgba(63,184,168,.12);display:none}
.result.show{display:block;animation:pop .35s ease}
.result h3{font-family:var(--display);font-size:24px;color:#fff}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg>span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.seg .opts{display:flex;gap:6px}
.seg button{flex:1;padding:10px 8px;border-radius:12px;border:2px solid var(--line);background:rgba(24,25,58,.9);font-weight:700;font-size:16px}
.seg button.on{border-color:var(--gold);background:rgba(246,180,76,.18);color:var(--gold-bright)}
.motions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

/* boss */
.arena{max-width:760px;margin:0 auto}
.bossbox{display:grid;place-items:center;margin:4px 0 6px}
.bossbox svg{width:210px;height:auto;transition:transform .2s}
.bossbox.hit svg{animation:hit .45s ease}
@keyframes hit{20%{transform:translateX(-14px) rotate(-6deg);filter:brightness(2)}50%{transform:translateX(12px) rotate(5deg)}100%{transform:none}}
.hp{height:22px;border-radius:100px;background:var(--panel2);overflow:hidden;border:2px solid var(--magma);position:relative}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d2e,var(--magma),var(--gold));transition:width .5s}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
.shields{text-align:center;font-size:30px;margin:8px 0;letter-spacing:6px}
.bq{font-family:var(--display);font-size:27px;color:#fff;text-align:center;margin:8px 0 4px;line-height:1.25}
.dmg{position:fixed;left:50%;top:32%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:48px;color:var(--gold-bright);text-shadow:0 0 20px rgba(255,122,61,.8);pointer-events:none;z-index:60;animation:dmg 1s ease forwards}

 lystro:{card:"c_meso",m:["Yes! 🧩 Another clue: <b>Lystrosaurus</b>, a land reptile, is found in India, Africa, and <b>Antarctica</b>.","Why is it in icy Antarctica?"],
  c:[["Antarctica was once warmer and joined to them","glosso",1],["It loved ice and snow","d_ice"]]},
 d_ice:D("An ice-loving reptile","Some animals live in the cold.","Reptiles need warmth. Antarctica used to be warmer and joined to other lands."),
 glosso:{m:["Right! Antarctica moved south later. ❄️","A plant called <b>Glossopteris</b> had heavy seeds, too heavy to blow across an ocean. 🌿","Its fossils are on 5 southern continents. What does that tell you?"],
  c:[["Those lands were once connected","age",1],["The seeds blew across the oceans","d_seeds"]]},
 d_seeds:D("Seeds blew across","Seeds do travel on the wind.","These seeds were too heavy to blow that far. The lands had to be connected."),
 age:{card:"c_glosso",gold:1,hint:"Subtract: the bigger number minus the smaller number.",m:["Fossil math time! 🧮",{math:{given:[["Mesosaurus lived","280 million years ago"],["Lystrosaurus lived","250 million years ago"]],formula:"difference = bigger − smaller"}},"How many million years apart did they live?"],
  c:[["30 million years","svalbard",1,["280 − 250 = 30","They lived 30 million years apart."]],["530 million years","d_addf"],["25 million years","d_subf"]]},
 d_addf:D("Added instead","Fossils are old, so a big number feels right.","“How far apart” means subtract: 280 − 250 = 30."),
 d_subf:D("Subtraction slip","25 looks close.","280 − 250: 8 − 5 = 3, and 0 − 0 = 0. That’s 30."),
 svalbard:{m:["Last clue! 🌴 Fossils of warm-weather plants were found on <b>Svalbard</b>, icy islands near the North Pole.","How did they get there?"],
  c:[["Svalbard used to be closer to the equator","check",1],["The plants grew under the snow","d_snow"]]},
 d_snow:D("Plants under snow","Some plants survive winter.","These plants needed warm weather and sunlight. The island had to be somewhere warmer."),
 check:{m:["Quick check! ✅ What did fossils do for Wegener’s idea?"],
  c:[["They gave evidence that the continents moved","end",1],["They proved the coastlines fit","d_fit"]]},
 d_fit:D("Mixing up clues","Fossils and the puzzle fit agree.","The puzzle fit is about shapes. Fossils are a different clue. Lots of clues together make strong evidence."),
 end:{end:1,m:["Case closed! 🦕 Fossils show these continents were once connected."]}
}},

{id:"stripes",icon:"🧲",title:"The Striped Seafloor",lesson:"Magnetism and Plate Tectonics",blurb:"Hidden stripes turn the seafloor into a clock.",
 recap:["Cooling lava freezes Earth’s magnetic direction, like a frozen compass.","Earth’s magnetic poles have flipped many times.","The stripes match on both sides of the ridge: <b>seafloor spreading</b>.","Speed = distance ÷ time. The seafloor spreads a few cm per year."],
 nodes:{
 start:{m:["It’s the 1950s. Ships measure <b>magnetism</b> in the seafloor. 🧲","They find <b>stripes</b>! Some point north. Some point south.","How does rock get magnetic?"],
  c:[["Iron bits in cooling lava point north, then freeze","mirror",1],["Lightning hits the seafloor","d_light"]]},
 d_light:D("Lightning did it","Lightning can make rock magnetic.","Lightning can’t reach the deep seafloor. And it makes messy spots, not long neat stripes."),
 mirror:{card:"c_compass",m:["Yes! The rock is like a frozen compass. 🧭",{fig:"stripes"},"The stripes are the <b>same on both sides</b> of the ridge, like a mirror. Why?"],
  c:[["New seafloor forms at the ridge and spreads both ways","flip",1],["It’s just random","d_random"]]},
 d_random:D("It’s just random","Patterns can happen by chance.","Random stripes wouldn’t match perfectly on both sides of every ridge on Earth."),
 flip:{m:["That’s <b>seafloor spreading</b>! 🌊","Some stripes point the opposite way. What does that mean?"],
  c:[["Earth’s magnetic poles have flipped many times","rate",1],["The rocks flipped upside down","d_upside"]]},
 d_upside:D("The rocks flipped","Backwards magnetism seems like flipped rock.","The rock layers aren’t upside down. Earth’s magnetic field flipped, not the rocks."),
 rate:{gold:1,hint:"First turn km into cm (× 100,000). Then divide by the years.",m:["The stripes work like a clock! ⏱️",{math:{given:[["Distance from ridge","50 km"],["Age of the rock","2,500,000 years"],["1 km","100,000 cm"]],formula:"speed = distance ÷ time"}},"How fast did the seafloor spread?"],
  c:[["2 cm per year","jdf",1,["50 km × 100,000 = 5,000,000 cm","5,000,000 ÷ 2,500,000 = 2 cm per year","About as fast as your fingernails grow!"]],["20 km per year","d_units"],["0.5 cm per year","d_divflip"]]},
 d_units:D("Forgot to change units","50 and 2.5 look like they make 20.","Change km to cm first. 5,000,000 cm ÷ 2,500,000 years = 2 cm per year."),
 d_divflip:D("Divided backwards","Both numbers are right there.","Speed is distance ÷ time. Put the distance first: 5,000,000 ÷ 2,500,000 = 2."),
 jdf:{card:"c_ridge",hint:"Multiply 4 × 1,000,000. Then divide by 100,000 to get km.",m:["Nice! 🎯 The <b>Juan de Fuca Plate</b> near Washington moves about 4 cm per year.",{math:{given:[["Speed","4 cm each year"],["Time","1,000,000 years"],["1 km","100,000 cm"]],formula:"distance = speed × time"}},"How far does it move in 1 million years?"],
  c:[["4 km","d_conv"],["40 km","end",1,["4 × 1,000,000 = 4,000,000 cm","4,000,000 ÷ 100,000 = 40 km","A few cm a year adds up to a lot!"]],["400 km","d_conv2"]]},
 d_conv:D("Too small","Dividing by a big number is easy to overdo.","4,000,000 cm ÷ 100,000 = 40 km. Count the zeros carefully."),
 d_conv2:D("Too big","Big times make big answers.","4,000,000 cm ÷ 100,000 = 40 km, not 400."),
 end:{end:1,m:["Case closed! 🧲 The seafloor proves plates move, and shows how fast."]}
}},

{id:"rocks",icon:"🪨",title:"Rocks Tell Time",lesson:"Age of Rock and Plate Tectonics",blurb:"Glacier marks in Africa? Kangaroos? Rocks explain it.",
 recap:["Ocean crust sinks back into Earth, so the seafloor is young.","The oldest rocks are in <b>cratons</b>, in the middle of continents.","Matching mountains and rocks show the continents were joined.","When land split, animals changed on their own (like kangaroos)."],
 nodes:{
 start:{m:["Rocks are like a history book. 📖","Where would you find Earth’s <b>oldest</b> rocks?"],
  c:[["Deep on the ocean floor","x_ocean"],["In the middle of continents","cratons",1]]},
 x_ocean:{m:["Let’s check! 🔍 The oldest seafloor is only about <b>200 million</b> years old. Some continent rock is over <b>4 billion</b>!","Why is the seafloor so young?"],
  c:[["Ocean crust sinks back into Earth and gets recycled","cratons",1],["Water washes it away","d_wash"]]},
 d_wash:D("Water washes it away","Water does wear down rock.","Water is way too slow. Ocean crust is heavy, so it sinks back into the mantle and gets recycled."),
 cratons:{card:"c_craton",m:["Right! Old, stable rock in the middle of continents is called a craton. 🪨","<b>Cratons</b> in South America and Africa line up perfectly. When did those continents split?"],
  c:[["About 180 million years ago","speed",1],["About 6,000 years ago","d_6000"]]},
 d_6000:D("A young Earth","Long ago, people thought Earth was 6,000 years old.","Plates move only a few cm a year. In 6,000 years, that’s only about 120 meters, not a whole ocean!"),
 speed:{gold:1,hint:"Change km to cm (× 100,000). Then divide by the years.",m:["Let’s check it with math! 🧮",{math:{given:[["Ocean width","5,000 km"],["Time","180,000,000 years"],["1 km","100,000 cm"]],formula:"speed = distance ÷ time"}},"About how fast did they move apart?"],
  c:[["About 2.8 cm per year","mtns",1,["5,000 × 100,000 = 500,000,000 cm","500,000,000 ÷ 180,000,000 ≈ 2.8 cm per year","That matches the seafloor stripes. Two methods agree!"]],["About 28 km per year","d_units2"],["About 0.36 cm per year","d_flip2"]]},
 d_units2:D("Forgot to change units","5,000 ÷ 180 is about 28.","At 28 km a year, Africa would cross the ocean in 200 years! Change km to cm first."),
 d_flip2:D("Divided backwards","Both big numbers are right there.","Speed is distance ÷ time. Distance goes first."),
 mtns:{m:["Next clue! ⛰️ The <b>Appalachian Mountains</b> match old mountains in Europe and Africa.","Why?"],
  c:[["They were one chain before Pangaea split","climate",1],["Two chains formed the same way by luck","d_luck"]]},
 d_luck:D("Just luck","Mountains form the same way everywhere.","Same rocks, same age, and they line up when you close the ocean. That’s one chain, not luck."),
 climate:{m:["Weird clue! 🧊 Old glacier scratches are found in hot places like Africa and India.","How?"],
  c:[["Those lands were once near the South Pole","marsup",1],["The whole Earth froze","d_freeze"]]},
 d_freeze:D("The whole Earth froze","Ice ages are real.","At the same time, warm swamps grew in other places. Only lands near the South Pole had glaciers."),
 marsup:{card:"c_kangaroo",m:["Last clue! 🦘 Australia has kangaroos and koalas. They are <b>marsupials</b>.","Why is Australia’s wildlife so different?"],
  c:[["Australia split off, and its animals changed on their own","end",1],["Kangaroos swam there","d_swimk"]]},
 d_swimk:D("They swam there","Animals do travel.","Kangaroos can’t swim across oceans. Their ancestors were already there when the lands were joined."),
 end:{end:1,m:["Case closed! 🪨 Rocks, mountains, ice, and animals all agree: the land moved."]}
}},

{id:"engine",icon:"♨️",title:"The Engine Below",lesson:"Thermal Convection Lab",blurb:"What moves the plates? Build the model.",
 recap:["<b>Convection</b>: hot material rises, cools, sinks, and heats again.","Heat comes from deep inside Earth.","The mantle is solid rock that flows slowly, like putty.","Where mantle rock rises, plates pull apart. Where it sinks, plates come together."],
 nodes:{
 start:{m:["Lab time! 🔥 A pot of water sits on a hot burner.","Red dye at the bottom gets hot. What does it do?"],
  c:[["It rises up","top",1],["It sinks down","d_sink"]]},
 d_sink:D("Hot stuff sinks","The flame is at the bottom.","Hot water spreads out and gets lighter, so it rises. Just like a hot-air balloon! 🎈"),
 top:{m:["Yes! ⬆️ At the top, the water cools down.","What happens next?"],
  c:[["It sinks back down and makes a loop","earth",1],["It keeps going up forever","d_up"]]},
 d_up:D("It keeps rising","Steam rises out of pots.","Most of the water cools, gets heavier, and sinks. Up, cool, down, heat, repeat!"),
 earth:{card:"c_convection",m:["That loop is called <b>convection</b>! 🔄",{fig:"convection"},"Earth’s <b>mantle</b> does this too, very slowly. What heats it?"],
  c:[["Heat from deep inside Earth","depth",1],["The Sun","d_sun"]]},
 d_sun:D("The Sun heats it","The Sun warms the ground.","Sunlight only warms the top few meters. It gets hotter the deeper you dig, so the heat comes from inside."),
 depth:{gold:1,hint:"It gets 25 °C hotter for EACH km. Multiply 25 × 4.",m:["Underground math! ⛏️",{math:{given:[["Rock gets hotter","25 °C every km"],["Depth","4 km"]],formula:"heat added = 25 × km"}},"How much hotter is the rock 4 km down?"],
  c:[["29 °C","d_add5"],["100 °C","solid",1,["25 × 4 = 100","100 °C hotter. That’s as hot as boiling water!"]],["6 °C","d_div5"]]},
 d_add5:D("Added instead","25 + 4 is quick.","It gets 25 °C hotter EACH km, for 4 km. Multiply: 25 × 4 = 100."),
 d_div5:D("Divided","A small number seems safe.","Each km adds 25 more degrees. 25 × 4 = 100."),
 solid:{m:["Big question! 🌋 Is the mantle a sea of liquid lava?"],
  c:[["Yes, plates float on lava","x_liquid"],["No, it’s solid rock that flows slowly, like putty","cells",1]]},
 x_liquid:{m:["Remember Unit 7! <b>S waves</b> can’t travel through liquid.","But S waves DO travel through the mantle. So…"],
  c:[["The mantle must be solid","d_liquid"]]},
 d_liquid:D("A sea of lava","Volcanoes pour out lava.","S waves pass through the mantle, so it’s solid. It’s hot, soft rock that flows very slowly, like putty."),
 cells:{card:"c_mantle",m:["Exactly! 👍","Where hot mantle rock <b>rises</b>, what happens to the plates on top?"],
  c:[["They pull apart","end",1],["They crash together","d_flipb"]]},
 d_flipb:D("Flipped it","Arrows meeting look like a crash.","Rising rock spreads out to both sides, like the water in the pot. That pulls plates apart."),
 end:{end:1,m:["Case closed! ♨️ Heat + slowly flowing rock = the engine that moves the plates."]}
}},

{id:"boundaries",icon:"⛰️",title:"Boundary Builder",lesson:"Plates and Land Features",blurb:"Mountains, trenches, and valleys. Who built them?",
 recap:["<b>Divergent</b> (pull apart): ridges and rift valleys.","<b>Convergent</b> (push together): mountains, trenches, volcanoes.","<b>Transform</b> (slide past): faults and earthquakes.","Heavy ocean plates dive under other plates. That’s subduction."],
 nodes:{
 start:{m:["Plates meet in 3 ways:",{fig:"boundaries"},"<b>Divergent</b> = pull apart. <b>Convergent</b> = push together. <b>Transform</b> = slide past.","India is crashing into Asia. Both are continents. What forms? 🏔️"],
  c:[["Huge mountains: the Himalayas!","grow",1],["A deep ocean trench","d_himtr"]]},
 d_himtr:D("A trench","Crashing plates can make trenches.","Continents are too light to sink. They crumple up into mountains, like a rug pushed against a wall."),
 grow:{card:"c_everest",gold:1,hint:"It grows 1 cm EACH year, for 100 years. Multiply.",m:["Yes! Mount Everest is there, and it’s still growing! ⛰️",{math:{given:[["Himalayas grow","about 1 cm each year"],["Time","100 years"],["100 cm","1 meter"]],formula:"growth = cm per year × years"}},"How much taller will they get in 100 years?"],
  c:[["101 cm","d_addh"],["100 cm (1 meter)","trench",1,["1 × 100 = 100 cm","100 cm = 1 meter. Taller than a kitchen table!"]],["1 cm","d_oneh"]]},
 d_addh:D("Added","1 + 100 = 101 is quick.","It grows 1 cm EACH year for 100 years. 1 × 100 = 100 cm."),
 d_oneh:D("Only one year","1 cm is the number you see.","That’s just one year. 100 years × 1 cm = 100 cm."),
 trench:{m:["Now two <b>ocean</b> plates crash. One dives under the other. 🌊 This is called <b>subduction</b>.","Which plate dives?"],
  c:[["The older, heavier one","rift",1],["The newer, lighter one","d_young"]]},
 d_young:D("The young plate sinks","New things seem weaker.","Heavy things sink. Old ocean crust is colder and heavier, so it dives and makes a deep trench."),
 rift:{card:"c_mariana",m:["Right! That made the <b>Mariana Trench</b>, the deepest spot on Earth. 🕳️","In East Africa, the land is cracking open into a long valley. What’s happening?"],
  c:[["Plates are pulling apart","vents",1],["A river carved it","d_river"]]},
 d_river:D("A river did it","Rivers do carve valleys.","This valley is long and straight, with volcanoes and earthquakes. That means plates are pulling apart."),
 vents:{m:["Yes! 🌋 Deep on the seafloor, <b>hydrothermal vents</b> shoot out super hot water. Animals live there with no sunlight!","Where do they get food energy?"],
  c:[["Bacteria make food from chemicals","sa",1],["From sunlight","d_sunv"]]},
 d_sunv:D("From sunlight","Most food chains start with sunlight.","Sunlight can’t reach that deep. Bacteria use chemicals from the vents to make food. That’s chemosynthesis."),
 sa:{m:["Last one! 🌉 California’s <b>San Andreas Fault</b>: two plates slide past each other.","Which type of boundary?"],
  c:[["Transform","end",1],["Convergent","d_sa"]]},
 d_sa:D("Convergent","California has big earthquakes.","The plates aren’t crashing head-on. They slide sideways past each other. That’s transform."),
 end:{end:1,m:["Case closed! ⛰️ You can read a landform and tell how the plates moved."]}
}},

{id:"volcanoes",icon:"🌋",title:"Volcano Forensics",lesson:"Volcanoes · Plates and Volcanoes",blurb:"Three suspects, one hotspot, and a broken rule.",
 recap:["<b>Stratovolcano</b>: tall, steep, layered, explosive.","<b>Shield</b>: wide, gentle, runny lava. <b>Cinder cone</b>: small, steep, lava chunks.","Diving plates melt and make volcanoes near plate edges.","A <b>hotspot</b> can make volcanoes in the middle of a plate (Hawaii)."],
 nodes:{
 start:{m:["Volcano detectives! 🕵️ Look at the three types.",{fig:"volcanoes"},"Suspect #1: tall and steep. Made of <b>layers</b>. Sticky lava. Big <b>explosions</b>!","What type?"],
  c:[["Stratovolcano","v2",1],["Shield volcano","d_v1"]]},
 d_v1:D("Shield volcano","Shield volcanoes are huge too.","Shield volcanoes have runny lava and gentle slopes. Steep + layers + explosions = stratovolcano."),
 v2:{card:"c_strato",m:["Correct! Like Mount St. Helens. 💥","Suspect #2: wide and gentle, like a shield lying on the ground. Runny lava. Quiet eruptions.","What type?"],
  c:[["Shield volcano","v3",1],["Cinder cone","d_v2"]]},
 d_v2:D("Cinder cone","Both are made of lava.","Cinder cones are small and steep. Wide + gentle + runny lava = shield volcano, like Mauna Loa in Hawaii."),
 v3:{m:["Yes! 🛡️ Suspect #3: a small, steep hill made of lava chunks. It grew out of a cornfield in Mexico in 1943! 🌽","What type?"],
  c:[["Cinder cone","where",1],["Stratovolcano","d_v3"]]},
 d_v3:D("Stratovolcano","It’s steep.","Stratovolcanoes are huge and layered. Small + steep + lava chunks = cinder cone."),
 where:{m:["All solved! 🎉 Now, <b>where</b> do volcanoes form?",{fig:"subduction"},"Near Mount St. Helens, an ocean plate dives under North America. Why does that make volcanoes?"],
  c:[["The diving plate melts, and magma rises","hawaii",1],["Ocean water heats up the land","d_water"]]},
 d_water:D("Hot ocean water","Volcanoes are near the coast.","Ocean water actually cools things. Deep down, the diving plate melts into magma, and the magma rises."),
 hawaii:{m:["Rule: “Volcanoes form where plates meet.” 🤔","But Hawaii is in the <b>middle</b> of a plate! Keep the rule?"],
  c:[["Change it: a hotspot can melt through","speed",1],["Keep it: there’s a hidden plate edge","x_hidden"]]},
 x_hidden:{m:["Maps show no plate edge near Hawaii. And the islands get older in a straight line. 🏝️🏝️🏝️"],
  c:[["The rule needs to change","d_hidden"]]},
 d_hidden:D("A hidden edge","Most volcanoes ARE at plate edges.","Most isn’t all! A <b>hotspot</b> is a hot plume under the plate. The plate slides over it and makes a chain of islands."),
 speed:{card:"c_hawaii",gold:1,hint:"Change 500 km to cm (× 100,000). Then divide by 5,000,000.",m:["Great science thinking! 🧠",{fig:"hotspot"},{math:{given:[["Kauai island’s age","about 5,000,000 years"],["Distance from hotspot","about 500 km"],["1 km","100,000 cm"]],formula:"speed = distance ÷ time"}},"How fast is the Pacific Plate moving?"],
  c:[["About 1 cm per year","d_hs1"],["About 10 cm per year","iceland",1,["500 × 100,000 = 50,000,000 cm","50,000,000 ÷ 5,000,000 = 10 cm per year","One of the fastest plates on Earth!"]],["About 100 km per year","d_hs2"]]},
 d_hs1:D("Lost a zero","So many zeros!","500 km = 50,000,000 cm. Then 50,000,000 ÷ 5,000,000 = 10 cm per year."),
 d_hs2:D("Forgot to change units","500 ÷ 5 = 100 is right there.","It’s 5 MILLION years, and km must become cm. The answer is 10 cm per year."),
 iceland:{m:["Last suspect: Iceland 🇮🇸 is splitting in half, and it has lots of volcanoes.","Which boundary?"],
  c:[["Divergent: pulling apart","end",1],["Convergent: crashing","d_ice1"]]},
 d_ice1:D("Convergent","Volcanoes + earthquakes sound like a crash.","Iceland is being pulled apart. Magma rises up into the crack. That’s divergent."),
 end:{end:1,m:["Case closed! 🌋 The shape tells you the lava. The place tells you the plates."]}
}},

{id:"quakes",icon:"📈",title:"The Quake Files",lesson:"Plates and Earthquakes",blurb:"Why does the West Coast shake?",
 recap:["Stuck plates build up energy. When rock slips: earthquake!","<b>Focus</b> = underground start. <b>Epicenter</b> = the spot right above it.","Each magnitude step = 10× bigger shaking.","Nobody can predict quakes, so be ready: Drop, Cover, Hold On."],
 nodes:{
 start:{m:["Two plates are stuck together at a <b>fault</b>. But they keep pushing. 😬","What builds up?"],
  c:[["Energy, until the rock suddenly slips","focus",1],["Nothing happens","d_nothing"]]},
 d_nothing:D("Nothing happens","We can’t see anything building.","The rock bends like a stretched rubber band. When it snaps, the energy shakes the ground. 💥"),
 focus:{card:"c_fault",m:[{fig:"quake"},"Where the rock breaks underground is the <b>focus</b>.","The spot on the surface right above it is the…"],
  c:[["Epicenter","rank",1],["Trench","d_trench"]]},
 d_trench:D("Trench","It’s another earth science word.","A trench is a deep ocean valley. The spot above the focus is the epicenter."),
 rank:{m:["Right! 🎯 Which boundary makes the <b>biggest</b> earthquakes?"],
  c:[["Convergent (crashing)","mag",1],["Divergent (pulling apart)","d_div8"]]},
 d_div8:D("Divergent","Pulling apart sounds violent.","At divergent boundaries the crust is thin and breaks easily. The biggest quakes happen where plates crash."),
 mag:{gold:1,hint:"7 − 5 = 2 steps. Each step is × 10. So 10 × 10.",m:["Quake math! 📈 Each <b>magnitude</b> step means 10 times bigger shaking.",{math:{given:[["Quake A","magnitude 5"],["Quake B","magnitude 7"],["Each step up","× 10 shaking"]],formula:"× 10 for every step"}},"How many times bigger is quake B’s shaking?"],
  c:[["2 times","d_mag1"],["20 times","d_mag2"],["100 times","tsunami",1,["7 − 5 = 2 steps","10 × 10 = 100 times bigger!"]]]},
 d_mag1:D("Like a ruler","7 − 5 = 2.","Each step MULTIPLIES by 10. Two steps = 10 × 10 = 100."),
 d_mag2:D("Added the 10s","10 + 10 = 20.","Each step multiplies. 10 × 10 = 100, not 20."),
 tsunami:{m:["100 times! 😮 In 2004, a giant quake hit <b>under the ocean</b> near Indonesia.","What happened next?"],
  c:[["A tsunami: giant ocean waves","predict",1],["A new volcano formed","d_newv"]]},
 d_newv:D("A new volcano","Quakes and volcanoes happen in the same places.","The quake lifted the seafloor and pushed the water up. That made giant waves: a tsunami. 🌊"),
 predict:{m:["A video says: “Scientists know a big quake will hit next Tuesday!” 📱","Is that true?"],
  c:[["No. Nobody can predict the exact day","drop",1],["Yes, scientists can predict it","d_predict"]]},
 d_predict:D("Quakes can be predicted","Weather can be predicted.","No one can predict the day or place of an earthquake. Warning systems give only a few seconds of warning."),
 drop:{m:["The ground starts shaking at school! 🏫 What do you do?"],
  c:[["Drop, Cover, and Hold On","why",1],["Run outside","d_run"]]},
 d_run:D("Run outside","Outside feels safer.","Running while shaking is dangerous. Falling glass and objects hurt people. Drop, Cover, Hold On!"),
 why:{card:"c_drop",m:["Great! 🛡️ Last question, the one that started this unit:","Why does the West Coast have so many earthquakes?"],
  c:[["Plates meet there","end",1],["Ocean waves shake the land","d_waves"]]},
 d_waves:D("Ocean waves","The ocean is right there.","Waves can’t shake solid rock. The West Coast sits where plates meet and grind past each other."),
 end:{end:1,m:["Case closed! 📈 The West Coast shakes because it sits on plate boundaries."]}
}}
];

/* screen-space particles (for bursts on buttons, cards, locks) */
const FXC=document.createElement("canvas");FXC.id="fxc";const FX=FXC.getContext("2d");let FXP=[],fxOn=false;
function fxSize(){FXC.width=innerWidth;FXC.height=innerHeight}addEventListener("resize",fxSize);
function fxEmit(o){if(!FXC.isConnected){document.body.appendChild(FXC);fxSize()}FXP.push(Object.assign({vx:0,vy:0,life:50,size:4,color:"#FFD37E",g:.15,drag:.98,glow:false,shape:"c",grow:0},o,{max:o.life||50}));if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxBurst(x,y,n,o={}){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.speed||6)*(.35+Math.random());fxEmit(Object.assign({},o,{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||2),life:(o.life||45)*(.6+Math.random()*.6),color:Array.isArray(o.colors)?o.colors[i%o.colors.length]:(o.color||"#FFD37E")}))}}
function fxAt(el,n,o){const r=el.getBoundingClientRect();fxBurst(r.left+r.width/2,r.top+r.height/2,n,o)}
function fxLoop(){FX.clearRect(0,0,FXC.width,FXC.height);for(let i=FXP.length-1;i>=0;i--){const p=FXP[i];p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.size+=p.grow;p.life--;if(p.life<=0){FXP.splice(i,1);continue}
 FX.globalAlpha=Math.min(1,p.life/p.max*1.5);if(p.glow)FX.globalCompositeOperation="lighter";FX.fillStyle=p.color;
 if(p.shape==="sq"){FX.save();FX.translate(p.x,p.y);FX.rotate(p.life*.25);FX.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);FX.restore()}else if(p.shape==="star"){FX.save();FX.translate(p.x,p.y);FX.rotate(p.life*.1);FX.beginPath();for(let k=0;k<10;k++){const r=k%2?p.size*.45:p.size;FX.lineTo(Math.cos(k*Math.PI/5)*r,Math.sin(k*Math.PI/5)*r)}FX.fill();FX.restore()}
 else{FX.beginPath();FX.arc(p.x,p.y,Math.max(.5,p.size),0,7);FX.fill()}FX.globalCompositeOperation="source-over";FX.globalAlpha=1}
 if(FXP.length)requestAnimationFrame(fxLoop);else{fxOn=false;FX.clearRect(0,0,FXC.width,FXC.height)}}

/* drag-and-drop with a tap-tap fallback. items: [data-drag], zones: [data-drop]. onDrop(item, zone) returns true if accepted */
function makeDnD(root,onDrop){let cur=null,ghost=null,sx=0,sy=0,moved=false,sel=null,py=0,scr=null;
 const edge=()=>{if(!cur){scr=null;return}const m=70;if(py<m)scrollBy(0,-14);else if(py>innerHeight-m)scrollBy(0,14);scr=requestAnimationFrame(edge)};
 const zones=()=>[...root.querySelectorAll("[data-drop]")];
 const zoneAt=(x,y)=>zones().find(z=>{const r=z.getBoundingClientRect();return x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8});
 root.addEventListener("pointerdown",e=>{const it=e.target.closest("[data-drag]");if(!it||it.classList.contains("placed")||it.disabled)return;
  if(sel&&sel!==it)sel.classList.remove("picked");
  cur=it;sx=e.clientX;sy=e.clientY;moved=false;e.preventDefault();
  ghost=it.cloneNode(true);ghost.classList.add("dnd-ghost");const r=it.getBoundingClientRect();ghost.style.width=r.width+"px";ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";ghost.style.opacity=0;document.body.appendChild(ghost);py=e.clientY;if(!scr)scr=requestAnimationFrame(edge)});
 addEventListener("pointermove",e=>{if(!cur)return;py=e.clientY;if(Math.hypot(e.clientX-sx,e.clientY-sy)>10){moved=true;ghost.style.opacity=1;cur.classList.add("lifting");zones().forEach(z=>z.classList.add("dropready"))}
  ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";const z=zoneAt(e.clientX,e.clientY);zones().forEach(q=>q.classList.toggle("dropover",q===z))});
 addEventListener("pointerup",e=>{if(!cur)return;const it=cur;cur=null;ghost.remove();it.classList.remove("lifting");zones().forEach(z=>z.classList.remove("dropready","dropover"));
  if(moved){const z=zoneAt(e.clientX,e.clientY);if(z)onDrop(it,z);sel=null;return}
  /* tap: select, then tap a zone */
  if(sel===it){it.classList.remove("picked");sel=null;return}sel=it;it.classList.add("picked");sfx.click();zones().forEach(z=>z.classList.add("dropready"))});
 root.addEventListener("click",e=>{const z=e.target.closest("[data-drop]");if(z&&sel){const it=sel;sel=null;it.classList.remove("picked");zones().forEach(q=>q.classList.remove("dropready"));onDrop(it,z)}
  /* keyboard: Enter on an item picks it; Enter on a zone drops */
  const it=e.target.closest("[data-drag]");if(it&&e.detail===0){if(sel)sel.classList.remove("picked");sel=it;it.classList.add("picked");zones().forEach(q=>q.classList.add("dropready"))}})}

 const volcano=(cx,base,h,w=60)=>{if(h<2)return;x.fillStyle="#5a3a2a";x.beginPath();x.moveTo(cx-w,base);x.lineTo(cx-8,base-h);x.lineTo(cx+8,base-h);x.lineTo(cx+w,base);x.fill();if(h>25){const ty=base-h,now=performance.now();
  x.save();x.globalCompositeOperation="lighter";const g=x.createRadialGradient(cx,ty,2,cx,ty,70);g.addColorStop(0,"rgba(255,240,170,.9)");g.addColorStop(.4,"rgba(255,122,61,.45)");g.addColorStop(1,"rgba(255,60,20,0)");x.fillStyle=g;x.beginPath();x.arc(cx,ty,70,0,7);x.fill();

  const LP=window.LABP||(window.LABP=[]);if(LP.length<220)for(let i=0;i<4;i++)LP.push({x:cx+(Math.random()-.5)*8,y:ty,vx:(Math.random()-.5)*4,vy:-4-Math.random()*5,l:60,s:2.5+Math.random()*3.5,c:["#fff1b0","#ffd37e","#ff9a3d","#ff5a2a"][i]});

  for(let i=LP.length-1;i>=0;i--){const q=LP[i];q.x+=q.vx;q.y+=q.vy;q.l--;if(q.smoke){q.s+=.25}else q.vy+=.16;if(q.l<=0||(!q.smoke&&q.y>base)){LP.splice(i,1);continue}
   x.save();if(q.smoke){x.globalAlpha=Math.min(.45,q.l/120);x.fillStyle="#8a8296"}else{x.globalCompositeOperation="lighter";x.fillStyle=q.c}x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill();x.restore()}}};
 const p=labPair;
 if(k==="idle"){if(p==="oo"){ocean(0,400);ocean(400,800)}else if(p==="cc"){cont(0,398);cont(402,800)}else{ocean(0,420);cont(420,800)}

 if(k==="ridge"){ocean(0,800);const w=150*t;const n=Math.max(1,Math.floor(w/14));for(let i=0;i<n;i++){x.fillStyle=i%2?"#4a4f9a":"#F6B44C";x.fillRect(400+i*7,220,7,30);x.fillRect(400-(i+1)*7,220,7,30)}

  x.fillStyle="#FF7A3D";x.fillRect(394,222-45*t,12,30+45*t);x.beginPath();x.moveTo(380,330);x.lineTo(420,330);x.lineTo(406,250);x.lineTo(394,250);x.fill();
  arrow(330,200,230,200);arrow(470,200,570,200);lbl("new seafloor",400,280,"#FFD37E");lbl("magma rises",400,350,"#fff")}
 if(k==="rift"){const g=90*t;cont(0,400-g/2);cont(400+g/2,800);cont(400-g/2,400+g/2,110+60*t);volcano(400,110+60*t,40*t,30);
  x.fillStyle="#FF7A3D";x.fillRect(396,250,8,-10*t);arrow(300,90,200,90);arrow(500,90,600,90);lbl("land drops into a valley",400,60,"#FFD37E")}

  const tipx=410+L*Math.cos(ang),tipy=220+L*Math.sin(ang);
  if(t>.35){x.fillStyle="#FF7A3D";for(let i=0;i<4;i++){const f=((performance.now()/900)+i/4)%1;const yy=tipy-(tipy-(k==="arc"?120:220))*f;x.globalAlpha=1-f*.5;x.beginPath();x.arc(560+8*Math.sin(i),yy,7,0,7);x.fill()}x.globalAlpha=1}

/* ================= BOSS ================= */
const BOSS_SVG=(hurt)=>`<svg viewBox="0 0 200 170" aria-label="The Megaquake boss"><path d="M20 150 L10 95 L35 50 L70 25 L120 20 L160 40 L188 85 L182 150 Z" fill="#4a3628" stroke="#2a1d14" stroke-width="4"/>
 <path d="M40 60 L70 85 L60 110 M150 55 L130 80 L145 110 M95 25 L100 55" stroke="#FF7A3D" stroke-width="4" fill="none"/>
 <ellipse cx="72" cy="78" rx="16" ry="${hurt?4:13}" fill="#FFD37E"/><ellipse cx="128" cy="78" rx="16" ry="${hurt?4:13}" fill="#FFD37E"/>
 <circle cx="74" cy="80" r="${hurt?2:6}" fill="#7a1a00"/><circle cx="130" cy="80" r="${hurt?2:6}" fill="#7a1a00"/>
 <path d="M60 120 L75 112 L88 124 L100 110 L112 124 L125 112 L140 120" stroke="#FF4D2E" stroke-width="5" fill="none" stroke-linejoin="round"/>
 <path d="M10 150 L190 150" stroke="#FF7A3D" stroke-width="3" stroke-dasharray="8 6"/></svg>`;
let B=null;
function bossStart(){sayTok++;busy=false;if(closedN()<4){toast(`🔒 Close ${4-closedN()} more case${4-closedN()>1?"s":""} first!`,"dead");return}
 view="boss";C=null;hush();clearInterval(vTimer);cancelAnimationFrame(labRAF);run={streak:0};paintStreak();
 B={hp:100,sh:3,streak:0,pool:shuffle(BOSS),qi:0,dmg:0,lock:false};
 feed.innerHTML=`<div class="arena"><h2>👹 The Megaquake</h2><p class="sub">Answer right to hit it. Get 3 wrong and it knocks you down!</p>
  <div class="bossbox" id="bb">${BOSS_SVG()}</div><div class="hp"><i id="hpb" style="width:100%"></i><span id="hpt">100 / 100</span></div>
  <div class="shields" id="shd">🛡️🛡️🛡️</div><div class="bq" id="bq"></div><div id="bfb" style="text-align:center;min-height:30px;color:var(--muted)"></div></div>`;
 sfx.rumble();quake();paintSide();speak("Boss battle! The Megaquake. Answer right to hit it.");setTimeout(bossQ,700)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bossQ(){if(view!=="boss")return;if(B.qi>=B.pool.length){B.pool=shuffle(BOSS);B.qi=0}
 const q=B.pool[B.qi];$("#bq").textContent=q[0];$("#bfb").textContent="";B.lock=false;
 dock.innerHTML=`<div class="choices">${q[1].map((c,i)=>`<button class="choice" data-i="${i}"><span class="L">${LET[i]}</span><span>${c}</span></button>`).join("")}</div><div class="tools"><button class="tbtn" id="bRead">🔊 Read it</button><button class="tbtn" id="bRun">🏃 Run away (quest map)</button></div>`;
 dock.querySelectorAll(".choice").forEach(b=>b.onclick=()=>bossAns(+b.dataset.i));
 $("#bRead").onclick=()=>{hush();speak(q[0]+". "+q[1].map((c,i)=>"Choice "+LET[i]+". "+c).join(". "),true)};$("#bRun").onclick=hub;
 speak(q[0]+". "+q[1].map((c,i)=>"Choice "+LET[i]+". "+c).join(". "))}
function bossAns(i){if(B.lock)return;B.lock=true;hush();const q=B.pool[B.qi];B.qi++;
 dock.querySelectorAll(".choice").forEach((b,j)=>{if(j===q[2])b.style.borderColor="var(--good)";else if(j===i)b.style.borderColor="var(--coral)"});
 if(i===q[2]){B.streak++;const crit=B.streak>=3;const d=crit?18:12;B.hp=Math.max(0,B.hp-d);B.dmg+=d;sfx.hit();
  const bb=$("#bb");bb.classList.remove("hit");void bb.offsetWidth;bb.classList.add("hit");bb.innerHTML=BOSS_SVG(true);setTimeout(()=>{if($("#bb"))$("#bb").innerHTML=BOSS_SVG()},450);
  fxAt($("#bb"),crit?60:30,{colors:["#FFD37E","#FF7A3D","#F0674F"],speed:crit?11:7,life:45,size:crit?5:4,glow:true});const cc=document.querySelector(".chatcol");cc.classList.remove("shake");void cc.offsetWidth;cc.classList.add("shake");const f=document.createElement("div");f.className="dmg";f.textContent=(crit?"CRITICAL! ":"")+"−"+d;document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  $("#bfb").innerHTML=`<b style="color:var(--good)">✓ Hit!</b> ${q[3]}`;
  $("#hpb").style.width=B.hp+"%";$("#hpt").textContent=B.hp+" / 100";
  if(B.hp<=0){setTimeout(bossWin,900);return}setTimeout(bossQ,1500)}
 else{B.streak=0;B.sh--;quake();sfx.rumble();$("#shd").textContent="🛡️".repeat(B.sh)+"💔".repeat(3-B.sh);
  $("#bfb").innerHTML=`<b style="color:var(--coral)">The quake hits back!</b> The answer: <b style="color:#fff">${q[1][q[2]]}</b>. ${q[3]}`;speak("The answer is "+q[1][q[2]]+". "+q[3]);
  if(B.sh<=0){setTimeout(bossLose,1700);return}
  dock.innerHTML=`<div class="dockrow"><button class="btn big" id="bNext">Keep fighting ➜</button></div>`;$("#bNext").onclick=bossQ}}
function bossWin(){const first=!P.boss;P.boss=1;save();if(first)addXP(50);confetti();setTimeout(confetti,400);sfx.win();
 $("#bb").innerHTML=`<div style="font-size:90px">💥🏆</div>`;$("#bq").textContent="You defeated the Megaquake!";$("#bfb").textContent=first?"+50 XP and a LEGENDARY card!":"Champion again!";
 speak("You defeated the Megaquake!");unlockCard("boss");
 dock.innerHTML=`<div class="dockrow"><button class="btn big" id="bH">🗺️ Quest map</button><button class="btn ghost" id="bA">🔁 Fight again</button></div>`;$("#bH").onclick=hub;$("#bA").onclick=bossStart;paintSide()}
function bossLose(){$("#bq").textContent="The Megaquake knocked you down! 😵";$("#bfb").innerHTML=`You did <b style="color:var(--gold-bright)">${B.dmg}</b> damage. Review your Dead-End Journal and try again!`;speak("The Megaquake knocked you down. You did "+B.dmg+" damage. Try again!");

$("#liveBtn").onclick=()=>{live=!live;document.body.classList.toggle("live",live);$("#liveBtn").classList.toggle("on",live);toast(live?"📺 Live mode on":"Live mode off");if(view==="case"&&!busy&&C&&C.nodes[node]&&C.nodes[node].c)startVote(C.nodes[node].c.length===1)};

/* ===== VISUAL POLISH v2 — Nov 2026: progress strip, Terra coach, reactions, figure zoom ===== */
(function(){
 const bar=document.querySelector("header.bar");
 const prog=document.createElement("div");prog.className="v2prog";prog.innerHTML='<i><b id="v2progf"></b></i><span id="v2progt"></span>';if(bar)bar.after(prog);
 let terraSay=null,lastSay={t:"Hi! I’m Terra, your field guide. I’ll cheer you on from over here. 🌍",m:"happy"};
 function v2say(t,m){lastSay={t:t,m:m||"happy"};if(terraSay){try{terraSay(t,lastSay.m,false)}catch(e){}}}
 const _paintSide=paintSide;
 paintSide=function(){_paintSide();
  try{const c=closedN(),n=CASES.length,fd=foundDead(),td=totalDead();
   const f=document.getElementById("v2progf");if(f)f.style.width=Math.round(c/n*100)+"%";
   const g=document.getElementById("v2progt");if(g)g.textContent="🔍 "+c+"/"+n+" cases · 🚧 "+fd+"/"+td+" dead ends";}catch(e){}
  try{const sideEl=document.querySelector("#side");
   if(sideEl&&getComputedStyle(sideEl).display!=="none"){
    let el=document.getElementById("v2terra");
    if(!el){el=document.createElement("div");el.id="v2terra";sideEl.prepend(el);}
    terraSay=mountTerra(el);
    if(lastSay)terraSay(lastSay.t,lastSay.m,false);}}catch(e){}
 };
 paintSide();
 const feedEl=document.querySelector("#feed");
 function hit(n){if(!n||n.nodeType!==1)return null;
  if(n.matches(".closed"))return "closed";if(n.matches(".deadend"))return "dead";
  if(n.querySelector){if(n.querySelector(".closed"))return "closed";if(n.querySelector(".deadend"))return "dead";if(n.querySelector(".chip.fire"))return "fire";}
  return null}
 new MutationObserver(function(ms){for(const m of ms){for(const n of m.addedNodes){const k=hit(n);
  if(k==="closed")v2say("Case closed! 🎉 That reasoning chain is yours now. On to the next one!","cheer");
  else if(k==="dead")v2say("Ooh — a dead end! Great find. Now you know exactly why that idea breaks.","worried");
  else if(k==="fire")v2say("🔥 Streak! Three in a row — you’re on fire!","cheer");}}}).observe(feedEl,{childList:true,subtree:true});
 feedEl.addEventListener("click",function(e){const f=e.target.closest(".figure");if(!f)return;
  openModal('<div class="v2zoom">'+f.innerHTML+'</div><div style="text-align:center;margin-top:12px"><button class="btn big" id="v2zx">Got it!</button></div>');

 let lastTip="";

  if(tip&&tip!==lastTip){lastTip=tip;v2say(tip,t.id==="tBoss"?"wow":"happy")}});
})();
