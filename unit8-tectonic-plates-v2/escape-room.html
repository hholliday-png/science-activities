<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escape the Magma Chamber · Unit 8</title>
<style>
/* ===== Earth Science kit: shared look for every game page (navy + gold house style, accessible type) ===== */
:root{
  --navy:#0A0B1C; --navy2:#121430; --panel:#18193a; --panel2:#22244d;
  --gold:#F6B44C; --gold-bright:#FFD37E; --coral:#F0674F; --cyan:#63E0D4; --violet:#A98BF0;
  --ink:#F4F2FA; --muted:#B4B1D3; --line:#3a3c6c; --good:#8FE07A;
  --magma:#FF7A3D; --plate:#3FB8A8;
  --display:Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',Verdana,Tahoma,'Segoe UI',sans-serif;
  --mono:'SF Mono',Consolas,Monaco,monospace;
  --r-common:#9fb3c8; --r-rare:#63E0D4; --r-epic:#A98BF0; --r-legendary:#FFD37E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
a{color:var(--gold-bright)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#bg{position:fixed;inset:0;z-index:0;display:block}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 55% at 50% 118%,rgba(255,110,40,.24),transparent 70%),radial-gradient(ellipse 70% 50% at 50% -5%,rgba(63,184,168,.16),transparent 70%)}
#boom{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 16px 30px}

/* header */
.kitbar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px 8px;max-width:1100px;margin:0 auto}
.kitbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;text-decoration:none;overflow:hidden}
.kitbar .brand svg{width:40px;height:40px;flex:none}
.kitbar .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kitbar .t{font-family:var(--display);font-size:21px;font-weight:700;color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player{display:flex;align-items:center;gap:8px;background:rgba(24,25,58,.88);border:1.5px solid var(--line);border-radius:100px;padding:4px 14px 4px 5px;flex:none}
.player .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 35%,#ffe7ad,#F6B44C 60%,#9a6512)}
.player .lv{font-size:12px;color:var(--muted);line-height:1.1}
.player .lv b{color:var(--gold-bright);font-size:14px}
.xpbar{width:100px;height:8px;border-radius:100px;background:var(--panel2);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--plate),var(--gold),var(--magma));transition:width .5s}
.icon{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:rgba(24,25,58,.88);font-size:17px;flex:none;position:relative;display:grid;place-items:center;text-decoration:none}
.icon.on{border-color:var(--cyan);background:rgba(99,224,212,.18)}
.icon .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* building blocks */
.panel{background:rgba(24,25,58,.88);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:100px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold));width:max-content}
.tag.vi{background:linear-gradient(135deg,#cbb8ff,var(--violet));color:#160b33}
.tag.co{background:linear-gradient(135deg,#ffb09f,var(--coral));color:#2a0700}
.tag.cy{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f}
h1.title{font-family:var(--display);font-size:38px;line-height:1.1;color:#fff}
h2.title{font-family:var(--display);font-size:28px;line-height:1.15;color:#fff}
.sub{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1200;box-shadow:0 4px 18px rgba(246,180,76,.3);transition:transform .12s,filter .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:rgba(24,25,58,.85);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.co{background:linear-gradient(135deg,#ffb09f,var(--coral));color:#2a0700}
.btn.pl{background:linear-gradient(135deg,#8ff0e2,var(--plate));color:#04231f}
.btn.vi{background:linear-gradient(135deg,#cbb8ff,var(--violet));color:#160b33}
.btn.big{font-size:20px;padding:14px 26px}
.btn:disabled{opacity:.4;cursor:default;transform:none;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbtn{font-size:15px;font-weight:700;padding:7px 12px;border-radius:100px;border:1.5px solid var(--line);background:rgba(24,25,58,.9)}
.tbtn:hover{border-color:var(--cyan)}
.tbtn.hint{border-color:var(--gold);color:var(--gold-bright)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:rgba(24,25,58,.94);border:2.5px solid var(--line);border-radius:18px;padding:11px 16px;line-height:1.3;font-size:20px;transition:border-color .2s,transform .12s;min-height:58px;width:100%}
.choice:hover{border-color:var(--gold);transform:translateY(-2px)}
.choice .L{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold))}
.choice.right{border-color:var(--good);background:rgba(143,224,122,.16)}
.choice.wrong{border-color:var(--coral);background:rgba(240,103,79,.14)}
.feedback{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:18px;display:none}
.feedback.show{display:block;animation:pop .3s ease}
.feedback.good{background:rgba(143,224,122,.14);border:2px solid var(--good)}
.feedback.bad{background:rgba(240,103,79,.12);border:2px solid var(--coral)}
.q{font-family:var(--display);font-size:25px;color:#fff;line-height:1.25;margin-bottom:12px}
.mathbox{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;padding:12px 14px;border-radius:16px;border:2px solid var(--violet);background:rgba(24,25,58,.94);margin-bottom:12px}
.mathbox .given div{display:flex;justify-content:space-between;gap:10px;font-size:17px;padding:4px 0;border-bottom:1px dashed var(--line)}
.mathbox .given b{color:var(--gold-bright)}
.mathbox .formula{font-size:17px;font-weight:700;color:var(--cyan);background:rgba(99,224,212,.1);border:2px solid rgba(99,224,212,.45);border-radius:12px;padding:10px;text-align:center;align-self:start}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dmg{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:44px;color:var(--gold-bright);text-shadow:0 0 20px rgba(255,122,61,.8);pointer-events:none;z-index:60;animation:dmg 1.1s ease forwards;white-space:nowrap}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
body.quake .wrap{animation:quake .5s ease}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-2px)}}

/* cards */
.tcard{width:150px;border-radius:16px;padding:10px;text-align:center;background:linear-gradient(160deg,#22244d,#121430);border:3px solid var(--r-common);display:flex;flex-direction:column;gap:4px;align-items:center}
.tcard .ci{font-size:46px;line-height:1.1;margin:6px 0}
.tcard .cn{font-family:var(--display);font-weight:700;font-size:17px;color:#fff;line-height:1.15}
.tcard .cr{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.tcard .cf{font-size:13px;color:var(--muted);line-height:1.3}
.tcard .cu{font-size:11px;color:var(--cyan)}
.tcard.common{border-color:var(--r-common)} .tcard.common .cr{color:var(--r-common)}
.tcard.rare{border-color:var(--r-rare);box-shadow:0 0 18px rgba(99,224,212,.25)} .tcard.rare .cr{color:var(--r-rare)}
.tcard.epic{border-color:var(--r-epic);box-shadow:0 0 22px rgba(169,139,240,.35)} .tcard.epic .cr{color:var(--r-epic)}
.tcard.legendary{border-color:var(--r-legendary);box-shadow:0 0 30px rgba(255,211,126,.5);background:linear-gradient(160deg,#4a3410,#121430)} .tcard.legendary .cr{color:var(--r-legendary)}
.tcard.lockedc{filter:grayscale(1);opacity:.45}
.tcard.lockedc .ci{filter:brightness(0)}
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
.reveal{display:grid;place-items:center;gap:14px;text-align:center}
.reveal .tcard{width:220px;animation:flip .8s ease}
.reveal .tcard .ci{font-size:70px}
.reveal .tcard .cn{font-size:22px}
.reveal .tcard .cf{font-size:15px}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}60%{transform:rotateY(-10deg) scale(1.05)}100%{transform:none}}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,6,18,.82);backdrop-filter:blur(4px);padding:16px}
#modal.show{display:flex}
#modal .box{width:min(880px,100%);max-height:88vh;overflow-y:auto;background:var(--navy2);border:2px solid var(--line);border-radius:22px;padding:22px}
#modal h2{font-family:var(--display);font-size:30px;color:#fff}
.mtop{display:flex;justify-content:space-between;align-items:start;gap:12px}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:66;font-family:var(--display);font-weight:700;font-size:23px;color:#1a0800;background:linear-gradient(135deg,var(--gold-bright),var(--magma));padding:10px 24px;border-radius:100px;box-shadow:0 10px 40px rgba(255,122,61,.45);display:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{display:block;animation:tpop .5s ease}
#toast.bad{background:linear-gradient(135deg,#ffb09f,var(--coral))}
#toast.cy{background:linear-gradient(135deg,#9af0f0,var(--plate))}
@keyframes tpop{0%{transform:translateX(-50%) scale(.4);opacity:0}50%{transform:translateX(-50%) scale(1.1);opacity:1}100%{transform:translateX(-50%) scale(1)}}

@media (max-width:640px){
  body{font-size:18px}
  .kitbar{padding:8px 10px 6px;gap:6px}
  .kitbar .k,.kitbar .brand svg{display:none}
  .kitbar .t{font-size:18px}
  .player{padding:3px 10px 3px 3px;gap:6px}
  .player .xpbar{width:56px}
  .player .lv span{display:none}
  .icon{width:36px;height:36px;font-size:15px}
  h1.title{font-size:28px}
  .q{font-size:21px}
  .choice{font-size:18px;padding:10px 12px;min-height:52px}
  .mathbox{grid-template-columns:1fr}
  .tcard{width:140px}
  .wrap{padding:0 8px 24px}
  #toast{white-space:normal;text-align:center;font-size:18px;border-radius:18px;width:92vw;padding:10px 14px}
}

/* ===== flair kit ===== */
#fxc{position:fixed;inset:0;z-index:75;pointer-events:none}
.terra2{display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.terra2 svg{width:72px;height:82px;flex:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.terra2.cheer svg{animation:tjump .6s ease 2}.terra2.worried svg{animation:twob .5s ease 2}.terra2.wow svg{animation:tjump .4s ease 1}
@keyframes tjump{40%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes twob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.terra2 .eye{transform-origin:center;transform-box:fill-box;animation:tblink 4s infinite}
@keyframes tblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tb2{background:rgba(255,251,233,.97);color:#1a1530;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:17px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-bottom:34px;max-width:560px}
.tb2 b{color:#a0430f}
.tb2.pop{animation:pop .3s ease}
.dnd-ghost{position:fixed;z-index:85;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,.6);transition:opacity .1s}
[data-drag]{touch-action:none;cursor:grab;user-select:none}
[data-drag].lifting{opacity:.35}
[data-drag].picked{outline:3px solid var(--cyan);outline-offset:3px;animation:pickp .8s ease-in-out infinite alternate}
@keyframes pickp{to{transform:translateY(-4px)}}
[data-drop].dropready{outline:3px dashed rgba(255,211,126,.7);outline-offset:4px}
[data-drop].dropover{outline:3px solid var(--gold-bright);background:rgba(246,180,76,.18)!important;transform:scale(1.03)}
.pulse{animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 0 10px rgba(240,103,79,0),0 0 30px rgba(240,103,79,.6);transform:scale(1.03)}}
.metal{background:linear-gradient(160deg,#2b2e5a,#15173a 60%,#1d2048);border:2px solid #4a4d84;border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 40px rgba(0,0,0,.45);position:relative}
.metal::before,.metal::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9cce8,#5a5d8c);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.metal::before{left:10px}.metal::after{right:10px}
@media (max-width:640px){.terra2 svg{width:46px;height:52px}.tb2{font-size:15px;margin-bottom:10px;padding:8px 12px}}

/* ===== one-screen app layout (laptops + Chromebooks). Phones keep the stacked, scrolling layout. ===== */
@media (min-width:900px){
 body.app{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
 body.app .kitbar{flex:none;padding:6px 16px 4px;max-width:none;width:100%}
 body.app .kitbar .brand svg{width:34px;height:34px}
 body.app .kitbar .t{font-size:19px}
 body.app .icon{width:36px;height:36px;font-size:15px}
 body.app .wrap{flex:1;min-height:0;max-width:none;width:100%;padding:0 14px 10px;display:flex;flex-direction:column}
 body.app .fitbox{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
 body.app .fitbox>.scene{flex:none}
 body.app .q{font-size:20px;margin-bottom:8px}
 body.app .choice{font-size:17px;min-height:44px;padding:7px 12px;gap:10px}
 body.app .choice .L{width:32px;height:32px;font-size:18px;border-radius:9px}
 body.app .choices{gap:7px}
 body.app .mathbox{padding:8px 10px;gap:8px;margin-bottom:8px}
 body.app .mathbox .given div{font-size:15px;padding:2px 0}
 body.app .mathbox .formula{font-size:15px;padding:6px}
 body.app .tb2{font-size:15px;padding:8px 12px;margin-bottom:24px}
 body.app .terra2 svg{width:56px;height:64px}
}
@media (min-width:900px) and (max-height:640px){
 body.app .kitbar .k{display:none}
 body.app .q{font-size:18px}
 body.app .choice{font-size:16px;min-height:40px;padding:5px 10px}
}
@media (min-width:900px) and (max-height:720px){ body.app .kitbar .k{display:none} body.app .btn{padding:8px 16px;font-size:17px} }

.titlecard{max-width:820px;margin:20px auto;text-align:center;padding:26px;border-radius:28px;background:linear-gradient(160deg,rgba(255,122,61,.22),rgba(24,25,58,.92) 50%,rgba(169,139,240,.2));border:2px solid var(--gold);box-shadow:0 20px 60px rgba(255,122,61,.2)}
.tc-art{font-size:84px;line-height:1;filter:drop-shadow(0 8px 20px rgba(255,122,61,.5));animation:bob 3s ease-in-out infinite}
.tc-art span{font-size:60px;margin:0 6px}
@keyframes bob{50%{transform:translateY(-8px)}}
.titlecard h1{font-size:46px;margin-top:6px;background:linear-gradient(180deg,#FFE7AD,#F6B44C 60%,#FF7A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:left;margin-top:14px}
.howto div{background:rgba(10,11,28,.6);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
.howto span{display:block;font-size:28px}
.escbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.doors{display:flex;gap:8px}
.doors span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;border:2px solid var(--line);background:rgba(24,25,58,.9)}
.doors span.now{border-color:var(--gold-bright);box-shadow:0 0 0 4px rgba(246,180,76,.25),0 0 20px rgba(246,180,76,.4)}
.doors span.open{border-color:var(--good);background:rgba(143,224,122,.18)}
.clk{font-family:var(--display);font-size:22px;color:var(--gold-bright);background:rgba(24,25,58,.9);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px}
.scene{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#ec{width:100%;display:block;background:#0b1030}
.eterra{position:absolute;left:12px;bottom:12px;max-width:min(620px,85%)}
.room{margin-top:12px;padding:22px}
.room h2{text-align:center;margin-bottom:12px}
.hints{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.hl{display:grid;gap:6px;margin-top:8px}
.hintline{padding:8px 12px;border-radius:12px;background:rgba(255,211,126,.12);border:1.5px solid var(--gold);font-size:17px;animation:pop .3s ease}
.console{margin-top:14px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#0d0f22,#1a1d3c);border:2px solid #3a3d70;box-shadow:inset 0 2px 10px rgba(0,0,0,.6);display:grid;gap:12px;justify-items:center}
.lk{font-family:var(--mono);font-weight:700;letter-spacing:.16em;color:var(--gold-bright);font-size:14px}
.kb{font-size:13px;color:var(--muted)}
.screens{display:grid;gap:10px}
.screen{background:#04101c;border:2px solid #1f4a5a;border-radius:14px;padding:6px 10px;box-shadow:inset 0 0 30px rgba(99,224,212,.12),0 0 18px rgba(99,224,212,.08)}
.screen svg{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
.sl{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-weight:700;color:var(--cyan);font-size:14px;letter-spacing:.1em}
.sl small{color:var(--muted);font-weight:400;letter-spacing:0}
.gap{margin-left:auto;color:var(--muted);font-size:13px;letter-spacing:0}.gap b{color:var(--gold-bright);font-size:16px}
.dials{display:flex;gap:16px}
.dial{display:flex;flex-direction:column;align-items:center;border-radius:16px;background:linear-gradient(180deg,#2b2e5a,#111327);border:2px solid #4a4d84;padding:4px 10px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.dial button{font-size:22px;padding:2px 16px;color:var(--gold)}
.dwin{width:70px;height:84px;border-radius:12px;background:linear-gradient(180deg,#05060f,#1b1e3c 50%,#05060f);display:grid;place-items:center;overflow:hidden;touch-action:none;cursor:ns-resize;box-shadow:inset 0 4px 12px rgba(0,0,0,.8)}
.dwin span{font-family:var(--display);font-size:56px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(255,211,126,.5)}
.dwin span.roll{animation:roll .18s ease}
@keyframes roll{from{transform:translateY(-40%);opacity:.2}}
.dial.good{border-color:var(--good);box-shadow:0 0 22px rgba(143,224,122,.5)}

<script>

/* header */

  <button class="icon" id="binderBtn" aria-label="Cards">🃏<span class="badge" id="cardBadge" style="display:none">0</span></button>

function paintPlayer(){const r=rankIdx();const lo=RANKS[r][2],hi=r<RANKS.length-1?RANKS[r+1][2]:lo+1;

 $("#pXp").style.width=(r<RANKS.length-1?Math.min(100,(S.xp-lo)/(hi-lo)*100):100)+"%";

/* sound + speech */
let AC,sound=true;

 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",i*.1)),card:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.18,"sine",i*.08,.08)),

/* fx */
function toast(t,kind){const el=$("#toast");el.textContent=t;el.className="";void el.offsetWidth;el.className="show"+(kind?" "+kind:"");clearTimeout(el._t);el._t=setTimeout(()=>el.className="",1800)}

function quake(){document.body.classList.remove("quake");void document.body.offsetWidth;document.body.classList.add("quake");setTimeout(()=>document.body.classList.remove("quake"),600)}
const boom=document.createElement("canvas");boom.id="boom";const bx=boom.getContext("2d");let parts=[];

 for(let i=0;i<140;i++)parts.push({x:W/2+(Math.random()-.5)*200,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:5+Math.random()*6,c:cols[i%6],r:Math.random()*6,life:130});

(function(){const cv=document.createElement("canvas");cv.id="bg";document.body.prepend(cv);const g=document.createElement("div");g.className="glow";cv.after(g);

/* modal + cards */

  ghost=it.cloneNode(true);ghost.classList.add("dnd-ghost");const r=it.getBoundingClientRect();ghost.style.width=r.width+"px";ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";ghost.style.opacity=0;document.body.appendChild(ghost);py=e.clientY;if(!scr)scr=requestAnimationFrame(edge)});

function p3(){const right=[0,1,1,0,1];const ar=v=>v?"↓":"↑";
 const sync=()=>{RS.stripes=[...LEFT].reverse().concat([0],right)};
 const draw=marks=>{$("#strs").innerHTML=[...LEFT].reverse().map(v=>`<div class="str ${v?"rev":"nor"}">${ar(v)}</div>`).join("")+`<div class="str ridge">↑<small>RIDGE</small></div>`+right.map((v,i)=>`<button class="str tap ${v?"rev":"nor"} ${marks?(marks[i]?"good":"bad"):""}" data-i="${i}" aria-label="Right stripe ${i+1}">${ar(v)}</button>`).join("");
  document.querySelectorAll(".str.tap").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;right[i]=1-right[i];sfx.click();sync();draw();sparkle(b)});sync()};
 $("#pz").innerHTML=`<div class="console"><div class="lk">🧭 MAGNETIC LOCK</div><div class="stripes" id="strs"></div><p class="sub" style="text-align:center">⬅️ older · <b style="color:var(--magma)">ridge = youngest</b> · older ➡️</p><button class="btn co big" id="try">🔓 Test the pattern</button></div>`;
 draw();$("#try").onclick=()=>{const marks=right.map((v,i)=>v===LEFT[i]);draw(marks);if(marks.every(Boolean)){$("#try").disabled=true;unlocked()}else buzz(`${marks.filter(Boolean).length} of 5 stripes match. The green ones are right!`,$("#strs"))}}
