function rank(){const f=P.pts/maxPts();return f>=.85?"Plate Tectonics Pro":f>=.6?"Senior Seismologist":f>=.35?"Field Geologist":"Rookie Rock Hound"}

/* ================= TRACK ================= */
function paintTrack(){$("#track").innerHTML=CASES.map((c,i)=>`<button class="node ${P.done[c.id]?"done":""} ${C&&C.id===c.id&&view==="case"?"now":""}" data-c="${i}" title="Case ${i+1}: ${c.title}"><div class="d">${P.done[c.id]?"✓":""}</div><span>${c.title}</span></button>`).join("");
 document.querySelectorAll(".node").forEach(b=>b.onclick=()=>openCase(+b.dataset.c))}

/* ================= FEED HELPERS ================= */
const scrollDown=()=>requestAnimationFrame(()=>feed.scrollTop=feed.scrollHeight);
function add(html,cls=""){const d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;feed.appendChild(d);scrollDown();return d}
function terra(html){return add(`<div class="av" aria-hidden="true">🌍</div><div class="bub">${html}</div>`,"msg")}
function me(html){return add(`<div class="bub"><small>YOU</small>${html}</div>`,"msg me")}
function fig(k){return add(`<figure>${FIG[k]()}<figcaption>${FIGCAP[k]||""}</figcaption></figure>`,"figure")}
function mathCard(m){return add(`<span class="tag vi">🧮 Plate math</span><div class="given">${m.given.map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join("")}</div><div class="formula">${m.formula}</div>`,"mathcard")}
function steps(arr){const ol=document.createElement("ol");ol.className="steps";ol.innerHTML=arr.map((s,i)=>`<li style="animation-delay:${i*.35}s"><b>${i<arr.length-1?"STEP "+(i+1):"SO…"}</b><span>${s}</span></li>`).join("");feed.appendChild(ol);scrollDown()}
function chips(list){return add(list.map(([c,t])=>`<span class="chip ${c}">${t}</span>`).join(""),"chipline")}

/* message queue with typing indicator */
function say(items,done){queue=items.slice();busy=true;fast=false;dock.innerHTML=`<div class="hint">Tap the chat or press <span class="kbd">Space</span> to skip ahead</div>`;next(done)}
function next(done){if(!queue.length){busy=false;done&&done();return}
 const it=queue.shift();const len=typeof it==="string"?it.replace(/<[^>]+>/g,"").length:60;
 const wait=fast||matchMedia("(prefers-reduced-motion: reduce)").matches?0:Math.min(1300,380+len*9);
 let ty=null;if(wait>0){ty=add(`<div class="av" aria-hidden="true">🌍</div><div class="bub"><i></i><i></i><i></i></div>`,"msg typing")}
 setTimeout(()=>{ty&&ty.remove();
  if(typeof it==="string")terra(it);else if(it.fig)fig(it.fig);else if(it.math)mathCard(it.math);
  sfx.pop();next(done)},wait)}
feed.addEventListener("click",()=>{if(busy)fast=true});

/* ================= CASE FLOW ================= */
function openCase(i){C=CASES[i];view="case";run={};fork=null;forkPick=null;feed.innerHTML="";closeSide();
 add(`<div class="n">Case ${i+1} of ${CASES.length} · ${C.lesson}</div><h2>${C.icon} ${C.title}</h2><p>${C.blurb}</p>`,"casehead");
 if(P.done[C.id])add(`Replaying a closed case. Try the paths you skipped: ${deadIds(C).length-foundIn(C).length} dead ends still unmapped.`,"divider");
 paintTrack();paintSide();go("start")}
function go(id){node=id;const n=C.nodes[id];if(isMain(id)&&!n.end){fork=id}paintSide();
 say(n.m||[],()=>{if(n.dead)showDead(id);else if(n.end)showEnd();else showChoices()})}
function showChoices(){const n=C.nodes[node];const tried=run[node]||{};
 const solo=n.c.length===1;
 dock.innerHTML=`<div class="vote" id="vote"><span class="ask">💬 Chat vote: type <b style="color:var(--gold-bright)">${n.c.map((_,i)=>LET[i]).join(", ")}</b></span><span class="timer" id="vt">20</span></div>
  <div class="choices">${n.c.map((ch,i)=>`<button class="choice ${tried[i]==="dead"?"tried":""} ${solo?"solo":""}" data-i="${i}">${solo?"":`<span class="L">${LET[i]}</span>`}<span>${ch[0]}</span>${tried[i]==="dead"?`<span class="tr">🚧 dead end</span>`:""}</button>`).join("")}</div>
  <div class="hint">${solo?"Press <span class='kbd'>Enter</span>":"Pick with "+n.c.map((_,i)=>`<span class="kbd">${LET[i]}</span>`).join(" ")+" or tap"}${fork&&!isMain(node)?" · <span class='kbd'>R</span> rewind to the fork":""}</div>`;
 dock.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
 startVote(solo);paintSide()}
let vTimer=null;
function startVote(solo){clearInterval(vTimer);const v=$("#vote");if(!v||!live||solo)return;v.classList.add("show");let t=20;const el=$("#vt");
 vTimer=setInterval(()=>{t--;if(!el.isConnected){clearInterval(vTimer);return}el.textContent=t>0?t:"Time!";el.classList.toggle("low",t<=5);if(t<=5&&t>0)sfx.tick();if(t<=0)clearInterval(vTimer)},1000)}
function pick(i){if(busy)return;clearInterval(vTimer);const n=C.nodes[node];const ch=n.c&&n.c[i];if(!ch)return;busy=true;
 if(isMain(node))forkPick=i;
 me(ch[0]);const tgt=ch[1];
 const reachesMain=isMain(tgt);
 if(ch[2]&&reachesMain){
   const firstTry=!(run["_dead_"+fork]);
   const gain=firstTry?10:5;
   P.sc=P.sc||{};P.sc[C.id]=P.sc[C.id]||{};
   const fresh=!P.sc[C.id][fork];
   if(fresh){P.sc[C.id][fork]=1;addPts(gain)}
   if(live&&firstTry&&!run["_live_"+fork]){run["_live_"+fork]=1;score.chat++;paintScore()}
   (run[fork]=run[fork]||{})[forkPick]="ok";
   chips([["good",firstTry?"✓ Solid reasoning"+(fresh?" +10":""):"✓ Back on track"+(fresh?" +5":"")]]);
   sfx.good();
   if(ch[3])steps(ch[3]);
   (run._trail=run._trail||[]).push(["ok",LET[forkPick]]);
 }
 dock.innerHTML="";
 setTimeout(()=>go(tgt),ch[3]?ch[3].length*350+500:350)}
function showDead(id){const d=C.nodes[id].dead;const isNew=!(P.dead[C.id]&&P.dead[C.id][id]);
 if(isNew){(P.dead[C.id]=P.dead[C.id]||{})[id]=1;addPts(3)}
 run["_dead_"+fork]=1;(run[fork]=run[fork]||{})[forkPick]="dead";
 (run._trail=run._trail||[]).push(["dead",LET[forkPick]]);
 if(live){score.pl++;paintScore()}
 sfx.dead();toast(isNew?"🚧 New dead end mapped":"🚧 Dead end",true);
 add(`<span class="tag co">🚧 Dead end</span><h3>${d.t}</h3><div class="two"><div class="tempt"><b>Why it’s tempting</b>${d.tempt}</div><div class="fail"><b>Why it breaks</b>${d.fail}</div></div>${isNew?`<div class="new">+3 insight · added to your Dead-End Journal 📓</div>`:""}`,"deadend");
 dock.innerHTML=`<div class="dockrow"><button class="btn co" id="rw">⟲ Rewind to the fork</button><span class="hint" style="margin:0">Dead ends are safe. Mapping them is how you learn why the right answer is right. <span class="kbd">R</span></span></div>`;
 $("#rw").onclick=rewind;paintSide();paintScore()}
function rewind(){if(!fork)return;sfx.rewind();add("⟲ Rewound to the fork","divider");
 const n=C.nodes[fork];const q=[...n.m].reverse().find(x=>typeof x==="string");node=fork;terra(q);showChoices()}
function showEnd(){const first=!P.done[C.id];P.done[C.id]=1;save();sfx.win();confetti();toast("🔍 Case closed!");
 const fd=foundIn(C).length,td=deadIds(C).length;
 add(`<span class="tag cy">🔍 Case closed</span><h3>${C.title}</h3><div style="color:var(--muted)">The reasoning chain you just built:</div><ol>${C.recap.map(r=>`<li>${r}</li>`).join("")}</ol>
  <div class="stats"><div class="stat"><div class="k">Dead ends mapped</div><div class="v">${fd} / ${td}</div></div><div class="stat"><div class="k">Insight points</div><div class="v">${P.pts}</div></div><div class="stat"><div class="k">Cases closed</div><div class="v">${Object.keys(P.done).length} / ${CASES.length}</div></div></div>`,"closed");
 const idx=CASES.indexOf(C);
 dock.innerHTML=`<div class="dockrow">${idx<CASES.length-1?`<button class="btn" id="nx">Next case: ${CASES[idx+1].title} →</button>`:`<button class="btn" id="nx">🏆 See your unit results</button>`}
  ${fd<td?`<button class="btn co" id="rp">🚧 Hunt the ${td-fd} dead end${td-fd>1?"s":""} you missed</button>`:""}<button class="btn ghost" id="bd">All cases</button></div>`;
 $("#nx").onclick=()=>idx<CASES.length-1?openCase(idx+1):board();
 const rp=$("#rp");if(rp)rp.onclick=()=>openCase(idx);$("#bd").onclick=board;
 paintTrack();paintSide();paintScore()}

/* ================= SIDE PANEL ================= */
function paintSide(){if(view!=="case"||!C){side.innerHTML=boardSide();bindSide();return}
 const mp=mainPath(C);const fd=foundIn(C),td=deadIds(C);
 const rows=mp.map((id,k)=>{const n=C.nodes[id];const r=run[id]||{};
  const dots=n.c.map((ch,i)=>{let cls="";if(ch[2]&&isMain(ch[1])){cls=(r[i]==="ok"||P.done[C.id])?"ok":""}else{const ds=reachDead(C,ch[1]);const got=ds.filter(d=>P.dead[C.id]&&P.dead[C.id][d]).length;cls=got&&got===ds.length?"dead":got?"part":""}
   return `<span class="dot ${cls}" title="Choice ${LET[i]}"></span>`}).join("");
  return `<div class="fork ${id===fork?"now":""}"><span class="lbl">${id===fork?"▶ ":""}Fork ${k+1}</span><span class="dots">${dots}</span></div>`}).join("");
 side.innerHTML=`<button class="btn ghost mobile-only" id="closeSide">✕ Close map</button><div class="panel"><h4>Case map <span>${C.icon} ${C.title}</span></h4><div class="forks">${rows}</div>
  <div class="legend"><span><i style="background:var(--good)"></i>solved</span><span><i style="background:var(--coral)"></i>dead end mapped</span><span><i style="background:var(--navy2);border:1.5px solid var(--line)"></i>unexplored</span></div></div>
  <div class="panel"><h4>Dead ends in this case <span>${fd.length}/${td.length}</span></h4><div class="meter"><i style="width:${td.length?fd.length/td.length*100:0}%"></i></div>
  <ul class="jlist" style="margin-top:10px">${td.map(k=>fd.includes(k)?`<li>${C.nodes[k].dead.t}</li>`:`<li class="locked">??? still hidden</li>`).join("")}</ul></div>
  <div class="panel"><h4>Your path</h4><div class="trail">${(run._trail||[]).map(([c,l],i)=>`<span class="${c}">${c==="ok"?"✓":"🚧"} ${l}</span>`).join("")||`<span>Make your first choice</span>`}</div></div>
  <button class="btn ghost" id="toBoard">← All cases</button>`;
 bindSide()}
function boardSide(){return `<div class="panel"><h4>Unit progress</h4><div style="font-family:var(--display);font-size:30px;font-weight:700">${Object.keys(P.done).length} / ${CASES.length} <span style="font-size:15px;color:var(--muted);font-family:var(--body);font-weight:400">cases closed</span></div><div class="meter"><i style="width:${Object.keys(P.done).length/CASES.length*100}%"></i></div>
  <div style="margin-top:12px;font-family:var(--display);font-size:30px;font-weight:700;color:var(--coral)">${foundDead()} / ${totalDead()} <span style="font-size:15px;color:var(--muted);font-family:var(--body);font-weight:400">dead ends mapped</span></div><div class="meter"><i style="width:${foundDead()/totalDead()*100}%"></i></div>
  <div class="rank" style="font-size:20px;margin-top:12px">${rank()}</div></div>
  <div class="panel"><h4>For teachers</h4><p style="font-size:14px;line-height:1.45;color:var(--muted)">Press <b style="color:var(--ink)">📺 LIVE</b> to present: bigger text, a 20-second chat vote on every fork, and a <b style="color:var(--ink)">Chat vs Plates</b> score (a right first pick scores for Chat, a dead end scores for the Plates). Keys: <span class="kbd">A</span>–<span class="kbd">C</span> pick, <span class="kbd">R</span> rewind, <span class="kbd">Space</span> skip, <span class="kbd">Shift+C</span>/<span class="kbd">Shift+X</span> manual points.</p></div>
  <button class="btn ghost" id="reset">↺ Reset my progress</button>`}
function bindSide(){const cs=$("#closeSide");if(cs)cs.onclick=closeSide;const b=$("#toBoard");if(b)b.onclick=board;const r=$("#reset");if(r)r.onclick=()=>confirmReset()}
function confirmReset(){openModal(`<h2>Reset progress?</h2><p class="sub">This clears your closed cases, dead-end journal and insight points on this device.</p><div class="dockrow"><button class="btn co" id="yes">Yes, reset</button><button class="btn ghost" id="no">Cancel</button></div>`);
 $("#yes").onclick=()=>{P={done:{},dead:{},pts:0,sc:{}};save();closeModal();board()};$("#no").onclick=closeModal}
function closeSide(){side.classList.remove("open")}
$("#mapBtn").onclick=()=>{paintSide();side.classList.toggle("open")};

/* ================= BOARD ================= */
function board(){view="board";C=null;clearInterval(vTimer);closeSide();paintTrack();paintScore();
 const all=Object.keys(P.done).length===CASES.length;
 feed.innerHTML=`<div class="board"><div class="hero"><svg class="bigicon" width="96" height="96" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="url(#gE)" stroke="#3FB8A8" stroke-width="2"/><path d="M6 17 L14 20 L18 15 L25 21 L30 18 L38 23" fill="none" stroke="#FF7A3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 30 L17 27 L22 31 L29 27 L35 30" fill="none" stroke="#FFD37E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><div style="font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--cyan)">UNIT 8 · TECTONIC PLATES</div><h1>Every wrong turn is a clue.</h1><p>I’m <b style="color:var(--plate)">Terra</b>, your field geologist. Pick your answers, follow your own reasoning, and when an idea hits a dead end, rewind and try another path. Map the dead ends and you’ll know <i>why</i> the right answer is right.</p></div></div>
  <div class="how"><div class="panel"><b>1 · CHOOSE</b><p>Every fork has one path that holds up and a few that don’t. Go with your gut first.</p></div><div class="panel"><b>2 · HIT A DEAD END</b><p>Wrong ideas play out until they break. You’ll see why each one is tempting and exactly where it fails.</p></div><div class="panel"><b>3 · REWIND & MAP</b><p>Rewind to the fork. Every new dead end you map goes in your 📓 journal for studying.</p></div></div>
  <div class="cases">${CASES.map((c,i)=>{const fd=foundIn(c).length,td=deadIds(c).length;return `<button class="card ${P.done[c.id]?"done":""}" data-c="${i}"><span class="ic">${c.icon}</span><span class="num">Case ${i+1}</span><span class="ti">${c.title}</span><span class="le">${c.lesson}</span><span class="st">${P.done[c.id]?"✓ closed · ":""}🚧 ${fd}/${td} dead ends</span></button>`}).join("")}</div>
  <div class="cleared panel ${all?"show":""}"><h2>🏆 Unit 8 cleared!</h2><div class="rank">${rank()}</div><p style="color:var(--muted);margin-top:8px">${P.pts} insight points · ${foundDead()} of ${totalDead()} dead ends mapped. ${foundDead()<totalDead()?"Replay a case to hunt the rest. They make great test prep.":"You mapped every single dead end. Incredible detective work."}</p></div></div>`;
 feed.querySelectorAll(".card").forEach(b=>b.onclick=()=>openCase(+b.dataset.c));
 const nextCase=CASES.findIndex(c=>!P.done[c.id]);
 dock.innerHTML=`<div class="dockrow"><button class="btn" id="go1">${nextCase<0?"🔁 Replay Case 1":Object.keys(P.done).length?`▶ Continue: Case ${nextCase+1}, ${CASES[nextCase].title}`:"▶ Start Case 1: The Puzzle Continent"}</button><button class="btn ghost" id="jb2">📓 Dead-End Journal</button><a class="btn ghost" href="index.html" style="text-decoration:none">⬅ All Unit 8 games</a></div>`;
 $("#go1").onclick=()=>openCase(nextCase<0?0:nextCase);$("#jb2").onclick=journal;
 feed.scrollTop=0;paintSide()}

/* ================= JOURNAL ================= */
function openModal(h){$("#mbox").innerHTML=h;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function journal(){openModal(`<div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><div><h2>📓 Dead-End Journal</h2><p class="sub">Every misconception you’ve mapped: why it’s tempting, and why it breaks. ${foundDead()} of ${totalDead()} found.</p></div><button class="icon" id="mx" aria-label="Close">✕</button></div>
 ${CASES.map(c=>{const ds=deadIds(c);return `<div class="jcase"><h3>${c.icon} ${c.title} · ${foundIn(c).length}/${ds.length}</h3>${ds.map(k=>{const f=P.dead[c.id]&&P.dead[c.id][k];const d=c.nodes[k].dead;return f?`<div class="jentry"><b>${d.t}</b><br><span class="t">Tempting because:</span> ${d.tempt}<br><span class="f"><b style="font-size:15px;font-family:var(--body);color:var(--coral)">Breaks because:</b> ${d.fail}</span></div>`:`<div class="jentry locked">??? Still hidden. Explore a different path in this case.</div>`}).join("")}</div>`}).join("")}`);
 $("#mx").onclick=closeModal}
$("#jBtn").onclick=journal;

/* ================= LIVE MODE + KEYS ================= */
$("#liveBtn").onclick=()=>{live=!live;document.body.classList.toggle("live",live);$("#liveBtn").classList.toggle("on",live);toast(live?"📺 Live mode on":"Live mode off");if(view==="case"&&!busy&&C&&C.nodes[node]&&C.nodes[node].c)startVote(C.nodes[node].c.length===1)};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const k=e.key.toLowerCase();
 if(e.key==="Escape"){closeModal();closeSide();return}
 if($("#modal").classList.contains("show"))return;
 if(k===" "&&busy){e.preventDefault();fast=true;return}
 if(view!=="case")return;
 if(live&&e.shiftKey&&k==="c"){score.chat++;paintScore();sfx.good();return}
 if(live&&e.shiftKey&&k==="x"){score.pl++;paintScore();sfx.dead();return}
 if(k==="r"){const b=$("#rw");if(b)b.click();else if(fork&&!isMain(node)&&!busy)rewind();return}
 const n=C.nodes[node];if(!n||!n.c||busy)return;
 if(e.key==="Enter"&&n.c.length===1){pick(0);return}
 const i=LET.toLowerCase().indexOf(k);const num="12345".indexOf(k);const idx=i>=0?i:num;
 if(idx>=0&&idx<n.c.length&&!(e.target.closest&&e.target.closest("button")&&e.key==="Enter"))pick(idx)});

paintScore();board();
</script>
</body></html>
