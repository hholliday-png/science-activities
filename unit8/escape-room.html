<script>
/* ===== Earth Science kit (shared JS). One-off play: NOTHING is saved or sent anywhere.
   XP, cards and settings live only in this open tab and disappear when it closes. ===== */
const $=s=>document.querySelector(s);
const S={xp:0,cards:{},read:false};
const RANKS=[["Rookie Rock Hound","🪨",0],["Pebble Pro","🔹",40],["Fossil Finder","🦴",100],["Magma Master","🔥",180],["Plate Pilot","🧭",280],["Quake Captain","⚡",400],["Planetary Scientist","🌍",550]];
function rankIdx(x=S.xp){let r=0;RANKS.forEach((k,i)=>{if(x>=k[2])r=i});return r}

/* header */

/* sound + speech */
let AC,sound=true;
function tone(f,d=.12,type="sine",w=0,v=.1){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+w+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+w);o.stop(AC.currentTime+w+d+.02)}catch(e){}}
const sfx={good:()=>{tone(660,.1);tone(990,.16,"sine",.08)},bad:()=>{tone(220,.18,"sawtooth",0,.05);tone(150,.3,"sawtooth",.12,.05)},pop:()=>tone(520,.05,"triangle",0,.035),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",i*.1)),card:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.18,"sine",i*.08,.08)),
 hit:()=>{tone(90,.25,"sawtooth",0,.12);tone(1200,.08,"square",0,.04)},rumble:()=>{tone(55,.6,"sawtooth",0,.1);tone(70,.5,"triangle",.05,.12)},
 build:()=>{tone(300,.06,"square",0,.05);tone(450,.08,"square",.06,.05)},click:()=>tone(900,.03,"square",0,.03),
 splash:()=>{for(let i=0;i<6;i++)tone(200+Math.random()*600,.12,"sine",i*.04,.04)},unlock:()=>[400,600,800].forEach((f,i)=>tone(f,.1,"triangle",i*.07,.08))};
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").trim()};
function speak(h,force){if(!(S.read||force))return;try{const u=new SpeechSynthesisUtterance(plain(h));u.rate=.92;u.lang="en-US";speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}

/* fx */
function toast(t,kind){const el=$("#toast");el.textContent=t;el.className="";void el.offsetWidth;el.className="show"+(kind?" "+kind:"");clearTimeout(el._t);el._t=setTimeout(()=>el.className="",1800)}
function floatText(t,c,top){const f=document.createElement("div");f.className="dmg";f.style.color=c||"";f.style.fontSize="34px";if(top)f.style.top=top;f.textContent=t;document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function bigText(t,c){const f=document.createElement("div");f.className="dmg";f.style.color=c||"";f.textContent=t;document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function quake(){document.body.classList.remove("quake");void document.body.offsetWidth;document.body.classList.add("quake");setTimeout(()=>document.body.classList.remove("quake"),600)}
const boom=document.createElement("canvas");boom.id="boom";const bx=boom.getContext("2d");let parts=[];
function confetti(){if(!boom.isConnected)document.body.appendChild(boom);const W=boom.width=innerWidth,H=boom.height=innerHeight;const cols=["#FFD37E","#F6B44C","#3FB8A8","#63E0D4","#FF7A3D","#A98BF0"];const first=!parts.length;
 for(let i=0;i<140;i++)parts.push({x:W/2+(Math.random()-.5)*200,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:5+Math.random()*6,c:cols[i%6],r:Math.random()*6,life:130});
 if(first)requestAnimationFrame(stepC)}
function stepC(){bx.clearRect(0,0,boom.width,boom.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=.1;p.life--;bx.save();bx.translate(p.x,p.y);bx.rotate(p.r);bx.fillStyle=p.c;bx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);bx.restore()});parts=parts.filter(p=>p.life>0&&p.y<boom.height+20);if(parts.length)requestAnimationFrame(stepC);else bx.clearRect(0,0,boom.width,boom.height)}
(function(){const cv=document.createElement("canvas");cv.id="bg";document.body.prepend(cv);const g=document.createElement("div");g.className="glow";cv.after(g);
 const t=document.createElement("div");t.id="toast";document.body.appendChild(t);
 const m=document.createElement("div");m.id="modal";m.setAttribute("role","dialog");m.innerHTML='<div class="box" id="mbox"></div>';document.body.appendChild(m);
 m.addEventListener("click",e=>{if(e.target.id==="modal"&&!$("#cardOk"))closeModal()});
 const x=cv.getContext("2d");let W,H,em=[],cr=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;cr=[];for(let k=0;k<4;k++){const pts=[];let px=-20,py=Math.random()*H;while(px<W+20){pts.push([px,py]);px+=40+Math.random()*60;py+=(Math.random()-.5)*60}cr.push(pts)}};
 rs();addEventListener("resize",rs);
 for(let i=0;i<40;i++)em.push({x:Math.random(),y:Math.random(),v:.0003+Math.random()*.0006,r:.6+Math.random()*1.8,a:Math.random()*6});
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 (function f(){x.clearRect(0,0,W,H);x.lineWidth=1.2;x.strokeStyle="rgba(63,184,168,.08)";cr.forEach(p=>{x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke()});
  em.forEach(e=>{e.y-=e.v;e.a+=.02;if(e.y<-.02){e.y=1.02;e.x=Math.random()}x.fillStyle=`rgba(255,${120+Math.round(60*Math.sin(e.a))},60,${.25+.25*Math.sin(e.a)})`;x.beginPath();x.arc(e.x*W,e.y*H,e.r,0,7);x.fill()});
  if(!reduce)requestAnimationFrame(f)})()})();

/* modal + cards */
function openModal(h){$("#mbox").innerHTML=h;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cardOk"))closeModal();if(e.key==="Enter"&&$("#cardOk")){e.preventDefault();$("#cardOk").click()}});
let cardQ=[],cardOpen=false;
function cardHTML(c,locked){return `<div class="tcard ${c.r} ${locked?"lockedc":""}"><div class="cr">${c.r}</div><div class="ci">${c.i}</div><div class="cn">${locked?"???":c.n}</div><div class="cf">${locked?(c.how||"Keep playing to unlock"):c.f}</div></div>`}
function unlockCard(id){const c=CARDS[id];if(!c||S.cards[id])return false;S.cards[id]=1;paintPlayer();cardQ.push(id);if(!cardOpen)nextCard();return true}
function nextCard(){const id=cardQ.shift();if(!id){cardOpen=false;return}cardOpen=true;const c=CARDS[id];sfx.card();if(c.r!=="common")confetti();
 openModal(`<div class="reveal"><div class="tag cy">🃏 New card!</div>${cardHTML(c)}<button class="btn big" id="cardOk">Awesome!</button></div>`);
 speak("New card! "+c.n+". "+c.f);$("#cardOk").onclick=()=>{closeModal();setTimeout(nextCard,150)};$("#cardOk").focus()}
function binder(){const ids=Object.keys(CARDS);const got=ids.filter(i=>S.cards[i]).length;
 openModal(`<div class="mtop"><div><h2>🃏 Cards</h2><p class="sub">${got} of ${ids.length} collected this time. Cards reset when you close the page.</p></div><button class="icon" id="mx" aria-label="Close">✕</button></div><div class="binder" style="margin-top:12px">${ids.map(i=>cardHTML(CARDS[i],!S.cards[i])).join("")}</div>`);
 $("#mx").onclick=closeModal}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET="ABCDE";

/* ===== ESCAPE THE MAGMA CHAMBER (Unit 8). Four rooms, four kinds of locks, three-level hints. ===== */
const CARDS={
 esc_seis:{n:"Seismogram Reader",i:"📈",r:"common",f:"The bigger the gap between P and S waves, the farther away the quake.",how:"Open the Seismograph Room"},
 esc_map:{n:"Map Master",i:"🗺️",r:"common",f:"Every landform tells you how the plates moved.",how:"Open the Map Room"},
 esc_fossil:{n:"Fossil Keeper",i:"🦴",r:"rare",f:"Older fossils have bigger “years ago” numbers.",how:"Open the Fossil Vault"},

let R=0,hintsUsed=0,roomHints=0,t0=0,clock=null;
const MAGMA=[5,25,50,72,92];
const ROOMS=[
 {name:"Seismograph Room",icon:"📈",lock:"number",card:"esc_seis",

  done:"🔓 Click! Station C had the biggest gap, so it was the farthest from the quake."},
 {name:"Map Room",icon:"🗺️",lock:"word",card:"esc_map",
  radio:"A giant map! 🗺️ Match each place to how its plates move. Each right answer shows a <b>letter</b>. Then spell the word in number order.",
  hints:["Divergent = pull apart. Convergent = push together. Transform = slide past.","Mountains, trenches, and volcanoes from diving plates come from pushing together. Ridges and rifts come from pulling apart.","The word is something that moves on Earth’s surface: P _ A _ E"],
  done:"🔓 The door slides open. PLATE! Plates build every one of those places."},
 {name:"Fossil Vault",icon:"🦴",lock:"color",card:"esc_fossil",

 {name:"Magnetic Door",icon:"🧲",lock:"arrow",card:"esc_mag",

function setMagma(){const m=MAGMA[Math.min(R,4)];const g=$("#mg");if(innerWidth<=760){g.style.width=m+"%";g.style.height=""}else{g.style.height=m+"%";g.style.width=""}$("#mgL").textContent=m+"%"}
function doors(){$("#doors").innerHTML=ROOMS.map((r,i)=>`<span class="${i<R?"open":i===R?"now":""}" title="${r.name}">${i<R?"🔓":r.icon}</span>`).join("")}
function start(){R=0;hintsUsed=0;t0=Date.now();clearInterval(clock);clock=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("#clk").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000);
 $("#intro").style.display="none";$("#game").style.display="";room()}
function room(){roomHints=0;doors();setMagma();if(R>=4){escaped();return}
 const r=ROOMS[R];$("#rt").innerHTML=`${r.icon} Room ${R+1}: ${r.name}`;
 $("#radio").innerHTML=`<span class="av">📻</span><div><b>Terra (on the radio):</b> ${r.radio}</div>`;
 $("#hints").innerHTML=`<button class="tbtn hint" id="hb">💡 Hint 1 of 3</button><button class="tbtn" id="rr">🔊 Read</button><div id="hl"></div>`;
 $("#hb").onclick=hint;$("#rr").onclick=()=>{hush();speak(plain(r.radio),true)};
 [roomSeis,roomMap,roomFossil,roomMag][R]();speak(plain(r.radio));sfx.rumble();
 $("#game").scrollIntoView({behavior:"smooth",block:"start"})}
function hint(){const r=ROOMS[R];if(roomHints>=3)return;const h=r.hints[roomHints++];hintsUsed++;
 $("#hl").insertAdjacentHTML("beforeend",`<div class="hintline">💡 ${h}</div>`);speak(h,true);
 const b=$("#hb");if(roomHints>=3)b.remove();else b.textContent=`💡 Hint ${roomHints+1} of 3`}
function unlocked(){const r=ROOMS[R];sfx.unlock();setTimeout(sfx.win,300);confetti();addXP(20);
 $("#pz").insertAdjacentHTML("beforeend",`<div class="opened">${r.done}<div style="margin-top:10px"><button class="btn big" id="nr">${R<3?"Go to the next room ➜":"Climb out! 🏃"}</button></div></div>`);
 speak(plain(r.done));unlockCard(r.card);$("#nr").onclick=()=>{R++;room()};setTimeout(()=>$("#nr").scrollIntoView({behavior:"smooth",block:"center"}),100)}
function wrongBuzz(msg){sfx.bad();quake();toast(msg||"🔒 Not yet. Try again!","bad");speak(msg||"Not yet. Try again!",true)}

/* ---------- Room 1: seismographs → number lock ---------- */
const SEIS=[["A",2],["B",5],["C",7]];
function seisSVG(lag){const W=600,H=110,ox=30,step=(W-50)/12;let d=`M${ox} 55`;
 for(let t=0;t<=12;t+=.05){const x=ox+t*step;let y=55;if(t>=1&&t<1+lag)y+=Math.sin(t*28)*7;else if(t>=1+lag)y+=Math.sin(t*22)*Math.min(38,38*(1.4-(t-1-lag)*.08));d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}
 let grid="";for(let i=0;i<=12;i++){const x=ox+i*step;grid+=`<line x1="${x}" y1="10" x2="${x}" y2="98" stroke="#2c2f63" stroke-width="1.5"/><text x="${x}" y="108" font-size="11" fill="#B4B1D3" text-anchor="middle" font-family="sans-serif">${i}</text>`}
 return `<svg viewBox="0 0 ${W} ${H+4}" role="img" aria-label="Seismograph reading">${grid}<path d="${d}" fill="none" stroke="#FFD37E" stroke-width="2.5"/></svg>`}
function roomSeis(){$("#pz").innerHTML=`<div class="seisgrid">${SEIS.map(([s,l])=>`<div class="seis"><div class="sl">Station ${s}<small>digit ${"ABC".indexOf(s)+1}</small></div>${seisSVG(l)}</div>`).join("")}<div class="axis">seconds →</div></div>
  <div class="lockbox"><div class="lk">🔢 Number lock</div><div class="dials">${[0,1,2].map(i=>`<div class="dial"><button data-d="${i}" data-s="1" aria-label="Up">▲</button><span id="dv${i}">0</span><button data-d="${i}" data-s="-1" aria-label="Down">▼</button></div>`).join("")}</div><button class="btn co big" id="try">🔓 Try the code</button></div>`;
 const v=[0,0,0];document.querySelectorAll(".dial button").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;v[i]=(v[i]+ +b.dataset.s+10)%10;$("#dv"+i).textContent=v[i];sfx.click()});
 $("#try").onclick=()=>{const ok=SEIS.map(([,l],i)=>v[i]===l);document.querySelectorAll(".dial").forEach((d,i)=>d.classList.toggle("good",ok[i]));
  if(ok.every(Boolean)){$("#try").disabled=true;unlocked()}else wrongBuzz(`🔒 ${ok.filter(Boolean).length} of 3 digits are right (they turned green).`)}}

/* ---------- Room 2: map → word lock ---------- */
const MAPQ=[["🏔️","The Himalayas","India and Asia crash and crumple.",1,"P",1],["🌊","Mid-Atlantic Ridge","New seafloor forms in the middle of the ocean.",0,"L",2],["🌋","The Andes volcanoes","An ocean plate dives under South America.",1,"A",3],["⚡","San Andreas Fault","Two plates grind sideways in California.",2,"T",4],["🏜️","East African Rift","The land is cracking open into a valley.",0,"E",5]];
const BTYPES=["↔️ Divergent","➡️⬅️ Convergent","⇅ Transform"];
function roomMap(){const order=shuffle(MAPQ.map((_,i)=>i));const got={};
 $("#pz").innerHTML=`<div class="mapgrid">${order.map(i=>{const [ic,n,d]=MAPQ[i];return `<div class="mcard" id="mc${i}"><div class="mi">${ic}</div><b>${n}</b><div class="md">${d}</div><div class="mb">${BTYPES.map((t,j)=>`<button class="tbtn" data-i="${i}" data-j="${j}">${t}</button>`).join("")}</div><div class="ml" id="ml${i}"></div></div>`}).join("")}</div>
  <div class="lockbox"><div class="lk">🔤 Word lock: tap the letters in number order</div><div class="slots" id="slots">${[1,2,3,4,5].map(n=>`<span class="slot" data-n="${n}">${n}</span>`).join("")}</div><div class="tiles" id="tiles"></div><button class="tbtn" id="clr">↺ Clear</button></div>`;
 document.querySelectorAll(".mb button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j;if(got[i])return;const q=MAPQ[i];
  if(j===q[3]){got[i]=1;sfx.good();$("#mc"+i).classList.add("good");$("#ml"+i).innerHTML=`Letter #${q[5]}: <span class="bigl">${q[4]}</span>`;speak("Right! Letter number "+q[5]+" is "+q[4]);addTile(q[4],q[5])}
  else{sfx.bad();const c=$("#mc"+i);c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");toast("Not that one. Try again!","bad")}});
 let typed=[];
 function addTile(L,n){const t=document.createElement("button");t.className="ltile";t.textContent=L;t.dataset.n=n;t.onclick=()=>{if(t.classList.contains("used"))return;t.classList.add("used");typed.push([L,t]);paint();check()};$("#tiles").appendChild(t)}
 function paint(){document.querySelectorAll("#slots .slot").forEach((s,i)=>{s.textContent=typed[i]?typed[i][0]:i+1;s.classList.toggle("on",!!typed[i])});sfx.click()}
 function check(){if(typed.length<5)return;const w=typed.map(x=>x[0]).join("");if(w==="PLATE"){document.querySelectorAll("#slots .slot").forEach(s=>s.classList.add("good"));unlocked()}else{wrongBuzz("🔒 That spells "+w+". Use the letter numbers to put them in order!");setTimeout(()=>{typed.forEach(x=>x[1].classList.remove("used"));typed=[];paint()},900)}}
 $("#clr").onclick=()=>{typed.forEach(x=>x[1].classList.remove("used"));typed=[];paint()}}

/* ---------- Room 3: fossils → color lock ---------- */
const FOS=[["🦎","Mesosaurus","Lake reptile · Africa & South America",280,"🔵","blue"],["🌿","Glossopteris","Seed fern · 5 southern continents",270,"🟢","green"],["🐊","Lystrosaurus","Land reptile · India, Africa, Antarctica",250,"🔴","red"],["🦘","Early marsupial","Pouch mammal · South America, Antarctica, Australia",60,"🟡","yellow"]];
function roomFossil(){const order=shuffle([0,1,2,3]);let seq=[];
 $("#pz").innerHTML=`<div class="fosgrid">${order.map(i=>{const [ic,n,d,age,g]=FOS[i];return `<div class="fcard"><div class="mi">${ic}</div><b>${n}</b><div class="md">${d}</div><div class="age">${age} million years ago</div><div class="gem">${g}</div></div>`}).join("")}</div>
  <div class="lockbox"><div class="lk">💎 Color lock: OLDEST ➜ YOUNGEST</div><div class="slots" id="gs">${[1,2,3,4].map(n=>`<span class="slot">${n}</span>`).join("")}</div>
  <div class="tiles">${order.map(i=>`<button class="gembtn" data-i="${i}" aria-label="${FOS[i][5]} gem">${FOS[i][4]}</button>`).join("")}</div><button class="tbtn" id="clr">↺ Clear</button></div>`;
 const paint=()=>{document.querySelectorAll("#gs .slot").forEach((s,k)=>{s.textContent=seq[k]!==undefined?FOS[seq[k]][4]:k+1;s.classList.toggle("on",seq[k]!==undefined)})};
 document.querySelectorAll(".gembtn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(seq.includes(i)||seq.length>=4)return;seq.push(i);b.classList.add("used");sfx.click();paint();
  if(seq.length===4){if(seq.join()==="0,1,2,3"){document.querySelectorAll("#gs .slot").forEach(s=>s.classList.add("good"));unlocked()}
   else{const right=seq.filter((v,k)=>v===k).length;wrongBuzz(`🔒 ${right} of 4 gems are in the right spot. Look at the “years ago” numbers!`);setTimeout(()=>{seq=[];document.querySelectorAll(".gembtn").forEach(x=>x.classList.remove("used"));paint()},1000)}}});
 $("#clr").onclick=()=>{seq=[];document.querySelectorAll(".gembtn").forEach(x=>x.classList.remove("used"));paint()}}

/* ---------- Room 4: magnetic stripes → arrow lock ---------- */
const LEFT=[1,0,0,1,0]; /* from the ridge going LEFT: 1 = ↓ (reversed), 0 = ↑ (normal) */
function roomMag(){const right=[0,0,0,0,0];
 const ar=v=>v?"↓":"↑";
 $("#pz").innerHTML=`<div class="stripes" id="st"></div><p class="sub" style="text-align:center;margin:6px 0">⬅️ older · · · <b style="color:var(--magma)">RIDGE</b> (youngest) · · · older ➡️</p>
  <div class="lockbox"><div class="lk">🧭 Arrow lock: tap the right-side stripes</div><button class="btn co big" id="try">🔓 Try the pattern</button></div>`;
 const draw=(marks)=>{const L=[...LEFT].reverse();$("#st").innerHTML=L.map(v=>`<div class="str ${v?"rev":"nor"}">${ar(v)}</div>`).join("")+`<div class="str ridge">↑<small>ridge</small></div>`+right.map((v,i)=>`<button class="str tap ${v?"rev":"nor"} ${marks&&marks[i]===true?"good":marks&&marks[i]===false?"bad":""}" data-i="${i}" aria-label="Stripe ${i+1} right of the ridge">${ar(v)}</button>`).join("");
  document.querySelectorAll(".str.tap").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;right[i]=1-right[i];sfx.click();draw()})};
 draw();
 $("#try").onclick=()=>{const marks=right.map((v,i)=>v===LEFT[i]);draw(marks);if(marks.every(Boolean)){$("#try").disabled=true;unlocked()}else wrongBuzz(`🔒 ${marks.filter(Boolean).length} of 5 stripes match. Green ones are right!`)}}

 $("#radio").innerHTML=`<span class="av">📻</span><div><b>Terra:</b> You made it out just as the volcano erupted! 🎉</div>`;$("#hints").innerHTML="";
 $("#pz").innerHTML=`<div style="text-align:center"><div class="erupt">🌋</div><h2 class="title">You escaped the Magma Chamber!</h2>
  <div class="row" style="justify-content:center;margin:12px 0"><div class="stat">⏱️ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</div><div class="stat">💡 ${hintsUsed} hint${hintsUsed===1?"":"s"}</div><div class="stat">🚪 4 / 4 rooms</div></div>
  <div class="row" style="justify-content:center"><button class="btn big" id="again">🔁 Play again</button><a class="btn ghost" href="index.html">🗺️ Unit 8 page</a></div></div>`;
 confetti();setTimeout(confetti,500);sfx.win();addXP(40);unlockCard("esc_win");if(!hintsUsed)unlockCard("esc_nohint");
 speak("You escaped the Magma Chamber!");$("#again").onclick=start}

kitHeader("Unit 8 · Tectonic Plates","Escape the Magma Chamber");
