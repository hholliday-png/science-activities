<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rewind the Universe — Live Lesson</title>
<style>
/* Layout: fixed 1200x780 night-sky stage scaled to the screen, matching the house live-deck style.
   Single dark look on purpose: a live deck is always a night sky. */
:root{
  --navy:#070B1E; --navy2:#0D1430; --panel:#141d3d; --panel2:#1b2650;
  --gold:#F6B44C; --gold-bright:#FFD37E; --coral:#F0674F; --cyan:#63E0D4; --violet:#A98BF0;
  --ink:#EEF1FB; --muted:#9AA6D0; --line:#2C3A6B; --good:#8FE07A; --bad:#F0674F;
  --redshift:#FF6A55; --blueshift:#6E95FF;
  --display:Georgia,'Times New Roman',serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',Consolas,Monaco,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

#starCanvas{position:fixed;inset:0;z-index:0;display:block}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(60,90,180,.2),transparent 70%)}
#boom{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}

.fit{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:2}
#deck{position:absolute;left:50%;top:50%;width:1200px;height:780px;transform-origin:center center;display:flex;flex-direction:column}

header.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand .mini{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.brand .k{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.brand .t{font-family:var(--display);font-size:21px;font-weight:700;color:var(--gold-bright);margin-top:2px}
.right{display:flex;align-items:center;gap:14px}
.score{display:flex;align-items:center;gap:10px;background:rgba(20,29,61,.85);border:1.5px solid var(--line);border-radius:100px;padding:6px 16px;font-weight:700;font-size:15px}
.score b{font-family:var(--display);font-size:22px}
.score .chat b{color:var(--gold-bright)} .score .cos b{color:var(--violet)}
.score .vs{color:var(--muted);font-family:var(--mono);font-size:12px}
.streak{font-family:var(--mono);font-size:13px;color:var(--coral);min-width:52px}
.counter{font-family:var(--mono);font-size:14px;color:var(--muted)} .counter b{color:var(--gold-bright)}
.icon{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:rgba(20,29,61,.85);font-size:16px}

/* rewind track */
.track{display:flex;padding:2px 40px 0;flex:0 0 auto}
.node{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);position:relative;text-align:center}
.node::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.node:first-child::before{display:none}
.node .d{width:18px;height:18px;border-radius:50%;background:var(--navy2);border:2px solid var(--line);position:relative;z-index:1}
.node.done .d{background:var(--gold);border-color:var(--gold)}
.node.done::before,.node.now::before{background:var(--gold)}
.node.now .d{border-color:var(--gold-bright);box-shadow:0 0 0 5px rgba(246,180,76,.25)}
.node.now{color:var(--gold-bright);font-weight:700}
.node span{margin-top:4px}
.node small{font-family:var(--mono);font-size:10px;opacity:.8}

main{flex:1 1 auto;position:relative;padding:14px 46px 0;overflow:hidden}
.slide{animation:in .35s ease}
.slide.same{animation:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
.eyebrow.gold{color:var(--gold)} .eyebrow.coral{color:var(--coral)}
h1{font-family:var(--display);font-size:52px;line-height:1.08;color:#fff;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:30px;line-height:1.15;color:#fff}
.lead{font-size:21px;color:var(--muted);line-height:1.45;max-width:60ch}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.prompt{font-family:var(--display);font-size:34px;line-height:1.2;color:#fff;margin-bottom:18px;max-width:28ch}
.prompt.wide{max-width:none}
.prompt .hi{color:var(--gold-bright)}
.red{color:var(--redshift)} .blue{color:var(--blueshift)}

/* universe ball (rewind visual) */
.uni{position:relative;border-radius:50%;transition:all 1.4s cubic-bezier(.2,.8,.2,1)}
.uni i{position:absolute;width:6px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8)}
.unibox{height:220px;display:grid;place-items:center}

.panel{background:rgba(20,29,61,.82);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.chatbeat{border-radius:18px;padding:14px 20px;position:relative;background:linear-gradient(135deg,rgba(246,180,76,.14),rgba(240,103,79,.1));border:2px solid var(--gold);box-shadow:0 0 30px rgba(246,180,76,.18)}
.chatbeat.predict{background:linear-gradient(135deg,rgba(99,224,212,.14),rgba(90,150,255,.1));border-color:var(--cyan);box-shadow:0 0 30px rgba(99,224,212,.15)}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:100px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold));margin-bottom:8px}
.predict .tag{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f}
.ask{font-weight:700;font-size:21px;color:#fff;line-height:1.3}
.ask em{color:var(--gold-bright);font-style:normal}
.predict .ask em{color:var(--cyan)}

.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{font-weight:700;font-size:16px;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1200;box-shadow:0 4px 18px rgba(246,180,76,.35);transition:transform .12s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:rgba(20,29,61,.85);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost.on{border-color:var(--cyan);color:var(--cyan)}
.btn.cy{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f;box-shadow:0 4px 18px rgba(99,224,212,.3)}
.btn.vi{background:linear-gradient(135deg,#cbb8ff,var(--violet));color:#160b33;box-shadow:0 4px 18px rgba(169,139,240,.3)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.timer{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold-bright);min-width:70px}
.timer.low{color:var(--coral)}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.btn .kbd{color:inherit;border-color:currentColor;opacity:.7}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:rgba(20,29,61,.85);border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.25;color:var(--ink);min-height:74px;transition:opacity .3s,border-color .3s}
.opt .L{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold))}
.opt.right{border-color:var(--good);background:rgba(143,224,122,.16);box-shadow:0 0 28px rgba(143,224,122,.25)}
.opt.right .L{background:var(--good)}
.opt.dim{opacity:.32}
.tf .opt{justify-content:center;font-family:var(--display);font-size:40px;font-weight:700;min-height:110px}
.explain{display:none;margin-top:14px;padding:14px 18px;border-radius:14px;border-left:6px solid var(--good);background:rgba(20,29,61,.9);font-size:20px;line-height:1.4}
.explain.show{display:block;animation:pop .35s ease}
.explain b{color:var(--good)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.award{display:none;gap:10px} .award.show{display:flex}
.awarded{font-weight:700;color:var(--gold-bright);font-size:16px}

/* math */
.math{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.given{display:grid;gap:8px}
.given .row{display:flex;justify-content:space-between;gap:10px;font-size:19px;padding:8px 0;border-bottom:1px dashed var(--line)}
.given .row b{font-family:var(--mono);color:var(--gold-bright);font-variant-numeric:tabular-nums}
.formula{font-family:var(--mono);font-size:18px;color:var(--cyan);background:rgba(99,224,212,.08);border:1.5px solid rgba(99,224,212,.4);border-radius:12px;padding:10px 14px;margin-top:10px;line-height:1.6}
.math .opts{grid-template-columns:1fr 1fr}
.math .opt{font-size:20px;min-height:64px}
.steps{list-style:none;display:grid;gap:8px;margin-top:12px}
.steps li{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-radius:12px;background:rgba(20,29,61,.92);border:1.5px solid var(--line);font-size:19px;opacity:0;animation:pop .4s ease forwards}
.steps li b{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.1em;flex:none}
.steps li code{font-family:var(--mono);color:var(--gold-bright);font-size:18px}
.chall{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:700;color:#160b33;background:var(--violet);border-radius:100px;padding:3px 10px;margin-left:8px;vertical-align:middle}

/* labs */
.lab canvas{width:100%;display:block;border-radius:16px;border:1.5px solid var(--line);background:#050816}
.readouts{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.ro{flex:1;min-width:150px;background:rgba(20,29,61,.9);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.ro .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ro .v{font-family:var(--display);font-size:30px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.ro .v small{font-size:16px;color:var(--muted);font-weight:400}
.slider{display:flex;align-items:center;gap:14px;margin-top:12px}
.slider label{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none}
.slider input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.badge{display:inline-block;font-family:var(--display);font-weight:700;font-size:26px;padding:4px 16px;border-radius:12px;border:2px solid currentColor}

/* spectra */
.specwrap svg{width:100%;display:block}
.specwrap .lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.shiftopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.shiftopts .opt{justify-content:center;font-family:var(--display);font-size:32px;font-weight:700;min-height:84px}
.shiftopts .opt.r{color:var(--redshift)} .shiftopts .opt.b{color:var(--blueshift)}

/* hubble */
.hub{display:grid;grid-template-columns:660px 1fr;gap:22px;align-items:start}
.hub svg{width:100%;display:block;background:rgba(5,8,22,.85);border:1.5px solid var(--line);border-radius:16px}
.meter{height:14px;border-radius:100px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold),var(--good));transition:width .2s}

/* balloon */
.bal{display:grid;grid-template-columns:700px 1fr;gap:20px;align-items:start}
table.dist{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
table.dist th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--line)}
table.dist th:first-child,table.dist td:first-child{text-align:left}
table.dist td{padding:8px 6px;text-align:right;border-bottom:1px dashed var(--line)}
table.dist td.mv{color:var(--gold-bright);font-weight:700}

/* ordering */
.slots{display:grid;gap:10px;margin-bottom:16px}
.slot{min-height:76px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);color:var(--muted);font-size:15px;padding:6px}
.slot.filled{border-style:solid;border-color:var(--good);background:rgba(143,224,122,.12);color:#fff;font-family:var(--body);font-weight:700;font-size:17px;animation:pop .3s ease}
.slot small{font-weight:400;color:var(--muted);font-size:13px}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:60px}
.tile{background:rgba(20,29,61,.9);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:18px}
.tile:hover{border-color:var(--gold)}
.tile.used{visibility:hidden}
.tile.sel{border-color:var(--cyan);background:rgba(99,224,212,.16)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:13px;margin:-6px 4px 8px}

/* CER */
.cer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px;text-align:left}
.bucket.armed{border-color:var(--cyan);cursor:pointer;background:rgba(99,224,212,.06)}
.bucket h3{font-family:var(--display);font-size:22px;color:var(--gold-bright)}
.bucket h3 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.bucket.trash h3{color:var(--muted)}
.bucket .in{font-size:15px;line-height:1.3;padding:8px 10px;border-radius:10px;background:rgba(143,224,122,.14);border:1.5px solid var(--good);animation:pop .3s ease}
.cerdata{font-size:15px}
.cerdata table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.cerdata td,.cerdata th{padding:4px 8px;border-bottom:1px dashed var(--line);text-align:right}
.cerdata th{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cerdata td:first-child,.cerdata th:first-child{text-align:left}
.cer-tiles .tile{font-size:15px;font-weight:600;max-width:350px;text-align:left;line-height:1.3}

/* who am I */
.who{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.clues{list-style:none;display:grid;gap:12px}
.clue{display:flex;gap:14px;align-items:baseline;padding:14px 18px;border-radius:14px;background:rgba(20,29,61,.9);border:2px solid var(--line);font-size:21px;line-height:1.35}
.clue b{font-family:var(--mono);font-size:13px;color:var(--gold);flex:none;letter-spacing:.1em}
.clue.locked{color:var(--muted);font-style:italic}
.clue.new{border-color:var(--gold);animation:pop .35s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 13px;border-radius:100px;border:1.5px solid var(--line);font-size:15px;color:var(--muted)}
.chip.right{border-color:var(--good);color:#fff;background:rgba(143,224,122,.2);font-weight:700}
.bigreveal{display:none;font-family:var(--display);font-size:40px;font-weight:700;color:var(--good);margin-top:6px}
.bigreveal.show{display:block;animation:pop .4s ease}

.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.mission .panel b{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--cyan)}
.mission .panel p{font-size:20px;line-height:1.35;margin-top:8px;color:#fff}
.mission .panel .m{font-size:15px;color:var(--muted);margin-top:10px}

.final{display:flex;gap:26px;justify-content:center;margin:16px 0}
.final .panel{min-width:230px;text-align:center}
.final .n{font-family:var(--display);font-size:72px;font-weight:700;line-height:1}
.final .chat .n{color:var(--gold-bright)} .final .cos .n{color:var(--violet)}
.rank{font-family:var(--display);font-size:28px;color:var(--cyan);margin-top:4px}

footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 26px 14px;flex:0 0 auto}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.seen{background:rgba(246,180,76,.5)}
.dots i.on{background:var(--gold-bright);transform:scale(1.4)}
.dots i.rd{width:14px;border-radius:4px}

#cd{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(4,7,20,.74);backdrop-filter:blur(4px)}
#cd.show{display:flex}
#cd .num{font-family:var(--display);font-weight:700;font-size:min(30vw,320px);color:var(--gold-bright);text-shadow:0 0 60px rgba(246,180,76,.7);animation:cdpop .6s ease}
@keyframes cdpop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);z-index:45;font-family:var(--display);font-weight:700;font-size:30px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--coral));padding:12px 28px;border-radius:100px;box-shadow:0 10px 40px rgba(240,103,79,.45);display:none}
#toast.show{display:block;animation:cdpop .5s ease}
</style>

<canvas id="starCanvas"></canvas><div class="glow"></div><canvas id="boom"></canvas>
<div id="cd"><div class="num" id="cdNum">3</div></div>
<div id="toast"></div>
<div class="fit" id="fit">
 <div id="deck">
  <header class="bar">
    <div class="brand"><div class="mini" id="mini"></div>
      <div><div class="k">Earth Science A · Astronomy: The Universe</div><div class="t">Rewind the Universe</div></div></div>

      <span class="streak" id="streak" title="3 chat points in a row earns a bonus point"></span>

 </div>

<script>
/* ================= CONTENT: Astronomy — The Universe ================= */
const STAGES=[["Today","13.8 B yrs"],["Nearby galaxies","millions of yrs ago"],["Distant galaxies","billions of yrs ago"],["First galaxies","~13.5 B yrs ago"],["First light (CMB)","380,000 yrs after"],["The Big Bang","13.8 B yrs ago"]];
const NOTES=["",
 "We're looking at light that left nearby galaxies millions of years ago. The universe was a little smaller.",
 "Deep-field galaxies: their light is billions of years old and stretched very red.",
 "The first galaxies are forming. Everything is much closer together.",
 "The universe just cooled enough for atoms to form. Light breaks free — that glow is the CMB.",
 "Everything we see was packed into a hot, dense state."];
const C_KM=300000; // speed of light, km/s

const R1=[
 {q:"Which kind of light has the LONGEST wavelength?",o:["Gamma rays","Visible light","Radio waves","X-rays"],a:2,e:"<b>Radio waves.</b> Wavelengths can be longer than a football field. Gamma rays are smaller than an atom."},

 const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime+w);

function wl2rgb(w){let r=0,g=0,b=0;
 if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}
 else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else r=1;
 r=Math.max(0,Math.min(1,r));g=Math.max(0,Math.min(1,g));b=Math.max(0,Math.min(1,b));
 const f=w<420?.35+.65*(w-380)/40:w>680?.35+.65*(720-w)/40:1,F=Math.max(.3,Math.min(1,f));
 return `rgb(${Math.round(255*r*F)},${Math.round(255*g*F)},${Math.round(255*b*F)})`}
const SX=w=>(w-380)/(720-380)*1000;

 function info(t){let band=BANDS[0][0];BANDS.forEach(b=>{if(t>=b[1])band=b[0]});

  waves.forEach(w=>{const seg=36;for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2,am=(a0+a1)/2;
    const lam=540*(1-vv*Math.cos(am));x.strokeStyle=wl2rgb(Math.max(381,Math.min(719,lam)));x.globalAlpha=Math.max(0,1-w.r/1100);x.lineWidth=2.5;
    x.beginPath();x.arc(w.cx,CY,w.r,a0,a1);x.stroke()}});x.globalAlpha=1;
  /* galaxy */
  const gg=x.createRadialGradient(0,0,0,0,0,58);gg.addColorStop(0,"#fff6dc");gg.addColorStop(.25,"#ffd37e");gg.addColorStop(.6,"rgba(169,139,240,.55)");gg.addColorStop(1,"rgba(169,139,240,0)");
  x.save();x.translate(SRC,CY);x.scale(1,.42);x.rotate(-.2);x.fillStyle=gg;x.beginPath();x.arc(0,0,58,0,7);x.fill();x.restore();
  /* motion arrow */
  if(Math.abs(vv)>.02){x.strokeStyle="#FFD37E";x.fillStyle="#FFD37E";x.lineWidth=4;const dir=Math.sign(vv),len=30+Math.abs(vv)*200;
   x.beginPath();x.moveTo(SRC,CY+70);x.lineTo(SRC+dir*len,CY+70);x.stroke();x.beginPath();x.moveTo(SRC+dir*(len+14),CY+70);x.lineTo(SRC+dir*len,CY+62);x.lineTo(SRC+dir*len,CY+78);x.fill()}
  /* earth */
  const eg=x.createRadialGradient(EARTH-8,CY-8,2,EARTH,CY,30);eg.addColorStop(0,"#9fd8ff");eg.addColorStop(.6,"#2a7be0");eg.addColorStop(1,"#123a7a");
  x.fillStyle=eg;x.beginPath();x.arc(EARTH,CY,28,0,7);x.fill();x.fillStyle="#3fae5a";x.beginPath();x.ellipse(EARTH-6,CY-4,9,13,.4,0,7);x.fill();
  x.font="14px monospace";x.fillStyle="#9AA6D0";x.textAlign="center";x.fillText("EARTH 🔭",EARTH,CY+50);x.fillText("GALAXY",SRC,CY-50);
  x.textAlign="left";x.fillStyle="#9AA6D0";x.fillText("Each ring = one wave crest. Color = wavelength in that direction.",16,22);
  if(!still)raf=requestAnimationFrame(step)}
 sl.oninput=()=>{readouts();if(still){for(let i=0;i<200;i++){waves.forEach(w=>{w.r+=SPD;w.cx-=v()*SPD});if(i%16===0)waves.push({cx:SRC,r:4})}step()}};
 $("#sirenBtn").onclick=()=>{if(siren){sirenOff();return}if(!sound){toast("Sound is muted 🔇");return}
  try{const A=ac(),o=A.createOscillator(),g=A.createGain(),lfo=A.createOscillator(),lg=A.createGain();
   o.type="sawtooth";o.frequency.value=440/(1-v());lfo.frequency.value=2.2;lg.gain.value=40;lfo.connect(lg).connect(o.detune);
   g.gain.value=0;g.gain.setTargetAtTime(.05,A.currentTime,.05);o.connect(g).connect(A.destination);o.start();lfo.start();siren={o,g};
   const b=$("#sirenBtn");b.classList.add("on");b.textContent="🔇 Stop siren"}catch(e){}};
 readouts();step()}

function calc(){const sl=$("#csl");
 function draw(){const obs=+sl.value,d=obs-656,z=d/656,vv=Math.abs(z)*C_KM;
  const xr=SX(656),xo=SX(obs),col=d>0.4?"#FF6A55":d<-0.4?"#6E95FF":"#FFD37E";
  $("#calcSpec").innerHTML=`<svg viewBox="0 0 1000 150" role="img" aria-label="Hydrogen line at ${obs} nanometers"><defs>${RAINBOW("rbc")}</defs>
   <text x="0" y="12" fill="#9AA6D0" font-family="monospace" font-size="13">LAB: hydrogen at 656 nm</text>${strip([656],18,40,"rbc")}
   <line x1="${xr}" y1="60" x2="${xo}" y2="94" stroke="${col}" stroke-width="3" stroke-dasharray="6 5"/>
   <text x="0" y="96" fill="#FFD37E" font-family="monospace" font-size="13">GALAXY</text>${strip([obs],102,40,"rbc")}</svg>
   <div class="lbls"><span class="blue">◀ blueshift</span><span class="red">redshift ▶</span></div>`;
  $("#cObs").innerHTML=`${obs.toFixed(1)} <small>nm</small>`;
  $("#cD").innerHTML=`${d>0?'+':''}${d.toFixed(1)} <small>nm</small>`;$("#cD").style.color=col;
  $("#cZ").textContent=(z>0?'+':'')+z.toFixed(4);
  $("#cV").innerHTML=`${fmt(vv)} <small>km/s ${d>0.4?'AWAY':d<-0.4?'TOWARD':''}</small>`;$("#cV").style.color=col}
 sl.oninput=draw;
 $("#go669").onclick=()=>{let v=+sl.value;const t=669;const iv=setInterval(()=>{v+=(t-v)*.18;if(Math.abs(t-v)<.3){v=t;clearInterval(iv);sfx.level()}sl.value=v;draw()},40)};
 draw()}

/* balloon */
const GAL=(()=>{let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};return Array.from({length:18},()=>({x:(r()*2-1)*1.05,y:(r()*2-1)*.55,h:r()}))})();
const HOME0=GAL.reduce((b,g,i)=>Math.hypot(g.x,g.y)<Math.hypot(GAL[b].x,GAL[b].y)?i:b,0);
let bState={home:HOME0,s:1};
function balloon(){const c=$("#bcv"),x=c.getContext("2d"),sl=$("#bsl"),W=700,H=380,K=95;
 const homeScr=()=>[W/2,H/2];
 function picks(){const h=GAL[bState.home];const ds=GAL.map((g,i)=>[i,Math.hypot(g.x-h.x,g.y-h.y),g]).filter(a=>a[0]!==bState.home&&Math.abs(a[2].x-h.x)*K*2<320&&Math.abs(a[2].y-h.y)*K*2<170).sort((a,b)=>a[1]-b[1]);
  return[ds[0],ds[Math.floor(ds.length/2)],ds[ds.length-1]]}
 function draw(){const s=bState.s,[hx,hy]=homeScr(),h=GAL[bState.home];x.clearRect(0,0,W,H);
  /* grid that stretches */
  x.strokeStyle="rgba(44,58,107,.55)";x.lineWidth=1;const gs=40*s;
  for(let gx=hx%gs;gx<W;gx+=gs){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}
  for(let gy=hy%gs;gy<H;gy+=gs){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
  const P=picks(),labels=["A","B","C"];
  GAL.forEach((g,i)=>{const X=hx+(g.x-h.x)*K*s,Y=hy+(g.y-h.y)*K*s;
   if(s>1.01&&i!==bState.home){const X0=hx+(g.x-h.x)*K,Y0=hy+(g.y-h.y)*K;x.fillStyle="rgba(154,166,208,.25)";x.beginPath();x.arc(X0,Y0,3,0,7);x.fill();
    x.strokeStyle="rgba(255,106,85,.5)";x.lineWidth=1.5;x.beginPath();x.moveTo(X0,Y0);x.lineTo(X,Y);x.stroke()}
   const home=i===bState.home,pi=P.findIndex(p=>p[0]===i);
   const gg=x.createRadialGradient(X,Y,0,X,Y,home?16:11);gg.addColorStop(0,"#fff");gg.addColorStop(.4,home?"#FFD37E":"hsl("+(200+g.h*120)+",80%,75%)");gg.addColorStop(1,"rgba(0,0,0,0)");
   x.fillStyle=gg;x.beginPath();x.arc(X,Y,home?16:11,0,7);x.fill();
   if(home){x.font="20px sans-serif";x.textAlign="center";x.fillText("🏠",X,Y-18)}
   if(pi>=0){x.strokeStyle="rgba(255,211,126,.6)";x.setLineDash([5,5]);x.lineWidth=1.5;x.beginPath();x.moveTo(hx,hy);x.lineTo(X,Y);x.stroke();x.setLineDash([]);
    x.font="bold 16px monospace";x.fillStyle="#FFD37E";x.textAlign="center";x.fillText(labels[pi],X+14,Y-10)}});
  $("#bSz").textContent="×"+s.toFixed(2);
  $("#bTab").innerHTML=P.map((p,i)=>{const d0=p[1]*10,d1=d0*s;return `<tr><td>${labels[i]} <span style="color:var(--muted);font-size:13px">${["nearest","middle","farthest"][i]}</span></td><td>${d0.toFixed(1)}</td><td>${d1.toFixed(1)}</td><td class="mv">+${(d1-d0).toFixed(1)}</td></tr>`}).join("")}
 sl.oninput=()=>{bState.s=sl.value/100;draw()};
 c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;const [hx,hy]=homeScr(),h=GAL[bState.home],s=bState.s;
  let best=-1,bd=30;GAL.forEach((g,i)=>{const X=hx+(g.x-h.x)*K*s,Y=hy+(g.y-h.y)*K*s,d=Math.hypot(X-mx,Y-my);if(d<bd){bd=d;best=i}});
  if(best>=0){bState.home=best;bState.s=1;sl.value=100;tone(520,.08);draw()}};
 $("#bGo").onclick=()=>{let t0=null;const s0=bState.s;cancelAnimationFrame(raf);const anim=ts=>{t0=t0||ts;const k=Math.min(1,(ts-t0)/2200);bState.s=s0+(2-s0)*(1-Math.pow(1-k,3));sl.value=bState.s*100;draw();if(k<1)raf=requestAnimationFrame(anim);else sfx.level()};raf=requestAnimationFrame(anim)};
 $("#bReset").onclick=()=>{cancelAnimationFrame(raf);bState.s=1;sl.value=100;draw()};
 sl.value=bState.s*100;draw()}

/* hubble plot */
function hubble(){const s=S[cur],sl=$("#hsl");const W=660,H=400,L0=70,B0=340,PW=560,PH=300;
 const X=d=>L0+d/300*PW,Y=v=>B0-v/21000*PH;
 function draw(){const m=+sl.value;let err=0;HDATA.forEach(([d,v])=>err+=Math.abs(v-m*d));err/=HDATA.length;
  const q=Math.max(0,1-err/6000);
  let g="";for(let d=0;d<=300;d+=50)g+=`<line x1="${X(d)}" y1="${B0}" x2="${X(d)}" y2="${B0-PH}" stroke="#2C3A6B" stroke-width="1"/><text x="${X(d)}" y="${B0+20}" fill="#9AA6D0" font-size="13" font-family="monospace" text-anchor="middle">${d}</text>`;
  for(let v=0;v<=21000;v+=3000)g+=`<line x1="${L0}" y1="${Y(v)}" x2="${L0+PW}" y2="${Y(v)}" stroke="#2C3A6B" stroke-width="1"/><text x="${L0-8}" y="${Y(v)+4}" fill="#9AA6D0" font-size="12" font-family="monospace" text-anchor="end">${v/1000}k</text>`;
  const ex=Math.min(300,21000/m);
  const best=s.done?`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(300)}" y2="${Y(21000)}" stroke="#8FE07A" stroke-width="3" stroke-dasharray="8 6"/>
   <line x1="${X(0)}" y1="${Y(0)}" x2="${X(200)}" y2="${Y(0)}" stroke="#FFD37E" stroke-width="2"/><line x1="${X(200)}" y1="${Y(0)}" x2="${X(200)}" y2="${Y(14000)}" stroke="#FFD37E" stroke-width="2"/>
   <text x="${X(100)}" y="${Y(0)-8}" fill="#FFD37E" font-size="14" font-family="monospace" text-anchor="middle">run = 200 Mpc</text>
   <text x="${X(200)+8}" y="${Y(7000)}" fill="#FFD37E" font-size="14" font-family="monospace">rise = 14,000 km/s</text>`:"";
  $("#hPlot").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Galaxy speed versus distance scatter plot">${g}
   <text x="${L0+PW/2}" y="${H-12}" fill="#EEF1FB" font-size="14" text-anchor="middle">Distance (Mpc)</text>
   <text x="18" y="${B0-PH/2}" fill="#EEF1FB" font-size="14" text-anchor="middle" transform="rotate(-90 18 ${B0-PH/2})">Speed away (km/s)</text>
   <line x1="${X(0)}" y1="${Y(0)}" x2="${X(ex)}" y2="${Y(m*ex)}" stroke="#F6B44C" stroke-width="4"/>${best}
   ${HDATA.map(([d,v])=>`<circle cx="${X(d)}" cy="${Y(v)}" r="7" fill="#FF6A55" stroke="#fff" stroke-width="1.5"/>`).join("")}</svg>`;
  $("#hH").innerHTML=`${m} <small>km/s per Mpc</small>`;$("#hFit").style.width=(q*100).toFixed(0)+"%"}
 sl.oninput=draw;draw()}

/* ================= INTERACTIONS ================= */
function reveal(){const s=S[cur];if(s.done||cdBusy)return;clearInterval(tInt);
 countdown(()=>{s.done=true;sfx.level();if(s.t==="hubble"){$("#hsl").value=70}render(true)})}
function placeNext(){const s=S[cur];if(s.done)return;const btn=stage.querySelector(`.tile[data-i="${s.next}"]`);if(btn)btn.click()}
function moreClue(){const s=S[cur];if(s.done||s.shown>=3)return;s.shown++;tone(420,.08);render(true)}

function wire(){
 wireAward();wireTimer();
 const rb=stage.querySelector("[data-reveal]");if(rb)rb.onclick=reveal;
 const mb=stage.querySelector("[data-more]");if(mb)mb.onclick=moreClue;
 const s=S[cur];
 if(s.t==="order")stage.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
   const i=+t.dataset.i;if(s.done)return;
   if(i===s.next){s.next++;sfx.good();if(s.next===s.items.length){s.done=true;setTimeout(sfx.level,200)}render(true)}
   else{sfx.bad();t.classList.remove("shake");void t.offsetWidth;t.classList.add("shake")}});
 if(s.t==="cer"){
   stage.querySelectorAll("[data-ct]").forEach(t=>t.onclick=()=>{if(s.done)return;const i=+t.dataset.ct;s.sel=s.sel===i?null:i;tone(500,.05);render(true)});
   stage.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(s.done||s.sel==null)return;
     if(CER_TILES[s.sel].b===b.dataset.b){s.placed.push(s.sel);s.sel=null;sfx.good();if(s.placed.length===CER_TILES.length){s.done=true;setTimeout(sfx.level,200)}render(true)}
     else{sfx.bad();b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}});}
 if(s.t==="round"){const e=$("#evo");if(e&&s.stage>0)setTimeout(()=>{e.innerHTML=uni(s.stage,200);sfx.level()},450)}
 if(s.t==="wavelab")wavelab();
 if(s.t==="doppler")doppler();
 if(s.t==="calc")calc();
 if(s.t==="balloon")balloon();
 if(s.t==="hubble"){if(s.done)$("#hsl").value=70;hubble()}
 if(s.t==="final")bigBang();
}
function render(same){
 const s=S[cur];clearInterval(tInt);
 if(!(same&&s.t==="hubble"))stopAnims(); else stopAnims();
 stage.innerHTML=R[s.t](s);if(same)stage.firstElementChild.classList.add('same');
 paintTrack(s.t==="round"&&s.stage>0&&!same?s.stage-1:s.stage);
 if(s.t==="round"&&s.stage>0&&!same)setTimeout(()=>paintTrack(s.stage),450);
 $("#cur").textContent=cur+1;$("#tot").textContent=S.length;
 $("#prev").disabled=cur===0;$("#next").textContent=cur===S.length-1?"Restart ↺":"Next →";
 [...$("#dots").children].forEach((d,i)=>{d.classList.toggle("on",i===cur);d.classList.toggle("seen",i<cur)});
 wire();
}
function go(i){if(cdBusy)return;cur=Math.max(0,Math.min(S.length-1,i));render()}
let restartArmed=false;
function restart(){if(!restartArmed){restartArmed=true;$("#next").textContent="Click again to reset";setTimeout(()=>{restartArmed=false;if(cur===S.length-1)$("#next").textContent="Restart ↺"},2500);return}
 restartArmed=false;S.forEach(s=>{delete s.done;delete s.awarded;delete s.order;delete s.next;delete s.shown;delete s.placed;delete s.sel});
 score.chat=score.cos=score.streak=0;bState={home:HOME0,s:1};paintScore();go(0)}
$("#next").onclick=()=>cur===S.length-1?restart():go(cur+1);
$("#prev").onclick=()=>go(cur-1);
S.forEach((s,i)=>{const d=document.createElement("i");if(s.t==="round")d.className="rd";d.title=s.t==="round"?`Round ${s.n}: ${s.name}`:`Slide ${i+1}`;d.onclick=()=>go(i);$("#dots").appendChild(d)});

addEventListener("keydown",e=>{
 if(cdBusy)return;if(e.target&&e.target.tagName==="INPUT"&&(e.key==="ArrowRight"||e.key==="ArrowLeft"))return;
 const s=S[cur];
 if(e.key==="ArrowRight"){e.preventDefault();if(cur<S.length-1)go(cur+1)}
 else if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}
 else if(e.key===" "){e.preventDefault();
   if(!s.done&&["mc","tf","mathq","shift","hubble"].includes(s.t))reveal();
   else if(!s.done&&s.t==="order")placeNext();
   else if(!s.done&&s.t==="who"){s.shown<3?moreClue():reveal()}
   else if(cur<S.length-1)go(cur+1)}
 else if((e.key==="c"||e.key==="C")&&(s.done||s.t==="calc"))award("chat");
 else if((e.key==="x"||e.key==="X")&&(s.done||s.t==="calc"))award("cos");
});

/* ================= STARFIELD + BIG BANG ================= */
(function stars(){const c=$("#starCanvas"),x=c.getContext("2d");let W,H,pts=[];
 function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  pts=Array.from({length:Math.round(W*H/5500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6.3,s:.5+Math.random()*1.5}))}
 size();addEventListener("resize",size);
 const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
 (function loop(t){x.clearRect(0,0,W,H);pts.forEach(p=>{x.globalAlpha=still?.7:.35+.65*Math.abs(Math.sin(p.p+t/1000*p.s));x.fillStyle="#fff";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  x.globalAlpha=1;if(!still)requestAnimationFrame(loop)})(0)})();

function bigBang(){[131,196,262,330,392,523,659,784,1047].forEach((f,i)=>tone(f,.6,"triangle",i*.05,.08));
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#boom"),x=c.getContext("2d"),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
 const cols=["#FFFFFF","#FFF0C2","#FFD24A","#FF9E45","#FF6A55","#A98BF0","#6E95FF","#63E0D4"],cx=innerWidth/2,cy=innerHeight*.3,ps=[];
 for(let i=0;i<420;i++){const a=Math.random()*6.283,v=1.5+Math.random()*11;ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*3.2,c:cols[i%8],l:1})}
 let f=0;(function step(){x.clearRect(0,0,innerWidth,innerHeight);
  if(f<14){x.fillStyle=`rgba(255,250,235,${.75-f*.053})`;x.fillRect(0,0,innerWidth,innerHeight)}
  /* particles redden as they fly: the universe cools and stretches */
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.988;p.vy*=.988;p.l-=.0055;x.globalAlpha=Math.max(p.l,0);x.fillStyle=f>70&&p.c==="#FFFFFF"?"#FF9E45":p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  x.globalAlpha=1;f++;if(f<190)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)})()}

fit();paintScore();render();
</script>
