<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dig to the Core — Live Lesson</title>
<style>
/* Fixed 1200x780 stage scaled to the screen, matching the house live-deck style (navy + gold), with lava accents for Unit 7. */
:root{
  --navy:#0A0B1C; --navy2:#121430; --panel:#18193a; --panel2:#22244d;
  --gold:#F6B44C; --gold-bright:#FFD37E; --coral:#F0674F; --cyan:#63E0D4; --violet:#A98BF0;
  --ink:#F1EFF8; --muted:#A6A3C8; --line:#363866; --good:#8FE07A; --bad:#F0674F;
  --magma:#FF7A3D; --rock:#9B6B43;
  --display:Georgia,'Times New Roman',serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',Consolas,Monaco,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

#emberCanvas{position:fixed;inset:0;z-index:0;display:block}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 55% at 50% 115%,rgba(255,110,40,.28),transparent 70%),radial-gradient(ellipse 70% 50% at 50% 0%,rgba(70,60,160,.18),transparent 70%)}
#boom{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}

.fit{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:2}
#deck{position:absolute;left:50%;top:50%;width:1200px;height:780px;transform-origin:center center;display:flex;flex-direction:column}

header.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand .mini{width:44px;height:44px;display:grid;place-items:center}
.brand .k{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.brand .t{font-family:var(--display);font-size:21px;font-weight:700;color:var(--gold-bright);margin-top:2px}
.right{display:flex;align-items:center;gap:14px}
.score{display:flex;align-items:center;gap:10px;background:rgba(24,25,58,.85);border:1.5px solid var(--line);border-radius:100px;padding:6px 16px;font-weight:700;font-size:15px}
.score b{font-family:var(--display);font-size:22px}
.score .chat b{color:var(--gold-bright)} .score .cos b{color:var(--magma)}
.score .vs{color:var(--muted);font-family:var(--mono);font-size:12px}
.streak{font-family:var(--mono);font-size:13px;color:var(--coral);min-width:52px}
.counter{font-family:var(--mono);font-size:14px;color:var(--muted)} .counter b{color:var(--gold-bright)}
.icon{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:rgba(24,25,58,.85);font-size:16px}

/* depth track */
.track{display:flex;padding:2px 40px 0;flex:0 0 auto}
.node{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);position:relative;text-align:center}
.node::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.node:first-child::before{display:none}
.node .d{width:18px;height:18px;border-radius:50%;background:var(--navy2);border:2px solid var(--line);position:relative;z-index:1}
.node.done .d{background:var(--magma);border-color:var(--magma)}
.node.done::before,.node.now::before{background:var(--magma)}
.node.now .d{border-color:var(--gold-bright);box-shadow:0 0 0 5px rgba(255,122,61,.28)}
.node.now{color:var(--gold-bright);font-weight:700}
.node span{margin-top:4px}
.node small{font-family:var(--mono);font-size:10px;opacity:.8}

main{flex:1 1 auto;position:relative;padding:14px 46px 0;overflow:hidden}
.slide{animation:in .35s ease}
.slide.same{animation:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
.eyebrow.gold{color:var(--gold)} .eyebrow.coral{color:var(--coral)}
h1{font-family:var(--display);font-size:52px;line-height:1.08;color:#fff;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:30px;line-height:1.15;color:#fff}
.lead{font-size:21px;color:var(--muted);line-height:1.45;max-width:60ch}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.prompt{font-family:var(--display);font-size:34px;line-height:1.2;color:#fff;margin-bottom:18px;max-width:28ch}
.prompt.wide{max-width:none}
.prompt .hi{color:var(--gold-bright)}
.earthbox{height:220px;display:grid;place-items:center}

.panel{background:rgba(24,25,58,.82);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.chatbeat{border-radius:18px;padding:14px 20px;position:relative;background:linear-gradient(135deg,rgba(246,180,76,.14),rgba(240,103,79,.1));border:2px solid var(--gold);box-shadow:0 0 30px rgba(246,180,76,.18)}
.chatbeat.predict{background:linear-gradient(135deg,rgba(99,224,212,.14),rgba(90,150,255,.1));border-color:var(--cyan);box-shadow:0 0 30px rgba(99,224,212,.15)}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:100px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold));margin-bottom:8px}
.predict .tag{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f}
.ask{font-weight:700;font-size:21px;color:#fff;line-height:1.3}
.ask em{color:var(--gold-bright);font-style:normal}
.predict .ask em{color:var(--cyan)}

.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{font-weight:700;font-size:16px;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1200;box-shadow:0 4px 18px rgba(246,180,76,.35);transition:transform .12s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:rgba(24,25,58,.85);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost.on{border-color:var(--cyan);color:var(--cyan)}
.btn.cy{background:linear-gradient(135deg,#9af0f0,var(--cyan));color:#04231f;box-shadow:0 4px 18px rgba(99,224,212,.3)}
.btn.vi{background:linear-gradient(135deg,#cbb8ff,var(--violet));color:#160b33;box-shadow:0 4px 18px rgba(169,139,240,.3)}
.btn.lava{background:linear-gradient(135deg,#ffb27a,var(--magma));color:#2a0c00;box-shadow:0 4px 18px rgba(255,122,61,.35)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.timer{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold-bright);min-width:70px}
.timer.low{color:var(--coral)}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.btn .kbd{color:inherit;border-color:currentColor;opacity:.7}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:rgba(24,25,58,.85);border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.25;color:var(--ink);min-height:74px;transition:opacity .3s,border-color .3s}
.opt .L{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;color:#1a1200;background:linear-gradient(135deg,var(--gold-bright),var(--gold))}
.opt.right{border-color:var(--good);background:rgba(143,224,122,.16);box-shadow:0 0 28px rgba(143,224,122,.25)}
.opt.right .L{background:var(--good)}
.opt.dim{opacity:.32}
.tf .opt{justify-content:center;font-family:var(--display);font-size:40px;font-weight:700;min-height:110px}
.explain{display:none;margin-top:14px;padding:14px 18px;border-radius:14px;border-left:6px solid var(--good);background:rgba(24,25,58,.92);font-size:20px;line-height:1.4}
.explain.show{display:block;animation:pop .35s ease}
.explain b{color:var(--good)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.award{display:none;gap:10px} .award.show{display:flex}
.awarded{font-weight:700;color:var(--gold-bright);font-size:16px}

/* math */
.math{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.given{display:grid;gap:8px}
.given .row{display:flex;justify-content:space-between;gap:10px;font-size:19px;padding:8px 0;border-bottom:1px dashed var(--line)}
.given .row b{font-family:var(--mono);color:var(--gold-bright);font-variant-numeric:tabular-nums;text-align:right}
.formula{font-family:var(--mono);font-size:18px;color:var(--cyan);background:rgba(99,224,212,.08);border:1.5px solid rgba(99,224,212,.4);border-radius:12px;padding:10px 14px;margin-top:10px;line-height:1.6}
.math .opts{grid-template-columns:1fr 1fr}
.math .opt{font-size:20px;min-height:64px}
.steps{list-style:none;display:grid;gap:8px;margin-top:12px}
.steps li{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-radius:12px;background:rgba(24,25,58,.94);border:1.5px solid var(--line);font-size:19px;opacity:0;animation:pop .4s ease forwards}
.steps li b{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.1em;flex:none}
.steps li code{font-family:var(--mono);color:var(--gold-bright);font-size:18px}
.chall{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:700;color:#160b33;background:var(--violet);border-radius:100px;padding:3px 10px;margin-left:8px;vertical-align:middle}

/* labs */
.lab canvas{width:100%;display:block;border-radius:16px;border:1.5px solid var(--line);background:#07081a}
.readouts{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.ro{flex:1;min-width:150px;background:rgba(24,25,58,.9);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.ro .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ro .v{font-family:var(--display);font-size:28px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.ro .v.sm{font-size:20px}
.ro .v small{font-size:16px;color:var(--muted);font-weight:400}
.slider{display:flex;align-items:center;gap:14px;margin-top:4px}
.slider label{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none}
.slider input[type=range]{flex:1;accent-color:var(--magma);height:28px}
.meter{height:14px;border-radius:100px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--magma),var(--coral));transition:width .2s}
.drillgrid{display:grid;grid-template-columns:470px 1fr;gap:22px;align-items:start}
.drillgrid .readouts{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:10px}
.drillgrid .ro{min-width:0;padding:8px 12px}
.seisgrid{display:grid;grid-template-columns:600px 1fr;gap:20px;align-items:start}
.seisgrid .readouts{flex-direction:column}

/* rock cycle */
.cyclegrid{display:grid;grid-template-columns:680px 1fr;gap:20px;align-items:start}
.cyclegrid svg{width:100%;display:block;background:rgba(7,8,26,.7);border:1.5px solid var(--line);border-radius:16px}
.procs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proc{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(24,25,58,.9);border:1.5px solid var(--line);font-weight:700;font-size:15px;text-align:left;transition:border-color .2s,transform .12s}
.proc:hover{border-color:var(--gold);transform:translateY(-1px)}
.proc span{font-size:20px}
.log{list-style:none;display:grid;gap:4px;font-size:15px;max-height:110px;overflow:hidden}
.log li{padding:4px 8px;border-radius:8px;background:rgba(143,224,122,.1);border-left:3px solid var(--good)}
.mis{display:flex;flex-wrap:wrap;gap:6px}
.mis button{font-size:13px;padding:6px 10px;border-radius:100px;border:1.5px solid var(--line);color:var(--muted)}
.mis button.on{border-color:var(--gold);color:var(--gold-bright)}
.edge{fill:none;stroke:#4a4c80;stroke-width:2.5}
.edge.live{stroke:var(--gold);stroke-width:3.5}
.elabel{font-size:18px}

/* mohs lab */
.mohsbar{position:relative;height:150px;margin:4px 0 10px}
.mohsbar .line{position:absolute;left:30px;right:30px;top:68px;height:12px;border-radius:100px;background:linear-gradient(90deg,#d8d2c0,#c9b27a,#e08a4a,#b85cf0,#8fe0ff)}
.mohsbar .band{position:absolute;top:60px;height:28px;border-radius:100px;border:3px solid var(--good);background:rgba(143,224,122,.22);transition:all .4s;box-shadow:0 0 24px rgba(143,224,122,.35)}
.mref{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink);padding:3px 4px;border-radius:10px;border:1.5px solid transparent;width:92px;text-align:center;line-height:1.15}
.mref:hover{border-color:var(--gold);background:rgba(246,180,76,.1)}
.mref b{font-family:var(--display);font-size:20px;color:var(--gold-bright)}
.mref.top{top:0}.mref.bot{top:96px}
.mref.tested{border-color:var(--cyan);background:rgba(99,224,212,.1)}
.mref.tool b{color:var(--cyan)}
.mohsgrid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{border-color:var(--gold);color:var(--gold-bright);background:rgba(246,180,76,.1)}
.tlog{list-style:none;display:grid;gap:6px}
.tlog li{font-size:16px;padding:7px 10px;border-radius:10px;background:rgba(24,25,58,.92);border:1.5px solid var(--line);animation:pop .3s ease}
.tlog li b{color:var(--gold-bright)}

/* half life */
.hlgrid{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
.atoms{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:rgba(7,8,26,.7)}
.atom{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0BF,#F6B44C 55%,#a86a12);box-shadow:0 0 8px rgba(246,180,76,.55);transition:background .5s,transform .5s,box-shadow .5s}
.atom.d{background:radial-gradient(circle at 35% 35%,#d6dbef,#7480aa 55%,#3a4570);box-shadow:none;transform:scale(.82)}
.atom.flip{animation:flip .55s ease}
@keyframes flip{0%{transform:scale(1)}40%{transform:scale(1.35);box-shadow:0 0 18px #fff}100%{transform:scale(.82)}}
.hlgrid svg{width:100%;display:block;background:rgba(7,8,26,.7);border:1.5px solid var(--line);border-radius:16px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ordering */
.slots{display:grid;gap:10px;margin-bottom:16px}
.slot{min-height:72px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);color:var(--muted);font-size:15px;padding:6px}
.slot.filled{border-style:solid;border-color:var(--good);background:rgba(143,224,122,.12);color:#fff;font-family:var(--body);font-weight:700;font-size:17px;animation:pop .3s ease}
.slot small{font-weight:400;color:var(--muted);font-size:13px}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:56px}
.tile{background:rgba(24,25,58,.9);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:18px}
.tile:hover{border-color:var(--gold)}
.tile.used{visibility:hidden}
.tile.sel{border-color:var(--cyan);background:rgba(99,224,212,.16)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:13px;margin:-6px 4px 8px}
.strata svg{height:172px;width:auto;display:block;margin:0 auto 8px;border-radius:14px;border:1.5px solid var(--line)}

/* CER */
.cer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:8px 10px;min-height:110px;display:flex;flex-direction:column;gap:8px;text-align:left}
.bucket.armed{border-color:var(--cyan);cursor:pointer;background:rgba(99,224,212,.06)}
.bucket h3{font-family:var(--display);font-size:22px;color:var(--gold-bright)}
.bucket h3 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.bucket.trash h3{color:var(--muted)}
.bucket .in{font-size:14px;line-height:1.25;padding:6px 8px;border-radius:10px;background:rgba(143,224,122,.14);border:1.5px solid var(--good);animation:pop .3s ease}
.cerdata{font-size:15px}
.cerdata table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.cerdata td,.cerdata th{padding:4px 8px;border-bottom:1px dashed var(--line);text-align:center}
.cerdata th{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cerdata td:first-child,.cerdata th:first-child{text-align:left}
.cer-tiles .tile{font-size:15px;font-weight:600;max-width:350px;text-align:left;line-height:1.3}

/* who am I */
.who{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.clues{list-style:none;display:grid;gap:12px}
.clue{display:flex;gap:14px;align-items:baseline;padding:14px 18px;border-radius:14px;background:rgba(24,25,58,.9);border:2px solid var(--line);font-size:21px;line-height:1.35}
.clue b{font-family:var(--mono);font-size:13px;color:var(--gold);flex:none;letter-spacing:.1em}
.clue.locked{color:var(--muted);font-style:italic}
.clue.new{border-color:var(--gold);animation:pop .35s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 13px;border-radius:100px;border:1.5px solid var(--line);font-size:15px;color:var(--muted)}
.chip.right{border-color:var(--good);color:#fff;background:rgba(143,224,122,.2);font-weight:700}
.bigreveal{display:none;font-family:var(--display);font-size:40px;font-weight:700;color:var(--good);margin-top:6px}
.bigreveal.show{display:block;animation:pop .4s ease}

.mission{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.mission .panel{padding:16px 18px}
.mission .panel b{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--cyan)}
.mission .panel p{font-size:19px;line-height:1.35;margin-top:8px;color:#fff}
.mission .panel .m{font-size:14px;color:var(--muted);margin-top:10px}

.final{display:flex;gap:26px;justify-content:center;margin:14px 0}
.final .panel{min-width:230px;text-align:center}
.final .n{font-family:var(--display);font-size:72px;font-weight:700;line-height:1}
.final .chat .n{color:var(--gold-bright)} .final .cos .n{color:var(--magma)}
.rank{font-family:var(--display);font-size:28px;color:var(--cyan);margin-top:4px}

footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 26px 14px;flex:0 0 auto}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.seen{background:rgba(255,122,61,.55)}
.dots i.on{background:var(--gold-bright);transform:scale(1.4)}
.dots i.rd{width:14px;border-radius:4px}

#cd{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(6,6,18,.74);backdrop-filter:blur(4px)}
#cd.show{display:flex}
#cd .num{font-family:var(--display);font-weight:700;font-size:min(30vw,320px);color:var(--gold-bright);text-shadow:0 0 60px rgba(255,122,61,.75);animation:cdpop .6s ease}

<script>
/* ================= CONTENT: Unit 7 — Earth's Processes: Rocks ================= */
const STAGES=[["Surface","0 km"],["Crust","~35 km"],["Asthenosphere","100–660 km"],["Mesosphere","660–2,890 km"],["Outer core","2,890–5,150 km"],["Inner core","6,371 km"]];
const NOTES=["",
 "We broke through the crust, Earth's thin rocky skin. Humans have only ever drilled about 12 km of it.",
 "Welcome to the asthenosphere: solid rock that slowly flows like putty. The tectonic plates ride on top of it.",
 "The mesosphere (lower mantle). Hotter and denser, and crushing pressure makes it rigid again.",
 "Splash! The outer core is liquid iron and nickel. Its swirling makes Earth's magnetic field.",
 "The inner core: solid iron and nickel, about as hot as the surface of the Sun."];

const BANK_LAYERS=["Crust","Mantle","Lithosphere","Asthenosphere","Mesosphere","Outer core","Inner core"];
const BANK_MIN=["Talc","Gypsum","Calcite","Fluorite","Quartz","Pyrite","Hematite","Halite","Diamond","Sulfur"];

/* ---- Round 1: Layer Cake ---- */
const R1=[
 {q:"Of the three layers by composition (crust, mantle, core), which is the THICKEST?",o:["Crust","Mantle","Core","They're all about equal"],a:1,e:"<b>The mantle.</b> It's about 2,850 km thick and makes up roughly 84% of Earth's volume. The crust is only 5–70 km."},
 {q:"The asthenosphere is best described as…",o:["A rigid, brittle solid","A layer of liquid metal","Solid rock that slowly flows, like putty","An empty gap between layers"],a:2,e:"<b>Solid but moldable,</b> like plastic or putty. It's denser than the lithosphere but less rigid, so the plates above it can slide."},
 {q:"Why are the heaviest, densest materials found in Earth's core?",o:["Gravity pulled heavy elements toward the center","Meteorites dropped them there recently","Heat makes heavy metals float","The core is hollow, so they fit there"],a:0,e:"<b>Gravity.</b> As Earth formed by <b>accretion</b> (rock and dust smashing together), heavy iron and nickel sank to the middle. Light rock stayed near the top."},
];
const WHO1=[
 {ans:"Outer core",bank:BANK_LAYERS,c:["I'm about 2,900 km below your feet.","I'm the only layer that is completely liquid.","My swirling liquid iron creates Earth's magnetic field."]},
 {ans:"Lithosphere",bank:BANK_LAYERS,c:["I'm the least dense mechanical layer, and I'm a rigid solid.","I include the crust plus the very top of the mantle.","I'm broken into giant pieces called tectonic plates."]},
];
const M1={q:"The deepest hole ever drilled (Kola, Russia) is about 12 km deep. Earth's center is 6,371 km down. What percent of the way did we get?",
 given:[["Hole depth","12 km"],["Depth to center","6,371 km"]],formula:"percent = part ÷ whole × 100",
 o:["0.19%","1.9%","12%","19%"],a:0,
 steps:["Part ÷ whole: <code>12 ÷ 6,371 ≈ 0.0019</code>","Times 100: <code>0.0019 × 100 = 0.19%</code>","Not even one-fifth of one percent. That's why scientists need <b style='color:var(--good)'>indirect</b> evidence like seismic waves."]};
const M2={q:"In the crust, rock gets about 25 °C hotter for every kilometer you go down. The surface is 15 °C. How hot is the rock 3 km down?",
 given:[["Surface temperature","15 °C"],["Heating rate","+25 °C per km"],["Depth","3 km"]],formula:"temp = surface + (rate × depth)",
 o:["40 °C","75 °C","90 °C","105 °C"],a:2,
 steps:["Extra heat: <code>25 × 3 = 75 °C</code>","Add the surface: <code>15 + 75 = 90 °C</code>","Almost boiling, only 3 km down. Miners deep underground need air conditioning!"]};
const M3={q:"Shrink Earth to a basketball with a 12 cm radius. The crust is about 35 km thick out of Earth's 6,371 km radius. How thick is the crust on the basketball?",chall:true,
 given:[["Crust thickness","35 km"],["Earth's radius","6,371 km"],["Basketball radius","12 cm"]],formula:"fraction = 35 ÷ 6,371<br>model = fraction × 12 cm",
 o:["About 0.7 mm","About 7 mm","About 3.5 cm","About 7 cm"],a:0,
 steps:["Fraction of the radius: <code>35 ÷ 6,371 ≈ 0.0055</code>","Scale it: <code>0.0055 × 12 cm ≈ 0.066 cm</code>","<code>0.066 cm ≈ 0.7 mm</code>, about as thick as a credit card. The crust is like the skin on an apple."]};

/* ---- Round 2: Seismic Detective ---- */
const R2=[
 {q:"Nobody has drilled through the crust. So how do scientists 'see' inside Earth?",o:["Robots have been sent to the core","They study seismic waves, the way doctors use X-rays","They guess from the color of the soil","They look down volcanoes with cameras"],a:1,e:"<b>Indirect observation.</b> Seismic waves from earthquakes bend, speed up, slow down, or stop as they hit different layers, like medical imaging for the planet."},
 {q:"Seismographs on the far side of Earth record P waves but NO S waves. What does that tell us?",o:["The inner core is hollow","Part of the core is liquid, and S waves can't travel through liquid","S waves are too weak to travel that far","The mantle is made of metal"],a:1,e:"<b>A liquid outer core.</b> S waves only move through solids. The 'shadow' where S waves vanish proves something liquid is down there."},
 {q:"1909, Croatia: Andrija Mohorovičić noticed earthquake waves suddenly SPED UP after traveling a certain distance. What had they hit?",o:["An underground ocean","A boundary into denser rock: the mantle","The inner core","A giant cave"],a:1,e:"<b>The mantle.</b> Waves travel faster in denser rock, and they bent (refracted) like light through a prism. The crust–mantle boundary is now called the <b>Moho</b> in his honor."},
 {q:"Scientists squeeze a tiny rock between two diamonds to copy the pressure deep in Earth. Why use diamonds?",o:["They're the cheapest crystals","They're the hardest mineral AND they're clear, so you can watch the rock change","They're magnetic","They melt the rock instantly"],a:1,e:"<b>Hard + clear.</b> A diamond anvil cell can create more pressure than Earth's core, and scientists watch the rock change color, shape, or texture under a microscope in real time."},
];
const M4={q:"P waves travel about 6 km per second through rock. A seismograph is 300 km from an earthquake. How long until the P wave arrives?",
 given:[["Distance","300 km"],["P-wave speed","6 km/s"]],formula:"time = distance ÷ speed",
 o:["18 seconds","50 seconds","306 seconds","1,800 seconds"],a:1,
 steps:["Set it up: <code>time = 300 ÷ 6</code>","<code>time = 50 seconds</code>","Less than a minute to cross 300 km, faster than a jet by about 20 times!"]};
const M5={q:"Same quake, 300 km away. S waves are slower: 3 km/s. How many seconds AFTER the P wave does the S wave show up?",
 given:[["Distance","300 km"],["P-wave arrival","50 s"],["S-wave speed","3 km/s"]],formula:"S time = distance ÷ speed<br>lag = S time − P time",
 o:["50 seconds","100 seconds","150 seconds","2 seconds"],a:0,
 steps:["S-wave time: <code>300 ÷ 3 = 100 s</code>","Lag: <code>100 − 50 = 50 s</code>","That gap between P and S is how seismologists figure out <b style='color:var(--good)'>how far away</b> a quake was."]};
const M6={q:"Work backwards: a station records the S wave 40 seconds after the P wave. With P = 6 km/s and S = 3 km/s, how far away was the quake?",chall:true,
 given:[["S − P lag","40 s"],["P-wave speed","6 km/s"],["S-wave speed","3 km/s"]],formula:"each km, S falls behind by<br>1/3 − 1/6 = 1/6 s",
 o:["120 km","240 km","360 km","720 km"],a:1,
 steps:["Per km: S takes <code>1/3 s</code>, P takes <code>1/6 s</code> → S loses <code>1/6 s</code> every km","Distance: <code>40 ÷ (1/6) = 40 × 6 = 240 km</code>","Check: P = <code>240 ÷ 6 = 40 s</code>, S = <code>240 ÷ 3 = 80 s</code>, lag = 40 s ✅"]};
const M7={q:"GPS satellites show a tectonic plate creeping 5 cm per year. How far does it move in 1 million years?",
 given:[["Speed","5 cm per year"],["Time","1,000,000 years"],["Conversions","100 cm = 1 m, 1,000 m = 1 km"]],formula:"distance = speed × time",
 o:["5 km","50 km","500 km","5,000 km"],a:1,
 steps:["Multiply: <code>5 × 1,000,000 = 5,000,000 cm</code>","To meters: <code>÷ 100 = 50,000 m</code>","To km: <code>÷ 1,000 = 50 km</code>. Slow motion that builds mountains and tells us the mantle is moving."]};

/* ---- Round 3: Rock Cycle Remix ---- */
const R3=[
 {q:"Granite has big crystals you can see. Basalt's crystals are tiny. Why?",o:["Granite's magma cooled slowly underground; basalt's lava cooled fast at the surface","Granite is always older","Basalt was squeezed harder","Granite has fossils in it"],a:0,e:"<b>Cooling speed.</b> Slow cooling underground gives crystals time to grow big. Lava that erupts hits cool air and hardens fast, so crystals stay tiny."},
 {q:"A rock has flat layers and a seashell fossil inside it. It's most likely…",o:["Igneous","Sedimentary","Metamorphic","Magma"],a:1,e:"<b>Sedimentary.</b> Layers of sediment get buried, squeezed, and glued together, trapping once-living things as fossils. Heat would have destroyed the shell."},
 {q:"Limestone gets buried deep and squeezed by heat and pressure, but it doesn't melt. It becomes…",o:["Magma","Marble, a metamorphic rock","Sandstone","Granite"],a:1,e:"<b>Marble.</b> Heat and pressure change a rock without melting it. That's <b>metamorphic</b> rock. If it melted, it would become magma instead."},
 {q:"Where does the energy that drives the rock cycle come from?",o:["The Sun and radioactive decay inside Earth","Only the Moon's gravity","Only ocean waves","Lightning strikes"],a:0,e:"<b>Two engines.</b> The Sun powers wind, rain, and water that weather rock. Heat from radioactive decay inside Earth melts and squeezes rock."},
];
const M8={q:"A lake bottom collects 2 mm of sediment every year. How long does it take to build a layer 10 m thick?",
 given:[["Rate","2 mm per year"],["Layer thickness","10 m"],["Conversion","1 m = 1,000 mm"]],formula:"time = thickness ÷ rate",
 o:["5 years","500 years","5,000 years","50,000 years"],a:2,
 steps:["Same units: <code>10 m × 1,000 = 10,000 mm</code>","Divide: <code>10,000 ÷ 2 = 5,000 years</code>","One cliff can hold hundreds of layers like this. That's how James Hutton realized Earth is <b style='color:var(--good)'>very</b> old."]};

/* ---- Round 4: Mineral ID Lab ---- */
const R4=[
 {q:"A shiny, gold-colored mineral leaves a GREENISH-BLACK streak on the porcelain plate. What is it?",o:["Gold, because color never lies","Pyrite (fool's gold), because streak beats color","Talc, because it's soft","Quartz, because it's glassy"],a:1,e:"<b>Pyrite.</b> Real gold leaves a gold streak. A mineral's surface color can trick you, but its <b>streak</b> (the color of its powder) stays the same."},
 {q:"Every time you break a mineral, it splits into smooth, flat sides. That property is called…",o:["Fracture","Cleavage","Luster","Streak"],a:1,e:"<b>Cleavage.</b> It breaks along planes where the bonds between atoms are weak. Minerals with no weak planes <b>fracture</b> into rough or curved pieces instead."},
];
const WHO4=[
 {ans:"Calcite",bank:BANK_MIN,c:["My hardness is 3. A copper coin can scratch me.","Drop some acid on me and I fizz with carbon dioxide bubbles.","I'm the main mineral in limestone and marble."]},
 {ans:"Talc",bank:BANK_MIN,c:["I'm number 1 on the Mohs scale, the softest of all.","Your fingernail scratches me easily.","I feel soapy or greasy when you rub me."]},
 {ans:"Quartz",bank:BANK_MIN,c:["My hardness is 7, so I can scratch glass.","I have a glassy (vitreous) luster.","I have no cleavage. I break with curved, shell-shaped fractures."]},
];
const M9={q:"A mystery mineral scratches apatite (5). But orthoclase (6) and quartz (7) both scratch IT. What's its hardness?",
 given:[["It scratches","Apatite · 5"],["Scratched by","Orthoclase · 6"],["Scratched by","Quartz · 7"]],formula:"scratches it → it's harder<br>gets scratched → it's softer",
 o:["Less than 5","Between 5 and 6","Between 6 and 7","More than 7"],a:1,
 steps:["It beats apatite → hardness <code>&gt; 5</code>","Orthoclase beats it → hardness <code>&lt; 6</code>","So <code>5 &lt; hardness &lt; 6</code>. Quartz is a clue we didn't even need: the closest test wins."]};
const M10={q:"About 70% of minerals have a glassy (vitreous) luster. A rock collection has 40 minerals. About how many are glassy?",
 given:[["Glassy share","70%"],["Minerals in collection","40"]],formula:"part = percent ÷ 100 × whole",
 o:["7","12","28","30"],a:2,
 steps:["Percent to decimal: <code>70 ÷ 100 = 0.70</code>","Multiply: <code>0.70 × 40 = 28</code>","About <b style='color:var(--good)'>28 glassy</b> and 12 metallic, dull, or other lusters."]};

/* ---- Round 5: Rock Clock ---- */
const R5a={q:"In undisturbed rock layers, newer layers are laid down on top of older ones. This rule is called…",o:["Superposition","Original horizontality","Cross-cutting relationships","Radiometric dating"],a:0,e:"<b>Superposition.</b> Oldest on the bottom, youngest on top, like a pile of laundry. <b>Original horizontality</b> says layers start out flat. <b>Cross-cutting</b> says whatever cuts through is younger."};
const R5b={q:"'Layer B is older than layer A' is ___ dating. 'Layer B is 300 million years old' is ___ dating.",o:["absolute; relative","relative; absolute","relative; relative","absolute; absolute"],a:1,e:"<b>Relative, then absolute.</b> Relative dating gives the <b>order</b>. Absolute (radiometric) dating gives an actual <b>number of years</b> using radioactive decay."};
const M11={q:"Uranium-235 has a half-life of 704 million years. A rock has 25% of its original uranium-235 left. How old is it?",
 given:[["Half-life","704 million yrs"],["Parent left","25%"]],formula:"100% → 50% → 25% …<br>age = half-lives × half-life",
 o:["352 million yrs","704 million yrs","1,408 million yrs","2,816 million yrs"],a:2,
 steps:["Count the halvings: <code>100% → 50% → 25%</code> = <code>2 half-lives</code>","Multiply: <code>2 × 704 = 1,408 million years</code>","That's about <b style='color:var(--good)'>1.4 billion years</b> old."]};
const M12={q:"A crystal formed with 800 parent atoms. Now only 100 parent atoms remain. The half-life is 1.3 billion years. How old is the crystal?",chall:true,
 given:[["Parent atoms at start","800"],["Parent atoms now","100"],["Half-life","1.3 billion yrs"]],formula:"keep halving until you hit 100,<br>then × half-life",
 o:["1.3 billion yrs","2.6 billion yrs","3.9 billion yrs","10.4 billion yrs"],a:2,
 steps:["Halve: <code>800 → 400 → 200 → 100</code> = <code>3 half-lives</code>","Multiply: <code>3 × 1.3 = 3.9 billion years</code>","Daughter atoms: <code>800 − 100 = 700</code>. A 7 : 1 daughter-to-parent ratio means 3 half-lives."]};
const M13={q:"In 1787, most people thought Earth was about 6,000 years old. Scientists now measure about 4.6 billion years. About how many times older is it?",
 given:[["Old guess","6,000 yrs"],["Measured age","4,600,000,000 yrs"]],formula:"times older = new ÷ old",
 o:["About 7,700","About 77,000","About 770,000","About 7.7 million"],a:2,
 steps:["Divide: <code>4,600,000,000 ÷ 6,000</code>","<code>≈ 766,667</code> → about <b>770,000 times</b> older","Hutton guessed it from slow erosion and rock layers, long before anyone could measure it."]};

/* ---- Round 6: CER + Lightning ---- */
const CER_TILES=[
 {t:"Earth's outer core is liquid.",b:"C"},
 {t:"No station farther than about 104° from the quake recorded any S waves.",b:"E"},
 {t:"Stations on the far side (160° and 180°) still recorded P waves.",b:"E"},
 {t:"S waves can't travel through liquid, so a liquid layer must be blocking them.",b:"R"},
 {t:"P waves can pass through liquid but bend when they enter it, leaving a shadow zone.",b:"R"},
 {t:"The core must be liquid because it's the hottest layer.",b:"T"},
 {t:"The earthquake was just too weak to reach the far side.",b:"T"},
];
const CER_DATA=[["Station 1","40°","✅","✅"],["Station 2","90°","✅","✅"],["Station 3","120°","❌","❌"],["Station 4","160°","✅ bent","❌"],["Station 5","180°","✅","❌"]];
const R6=[
 {q:"The mantle is the thickest compositional layer of Earth.",a:true,e:"<b>True.</b> About 2,850 km thick, much thicker than the crust."},
 {q:"The inner core is liquid because it's the hottest layer.",a:false,e:"<b>False.</b> It's the hottest, but crushing pressure keeps it <b>solid</b>. The <b>outer</b> core is the liquid one."},
 {q:"S waves can travel through liquids.",a:false,e:"<b>False.</b> Only P waves get through liquid. That's how we found the liquid outer core."},
 {q:"Sedimentary rocks often have layers and fossils.",a:true,e:"<b>True.</b> They form from sediment pressed and cemented together in layers."},
 {q:"In undisturbed rock layers, the oldest layer is on top.",a:false,e:"<b>False.</b> Superposition: the oldest is on the <b>bottom</b>."},
 {q:"A mineral's streak color can be different from the color it looks.",a:true,e:"<b>True.</b> Pyrite looks gold but streaks greenish-black."},
 {q:"A rock layer that cuts across other layers is older than they are.",a:false,e:"<b>False.</b> Cross-cutting relationships: the thing doing the cutting is <b>younger</b>."},
];

/* ================= BUILD THE SLIDE LIST ================= */
const S=[];
S.push({t:"title",stage:0});
S.push({t:"missions",stage:0});
S.push({t:"rules",stage:0});
const round=(n,name,blurb,hype)=>S.push({t:"round",n,name,blurb,hype,stage:n-1});
round(1,"Layer Cake","Earth's layers: what they're made of and how they behave.","Grab your hard hats. Every right answer in chat drills us deeper.");
S.push({t:"drill",stage:0});
R1.forEach((q,i)=>S.push({t:"mc",r:"Round 1 · Layer Cake",k:`Q${i+1}`,...q,stage:0}));
WHO1.forEach((w,i)=>S.push({t:"who",r:"Round 1 · Who Am I?",k:`Mystery layer ${i+1}`,...w,stage:0}));
S.push({t:"mathq",r:"Round 1 · Depth Math",...M1,stage:0});
S.push({t:"mathq",r:"Round 1 · Heat Math",...M2,stage:0});
S.push({t:"mathq",r:"Round 1 · Scale Model",...M3,stage:0});
round(2,"Seismic Detective","Earthquake waves are our X-ray machine for the planet.","Predict where the waves go before I fire them. Chat calls every shot.");
S.push({t:"seismic",stage:1});
R2.forEach((q,i)=>S.push({t:"mc",r:"Round 2 · Seismic Detective",k:`Q${i+1}`,...q,stage:1}));
S.push({t:"mathq",r:"Round 2 · Wave Math",...M4,stage:1});
S.push({t:"mathq",r:"Round 2 · Wave Math",...M5,stage:1});
S.push({t:"mathq",r:"Round 2 · Locate the Quake",...M6,stage:1});
S.push({t:"mathq",r:"Round 2 · Plate Math",...M7,stage:1});
round(3,"Rock Cycle Remix","Igneous, sedimentary, metamorphic, and how any rock can become any other.","You control the planet. Chat picks the process, and the rock has to follow.");
S.push({t:"cycle",stage:2});
R3.forEach((q,i)=>S.push({t:"mc",r:"Round 3 · Rock Cycle",k:`Q${i+1}`,...q,stage:2}));
S.push({t:"order",r:"Round 3 · Rock Recipe",prompt:"Chat: put the steps for making SEDIMENTARY rock in order.",scale:["First","Last"],
  items:[["Weathering","rock breaks apart"],["Erosion","wind & water carry it"],["Deposition","sediment settles in layers"],["Compaction","weight squeezes it"],["Cementation","minerals glue it"]],
  wrap:"Break it, move it, drop it, squeeze it, glue it. Sandstone, shale, and limestone are all made this way.",stage:2});
S.push({t:"mathq",r:"Round 3 · Sediment Math",...M8,stage:2});
round(4,"Mineral ID Lab","Hardness, streak, cleavage, luster, and a few weird tricks.","Mystery specimens incoming. Chat runs the tests, chat names the mineral.");
S.push({t:"mohs",stage:3});
S.push({t:"mathq",r:"Round 4 · Scratch Logic",...M9,stage:3});
R4.forEach((q,i)=>S.push({t:"mc",r:"Round 4 · Mineral ID",k:`Q${i+1}`,...q,stage:3}));
WHO4.forEach((w,i)=>S.push({t:"who",r:"Round 4 · Who Am I?",k:`Mystery mineral ${i+1} of ${WHO4.length}`,...w,stage:3}));
S.push({t:"mathq",r:"Round 4 · Luster Math",...M10,stage:3});
round(5,"Rock Clock","How old is a rock? Put layers in order, then use radioactive decay as a stopwatch.","Rock detectives: chat reads the layers, then we start the atomic clock.");
S.push({t:"mc",r:"Round 5 · Rock Clock",k:"Relative dating",...R5a,stage:4});
S.push({t:"order",r:"Round 5 · Read the Outcrop",strata:true,prompt:"Chat: which formed FIRST? Then next? (Watch the red dike!)",scale:["Oldest","Youngest"],
  items:[["Layer D","bottom layer"],["Layer C",""],["Layer B","has fossils"],["Dike X","cuts through B, C, D"],["Layer A","top, not cut"]],
  wrap:"<b>Superposition</b> puts D, C, B in order from the bottom up. <b>Cross-cutting</b> says dike X is younger than everything it cuts, but older than layer A, which sits on top of it uncut.",stage:4});
S.push({t:"mc",r:"Round 5 · Rock Clock",k:"Relative vs. absolute",...R5b,stage:4});
S.push({t:"halflife",stage:4});
S.push({t:"mathq",r:"Round 5 · Half-Life Math",...M11,stage:4});
S.push({t:"mathq",r:"Round 5 · Half-Life Math",...M12,stage:4});
S.push({t:"mathq",r:"Round 5 · Deep Time",...M13,stage:4});
round(6,"Core Showdown","Prove the outer core is liquid with real data, then a lightning round to finish.","Last layer. Build the explanation, then speed-run the true/false.");
S.push({t:"cer",stage:5});
R6.forEach((q,i)=>S.push({t:"tf",r:"Round 6 · Lightning",k:`${i+1} of ${R6.length}`,...q,stage:5}));
S.push({t:"final",stage:5});

/* ================= STATE + HELPERS ================= */
let cur=0;const score={chat:0,cos:0,streak:0};
const $=s=>document.querySelector(s);const stage=$("#stage");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDEFGH";
const fmt=n=>Math.round(n).toLocaleString("en-US");
const LABS=["drill","seismic","cycle","mohs","halflife"];

/* sound */
let AC,sound=true;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d=.12,type="sine",w=0,v=.12){if(!sound)return;try{const A=ac();
 const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime+w);
 g.gain.exponentialRampToValueAtTime(.001,A.currentTime+w+d);o.connect(g).connect(A.destination);o.start(A.currentTime+w);o.stop(A.currentTime+w+d+.02)}catch(e){}}

 level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",i*.1)),tick:()=>tone(880,.05,"square",0,.04),

/* Earth cross-section with the drill (not to scale: crust exaggerated) */
const DRILL_R=[1,.93,.89,.62,.36,0];
function earth(st,size){const r=[48,45.4,42.6,26.2,9.1],col=["#9B6B43","#E0703A","#B83A28","#FF9A2E","#FFE08A"];
 const reach=[0,1,2,2,3,4][st];const tip=2+48*(1-DRILL_R[st]);
 let svg=`<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">`;
 svg+=`<circle cx="50" cy="50" r="49.5" fill="none" stroke="rgba(99,224,212,.45)" stroke-width="1"/>`;
 r.forEach((rr,i)=>{const lit=st>0&&i<=reach;svg+=`<circle cx="50" cy="50" r="${rr}" fill="${col[i]}" opacity="${st===0?.85:lit?1:.55}"/>`});
 if(st===5)svg+=`<circle cx="50" cy="50" r="14" fill="#fff6cf" opacity=".55"/><circle cx="50" cy="50" r="6" fill="#fff"/>`;
 svg+=`<circle cx="50" cy="50" r="48" fill="url(#sh${size})"/><defs><radialGradient id="sh${size}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient></defs>`;
 svg+=`<line x1="50" y1="-2" x2="50" y2="${tip}" stroke="#F1EFF8" stroke-width="${size<60?3:1.6}"/>`;
 svg+=`<circle cx="50" cy="${tip}" r="${size<60?4:2.6}" fill="#FFD37E"/><circle cx="50" cy="${tip}" r="${size<60?6:5}" fill="#FFD37E" opacity=".35"/>`;
 return svg+`</svg>`}

const TOOLS=[["💅 Fingernail",2.5],["🪙 Copper coin",3.5],["🪟 Glass",5.5],["🔩 Steel nail",6.5]];
const MYST=[{n:"Halite (rock salt)",h:2.5,col:"#e9e4d8",fact:"Breaks into perfect little cubes (cubic cleavage)."},
 {n:"Pyrite (fool's gold)",h:6.5,col:"#d8b54a",fact:"Brassy metallic luster but a greenish-black streak."},
 {n:"Garnet",h:7.5,col:"#9b1f35",fact:"So hard it's crushed up and used as sandpaper grit."}];
let mo={m:0,tests:[[],[],[]],rev:[false,false,false]};
function mohs(){const X=h=>30+(h-1)/9*1048;
 function bounds(){let lo=null,hi=null;mo.tests[mo.m].forEach(([n,h])=>{const H=MYST[mo.m].h;if(h<H)lo=lo==null?h:Math.max(lo,h);else if(h>H)hi=hi==null?h:Math.min(hi,h);else{lo=h;hi=h}});return[lo,hi]}
 function paint(){const [lo,hi]=bounds(),M=MYST[mo.m],done=mo.tests[mo.m].map(t=>t[0]);
  const bl=lo==null?.6:lo,bh=hi==null?10.4:hi;
  $("#mbar").innerHTML=`<div class="line"></div><div class="band" style="left:${X(bl)-14}px;width:${Math.max(28,X(bh)-X(bl)+28)}px"></div>
   ${MOHS.map(m=>`<button class="mref top ${done.includes(m[0])?'tested':''}" data-h="${m[1]}" data-n="${m[0]}" style="left:${X(m[1])}px"><b>${m[1]}</b>${m[0]}</button>`).join("")}
   ${TOOLS.map(t=>`<button class="mref bot tool ${done.includes(t[0])?'tested':''}" data-h="${t[1]}" data-n="${t[0]}" style="left:${X(t[1])}px"><b>${t[1]}</b>${t[0]}</button>`).join("")}`;
  $("#mtabs").innerHTML=MYST.map((_,i)=>`<button class="${i===mo.m?'on':''}" data-t="${i}">Mystery ${i+1}</button>`).join("");
  $("#mspec").innerHTML=`<svg width="90" height="80" viewBox="0 0 90 80" aria-hidden="true"><polygon points="45,4 80,26 72,70 18,74 8,30" fill="${M.col}" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><polygon points="45,4 52,40 18,74 8,30" fill="#fff" opacity=".18"/></svg>
   <div><div style="font-family:var(--display);font-size:24px;font-weight:700">${mo.rev[mo.m]?M.n:"Mystery "+(mo.m+1)+" ❓"}</div><div style="color:var(--muted);font-size:15px;margin-top:4px">${mo.rev[mo.m]?`Hardness ${M.h}. ${M.fact}`:"Run scratch tests to find out."}</div></div>`;
  $("#mrange").innerHTML=lo!=null&&hi!=null&&lo===hi?`about <b style="color:var(--gold-bright)">${lo}</b>`:`${lo==null?'?':`more than <b style="color:var(--gold-bright)">${lo}</b>`} ${lo!=null||hi!=null?'and':''} ${hi==null?(lo==null?'':'?'):`less than <b style="color:var(--gold-bright)">${hi}</b>`}`;
  $("#mlog").innerHTML=mo.tests[mo.m].slice(-4).reverse().map(([n,h])=>{const H=M.h;return `<li>${h>H?`<b>${n}</b> (${h}) scratched the mystery → it's <b>softer than ${h}</b>`:h<H?`The mystery scratched <b>${n}</b> (${h}) → it's <b>harder than ${h}</b>`:`<b>${n}</b> (${h}) and the mystery scratch each other → <b>about ${h}</b>`}</li>`}).join("")||`<li style="color:var(--muted)">No tests yet. Chat, which one first?</li>`;
  $("#mrev").textContent=mo.rev[mo.m]?"✅ Revealed":"🥁 Reveal mineral";
  stage.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const n=b.dataset.n,h=+b.dataset.h;if(!mo.tests[mo.m].some(t=>t[0]===n))mo.tests[mo.m].push([n,h]);sfx.scratch();paint()});
  stage.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{mo.m=+b.dataset.t;tone(520,.06);paint()})}
 $("#mrev").onclick=()=>{if(mo.rev[mo.m])return;countdown(()=>{mo.rev[mo.m]=true;sfx.level();paint()})};
 paint()}

/* ================= LAB 5: HALF-LIFE ================= */
let hl={atoms:Array(100).fill(1),hist:[100]};
function halflife(){const host=$("#atoms");
 host.innerHTML=hl.atoms.map((a,i)=>`<div class="atom ${a?'':'d'}" data-i="${i}"></div>`).join("");
 function plot(){const W=560,H=190,L0=46,B0=160,PW=490,PH=140,X=n=>L0+n/7*PW,Y=v=>B0-v/100*PH;
  let g="";for(let n=0;n<=7;n++)g+=`<line x1="${X(n)}" y1="${B0}" x2="${X(n)}" y2="${B0-PH}" stroke="#363866"/><text x="${X(n)}" y="${B0+16}" fill="#A6A3C8" font-size="12" font-family="monospace" text-anchor="middle">${n}</text>`;
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${L0}" y1="${Y(v)}" x2="${L0+PW}" y2="${Y(v)}" stroke="#363866"/><text x="${L0-6}" y="${Y(v)+4}" fill="#A6A3C8" font-size="12" font-family="monospace" text-anchor="end">${v}</text>`);
  const exp=Array.from({length:8},(_,n)=>`${X(n)},${Y(100/2**n)}`).join(" ");
  const real=hl.hist.map((v,n)=>`${X(Math.min(n,7))},${Y(v)}`).join(" ");
  $("#hPlot").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Parent atoms remaining after each half-life">${g}
   <polyline points="${exp}" fill="none" stroke="#63E0D4" stroke-width="2" stroke-dasharray="6 5"/>
   <polyline points="${real}" fill="none" stroke="#F6B44C" stroke-width="3.5"/>
   ${hl.hist.slice(0,8).map((v,n)=>`<circle cx="${X(n)}" cy="${Y(v)}" r="5.5" fill="#F6B44C" stroke="#fff" stroke-width="1.5"/>`).join("")}
   <text x="${L0+PW/2}" y="${H-2}" fill="#F1EFF8" font-size="13" text-anchor="middle">Half-lives (shakes)</text>
   <text x="${L0+PW-4}" y="${B0-PH+14}" fill="#63E0D4" font-size="12" text-anchor="end">--- perfect halving</text>
   <text x="${L0+PW-4}" y="${B0-PH+30}" fill="#F6B44C" font-size="12" text-anchor="end">— our sample</text></svg>`;
  const n=hl.hist.length-1,p=hl.hist[n];$("#hN").textContent=n;$("#hP").textContent=p;$("#hD").textContent=100-p;
  const age=n*704;$("#hAge").innerHTML=age>=1000?`${(age/1000).toFixed(age%1000?3:1).replace(/0+$/,'').replace(/\.$/,'')} <small>billion yrs</small>`:`${age} <small>million yrs</small>`}
 $("#hShake").onclick=()=>{if(hl.hist.length>=8){toast("Max 7 half-lives — hit Reset!");return}
  const els=host.children;let left=0;hl.atoms=hl.atoms.map((a,i)=>{if(a&&Math.random()<.5){els[i].classList.add("d","flip");return 0}if(a)left++;return a});
  hl.hist.push(left);tone(300,.06,"square");setTimeout(sfx.good,250);plot()};
 $("#hReset").onclick=()=>{hl={atoms:Array(100).fill(1),hist:[100]};[...host.children].forEach(e=>e.classList.remove("d","flip"));tone(520,.08);plot()};
 plot()}

/* ================= OUTCROP (relative dating) ================= */
function strataSVG(){const W=1100,H=210;
 const layers=[["A",12,52,"#7d5a3c","soil"],["B",52,100,"#9aa0a8","lime"],["C",100,148,"#4c4a5a","shale"],["D",148,198,"#d4b483","sand"]];
 let p=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rock outcrop with layers A to D and a dike X cutting through B, C and D"><defs>
  <pattern id="pLime" width="40" height="16" patternUnits="userSpaceOnUse"><rect width="40" height="16" fill="#9aa0a8"/><path d="M0 0H40M0 8H40M10 0V8M30 8V16" stroke="#7f858e" stroke-width="1.5"/></pattern>
  <pattern id="pShale" width="30" height="8" patternUnits="userSpaceOnUse"><rect width="30" height="8" fill="#4c4a5a"/><path d="M0 4H22" stroke="#6a6880" stroke-width="1.5"/></pattern>
  <pattern id="pSand" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d4b483"/><circle cx="4" cy="4" r="1.4" fill="#a8885a"/><circle cx="11" cy="10" r="1.2" fill="#a8885a"/></pattern>
  <pattern id="pSoil" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#7d5a3c"/><circle cx="6" cy="9" r="2" fill="#6a4a30"/></pattern></defs>
  <rect width="${W}" height="${H}" fill="#0c0d22"/>`;
 const fill={soil:"url(#pSoil)",lime:"url(#pLime)",shale:"url(#pShale)",sand:"url(#pSand)"};
 layers.forEach(([n,y0,y1,c,k])=>{p+=`<rect x="0" y="${y0}" width="${W}" height="${y1-y0}" fill="${fill[k]}"/>`});
 p+=`<path d="M0 12 Q 150 4 300 12 T 600 12 T 900 10 T 1100 12" stroke="#5fae5a" stroke-width="6" fill="none"/>`;
 p+=`<polygon points="640,198 700,198 690,150 702,100 660,52 628,52 650,100 636,150" fill="#d0452e" stroke="#ff8a6a" stroke-width="2"/>`;
 p+=`<text x="300" y="88" font-size="22">🐚</text><text x="820" y="84" font-size="18">🐚</text>`;
 layers.forEach(([n,y0,y1])=>{p+=`<circle cx="44" cy="${(y0+y1)/2}" r="17" fill="#0c0d22" stroke="#FFD37E" stroke-width="2.5"/><text x="44" y="${(y0+y1)/2+7}" font-size="19" font-weight="700" fill="#FFD37E" text-anchor="middle" font-family="Georgia">${n}</text>`});
 p+=`<circle cx="760" cy="150" r="17" fill="#0c0d22" stroke="#ff8a6a" stroke-width="2.5"/><text x="760" y="157" font-size="19" font-weight="700" fill="#ff8a6a" text-anchor="middle" font-family="Georgia">X</text><path d="M742 150 H704" stroke="#ff8a6a" stroke-width="2"/>`;
 p+=`<text x="1090" y="30" font-size="13" fill="#F1EFF8" text-anchor="end" font-family="monospace">dike X = igneous rock that squeezed up through cracks</text>`;
 return p+`</svg>`}

/* ================= INTERACTIONS ================= */
function reveal(){const s=S[cur];if(s.done||cdBusy)return;clearInterval(tInt);
 countdown(()=>{s.done=true;sfx.level();render(true)})}
function placeNext(){const s=S[cur];if(s.done)return;const btn=stage.querySelector(`.tile[data-i="${s.next}"]`);if(btn)btn.click()}
function moreClue(){const s=S[cur];if(s.done||s.shown>=3)return;s.shown++;tone(420,.08);render(true)}

function wire(){
 wireAward();wireTimer();
 const rb=stage.querySelector("[data-reveal]");if(rb)rb.onclick=reveal;
 const mb=stage.querySelector("[data-more]");if(mb)mb.onclick=moreClue;
 const s=S[cur];
 if(s.t==="order")stage.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
   const i=+t.dataset.i;if(s.done)return;
   if(i===s.next){s.next++;sfx.good();if(s.next===s.items.length){s.done=true;setTimeout(sfx.level,200)}render(true)}
   else{sfx.bad();t.classList.remove("shake");void t.offsetWidth;t.classList.add("shake")}});
 if(s.t==="cer"){
   stage.querySelectorAll("[data-ct]").forEach(t=>t.onclick=()=>{if(s.done)return;const i=+t.dataset.ct;s.sel=s.sel===i?null:i;tone(500,.05);render(true)});
   stage.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(s.done||s.sel==null)return;
     if(CER_TILES[s.sel].b===b.dataset.b){s.placed.push(s.sel);s.sel=null;sfx.good();if(s.placed.length===CER_TILES.length){s.done=true;setTimeout(sfx.level,200)}render(true)}
     else{sfx.bad();b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}});}
 if(s.t==="round"){const e=$("#evo");if(e&&s.stage>0)setTimeout(()=>{e.innerHTML=earth(s.stage,170);sfx.rumble()},450)}
 if(s.t==="drill")drill();
 if(s.t==="seismic")seismic();
 if(s.t==="cycle")cycle();
 if(s.t==="mohs")mohs();
 if(s.t==="halflife")halflife();
 if(s.t==="final")coreBlast();
}
function render(same){
 const s=S[cur];clearInterval(tInt);stopAnims();
 stage.innerHTML=R[s.t](s);if(same)stage.firstElementChild.classList.add('same');
 paintTrack(s.t==="round"&&s.stage>0&&!same?s.stage-1:s.stage);
 if(s.t==="round"&&s.stage>0&&!same)setTimeout(()=>paintTrack(s.stage),450);
 $("#cur").textContent=cur+1;$("#tot").textContent=S.length;
 $("#prev").disabled=cur===0;$("#next").textContent=cur===S.length-1?"Restart ↺":"Next →";
 [...$("#dots").children].forEach((d,i)=>{d.classList.toggle("on",i===cur);d.classList.toggle("seen",i<cur)});
 wire();
}
function go(i){if(cdBusy)return;cur=Math.max(0,Math.min(S.length-1,i));render()}
let restartArmed=false;
function restart(){if(!restartArmed){restartArmed=true;$("#next").textContent="Click again to reset";setTimeout(()=>{restartArmed=false;if(cur===S.length-1)$("#next").textContent="Restart ↺"},2500);return}
 restartArmed=false;S.forEach(s=>{delete s.done;delete s.awarded;delete s.order;delete s.next;delete s.shown;delete s.placed;delete s.sel});
 score.chat=score.cos=score.streak=0;drillV=0;seis={tP:null,tS:null};cyc={at:"ig",steps:0,log:[],m:3,busy:false};
 mo={m:0,tests:[[],[],[]],rev:[false,false,false]};hl={atoms:Array(100).fill(1),hist:[100]};paintScore();go(0)}
$("#next").onclick=()=>cur===S.length-1?restart():go(cur+1);
$("#prev").onclick=()=>go(cur-1);
S.forEach((s,i)=>{const d=document.createElement("i");if(s.t==="round")d.className="rd";d.title=s.t==="round"?`Round ${s.n}: ${s.name}`:`Slide ${i+1}`;d.onclick=()=>go(i);$("#dots").appendChild(d)});

addEventListener("keydown",e=>{
 if(cdBusy)return;if(e.target&&e.target.tagName==="INPUT"&&(e.key==="ArrowRight"||e.key==="ArrowLeft"))return;
 const s=S[cur];
 if(e.key==="ArrowRight"){e.preventDefault();if(cur<S.length-1)go(cur+1)}
 else if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}
 else if(e.key===" "){e.preventDefault();
   if(!s.done&&["mc","tf","mathq"].includes(s.t))reveal();
   else if(!s.done&&s.t==="order")placeNext();
   else if(!s.done&&s.t==="who"){s.shown<3?moreClue():reveal()}
   else if(cur<S.length-1)go(cur+1)}
 else if((e.key==="c"||e.key==="C")&&(s.done||LABS.includes(s.t)))award("chat");
 else if((e.key==="x"||e.key==="X")&&(s.done||LABS.includes(s.t)))award("cos");
});

/* ================= EMBERS + CORE BLAST ================= */
(function embers(){const c=$("#emberCanvas"),x=c.getContext("2d");let W,H,pts=[];
 const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const mk=(y)=>({x:Math.random()*W,y:y==null?Math.random()*H:H+10,r:Math.random()*1.8+.4,vy:.2+Math.random()*.6,vx:(Math.random()-.5)*.25,p:Math.random()*6.3,h:Math.random()});
 function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);pts=Array.from({length:Math.round(W*H/26000)},()=>mk())}
 size();addEventListener("resize",size);
 (function loop(t){x.clearRect(0,0,W,H);pts.forEach((p,i)=>{if(!still){p.y-=p.vy;p.x+=p.vx+Math.sin(t/1400+p.p)*.15;if(p.y<-10)pts[i]=mk(1)}
   const a=.25+.55*Math.abs(Math.sin(p.p+t/900)),warm=p.y/H;x.globalAlpha=a*(.15+warm*.45);
   x.fillStyle=p.h<.6?`rgb(255,${Math.round(120+p.h*140)},60)`:"#FFE6B0";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  x.globalAlpha=1;if(!still)requestAnimationFrame(loop)})(0)})();

function coreBlast(){[98,131,165,196,262,330,392,523,659].forEach((f,i)=>tone(f,.6,"triangle",i*.05,.08));
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#boom"),x=c.getContext("2d"),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
 const cols=["#FFFFFF","#FFF0C2","#FFE08A","#FFD24A","#FF9A2E","#FF7A3D","#F0674F","#B83A28"],cx=innerWidth/2,cy=innerHeight*.28,ps=[];
 for(let i=0;i<420;i++){const a=Math.random()*6.283,v=1.5+Math.random()*11;ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*3.2,c:cols[i%8],l:1})}
 let f=0;(function step(){x.clearRect(0,0,innerWidth,innerHeight);
  if(f<14){x.fillStyle=`rgba(255,220,170,${.7-f*.05})`;x.fillRect(0,0,innerWidth,innerHeight)}
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.988;p.vy*=.99;p.l-=.0055;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  x.globalAlpha=1;f++;if(f<190)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)})()}

fit();paintScore();render();
</script>
